[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simorgh-core"
version = "0.1.0"
description = "Persian-first personal agent operating system core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "openai>=1.99,<2.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services/core/src/simorgh_core"]

[tool.pytest.ini_options]
pythonpath = ["services/core/src"]
testpaths = ["services/core/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/core/src", "services/core/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"services/core/src/simorgh_core/agents/sqlite_trace_store.py" = ["RUF022"]
"services/core/src/simorgh_core/agents/trace_contracts.py" = ["RUF022"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["simorgh_core"]
mypy_path = "services/core/src"
