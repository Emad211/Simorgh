name: PR44 Phase 1.3 Documentation Diagnostic

on:
  push:
    branches:
      - core/specialist-execution-runtime-clean
    paths:
      - .github/workflows/pr44-documentation-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr44-phase13-documentation-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run embedded documentation transition ephemerally
        shell: bash
        run: |
          set +e
          python - <<'PY' > "$RUNNER_TEMP/diagnostic.log" 2>&1
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              '.github/workflows/pr44-documentation-finalization.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          print(f'start_count={source.count(start_marker)}')
          if source.count(start_marker) != 1:
              raise SystemExit('documentation Python start marker is not unique')
          remainder = source.split(start_marker, 1)[1]
          print(f'end_count={remainder.count(end_marker)}')
          if remainder.count(end_marker) != 1:
              raise SystemExit('documentation Python end marker is not unique')
          embedded = dedent(remainder.split(end_marker, 1)[0])
          print(f'embedded_bytes={len(embedded.encode("utf-8"))}')
          exec(
              compile(embedded, 'pr44-documentation-embedded.py', 'exec'),
              {'__name__': '__main__'},
          )
          print('documentation_patch_status=0')
          PY
          status=$?
          {
            echo "head=$GITHUB_SHA"
            echo "documentation_patch_status=$status"
            echo "--- diagnostic_tail ---"
            tail -c 14000 "$RUNNER_TEMP/diagnostic.log"
          } > "$RUNNER_TEMP/report.txt"
          cat "$RUNNER_TEMP/report.txt"
          exit 0

      - name: Report documentation diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body=$(python - <<'PY'
          from pathlib import Path
          text = Path('${{ runner.temp }}/report.txt').read_text(
              encoding='utf-8', errors='replace'
          )
          print('PR #44 documentation diagnostic — no product or documentation files persisted.\n\n```text\n' + text + '\n```')
          PY
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/44/comments" -f body="$body"
