name: Phase 1.9 Direct Routed Trace Diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 70
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: core/live-provider-staging
          fetch-depth: 20
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Apply candidate and expose safe test-only state
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_phase19_direct_routed_trace.py
          python - <<'PY'
          from pathlib import Path

          cli = Path("services/core/src/simorgh_core/agents/live_provider_staging_cli.py")
          text = cli.read_text(encoding="utf-8")
          text = text.replace(
              "    id_factory: Callable[[], UUID] = uuid4,\n) -> LiveProviderStagingArtifact:\n",
              "    id_factory: Callable[[], UUID] = uuid4,\n"
              "    propagate_internal_errors: bool = False,\n"
              ") -> LiveProviderStagingArtifact:\n",
          )
          text = text.replace(
              "            await agent_task_control_plane.submit(\n"
              "                reviewed_live_provider_staging_task(\n"
              "                    request_id=request.request_id,\n"
              "                    received_at_ms=now(),\n"
              "                    policy=policy,\n"
              "                )\n"
              "            )\n",
              "            submitted = await agent_task_control_plane.submit(\n"
              "                reviewed_live_provider_staging_task(\n"
              "                    request_id=request.request_id,\n"
              "                    received_at_ms=now(),\n"
              "                    policy=policy,\n"
              "                )\n"
              "            )\n"
              "            decision = submitted.routing_decision\n"
              "            print({\n"
              "                'task_phase': submitted.phase.value,\n"
              "                'routing_state': decision.state.value if decision else None,\n"
              "                'selected_agent_id': decision.selected_agent_id if decision else None,\n"
              "                'selected_agent_version': decision.selected_agent_version if decision else None,\n"
              "            })\n",
          )
          replacements = (
              (
                  "            except BaseException:\n"
                  "                failure_code = LiveProviderStagingArtifactFailureCode.EXECUTION_FAILED\n",
                  "            except BaseException:\n"
                  "                print({\n"
                  "                    'invocations': [\n"
                  "                        {\n"
                  "                            'agent_id': item.agent_id,\n"
                  "                            'agent_version': item.agent_version,\n"
                  "                            'kind': item.kind.value,\n"
                  "                            'state': item.state.value,\n"
                  "                            'parent': item.parent_invocation_id is not None,\n"
                  "                            'cancellation_owner': item.cancellation_owner_id is not None,\n"
                  "                        }\n"
                  "                        for item in invocations.list_owned(request_id=request.request_id)\n"
                  "                    ],\n"
                  "                    'trace_events': [\n"
                  "                        {\n"
                  "                            'kind': event.event_kind.value,\n"
                  "                            'stage': event.stage.value,\n"
                  "                            'invocation_id': str(event.invocation_id) if event.invocation_id else None,\n"
                  "                        }\n"
                  "                        for event in traces.view(request.request_id).events\n"
                  "                    ],\n"
                  "                })\n"
                  "                if propagate_internal_errors:\n"
                  "                    raise\n"
                  "                failure_code = LiveProviderStagingArtifactFailureCode.EXECUTION_FAILED\n",
              ),
              (
                  "                except Exception:\n"
                  "                    failure_code = LiveProviderStagingArtifactFailureCode.TRACE_INVALID\n",
                  "                except Exception:\n"
                  "                    if propagate_internal_errors:\n"
                  "                        raise\n"
                  "                    failure_code = LiveProviderStagingArtifactFailureCode.TRACE_INVALID\n",
              ),
              (
                  "                    except BaseException:\n"
                  "                        failure_code = (\n",
                  "                    except BaseException:\n"
                  "                        if propagate_internal_errors:\n"
                  "                            raise\n"
                  "                        failure_code = (\n",
              ),
              (
                  "    except BaseException:\n"
                  "        failure_code = LiveProviderStagingArtifactFailureCode.EXECUTION_FAILED\n",
                  "    except BaseException:\n"
                  "        if propagate_internal_errors:\n"
                  "            raise\n"
                  "        failure_code = LiveProviderStagingArtifactFailureCode.EXECUTION_FAILED\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError("diagnostic CLI anchor changed")
              text = text.replace(old, new)
          cli.write_text(text, encoding="utf-8")

          tests = Path("services/core/tests/test_live_provider_staging_cli.py")
          test_text = tests.read_text(encoding="utf-8")
          old = "        id_factory=ids.__next__,\n"
          new = old + "        propagate_internal_errors=True,\n"
          if test_text.count(old) != 2:
              raise RuntimeError("diagnostic test anchors changed")
          tests.write_text(test_text.replace(old, new), encoding="utf-8")
          PY
          pytest services/core/tests/test_live_provider_staging_cli.py -x -vv -s
