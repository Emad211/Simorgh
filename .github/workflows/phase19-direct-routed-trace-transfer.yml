name: Phase 1.9 Direct Routed Trace Transfer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-publish:
    if: github.event.pull_request.number == 70
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: core/live-provider-staging
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Apply, validate, and publish product commit
        shell: bash
        run: |
          set -euo pipefail
          baseline=44bfe673818c11cc080576ca91fb52ba6f9519b7
          test "$(git merge-base HEAD "$baseline")" = "$baseline"

          actual="$(git diff --name-only "$baseline"..HEAD | sort)"
          expected=$'.github/workflows/phase19-direct-routed-trace-transfer.yml\ntools/apply_phase19_direct_routed_trace.py'
          test "$actual" = "$expected"

          python tools/apply_phase19_direct_routed_trace.py
          ruff check . --exclude tools/apply_phase19_direct_routed_trace.py --fix
          ruff check . --exclude tools/apply_phase19_direct_routed_trace.py
          mypy services/core/src
          pytest
          git diff --check

          rm tools/apply_phase19_direct_routed_trace.py
          rm .github/workflows/phase19-direct-routed-trace-transfer.yml
          ruff check .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          actual="$(git diff --cached --name-only "$baseline" | sort)"
          expected=$'docs/validation/phase-1-9-manual-staging-boundary.md\nservices/core/src/simorgh_core/agents/contracts.py\nservices/core/src/simorgh_core/agents/defaults.py\nservices/core/src/simorgh_core/agents/live_provider_staging_cli.py\nservices/core/src/simorgh_core/agents/trace_child_invocations.py\nservices/core/src/simorgh_core/agents/trace_reconciliation.py\nservices/core/tests/test_live_provider_staging_cli.py\nservices/core/tests/test_trace_child_invocations.py'
          test "$actual" = "$expected"
          git diff --cached --check

          git commit -m "core: trace directly routed staging invocation"
          git push origin HEAD:core/live-provider-staging
