name: PR44 Publish Accepted Phase 1.3 Documentation

on:
  push:
    branches:
      - core/specialist-execution-runtime-clean
    paths:
      - .github/workflows/pr44-documentation-final.yml

permissions:
  contents: write

concurrency:
  group: pr44-phase13-documentation-finalization
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply the audited documentation transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              '.github/workflows/pr44-documentation-finalization.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1:
              raise SystemExit('documentation Python start marker is not unique')
          remainder = source.split(start_marker, 1)[1]
          if remainder.count(end_marker) != 1:
              raise SystemExit('documentation Python end marker is not unique')
          embedded = dedent(remainder.split(end_marker, 1)[0])
          exec(
              compile(embedded, 'pr44-documentation-embedded.py', 'exec'),
              {'__name__': '__main__'},
          )
          PY
          rm -f .github/workflows/pr44-documentation-finalization.yml
          rm -f .github/workflows/pr44-documentation-diagnostic.yml
          rm -f .github/workflows/pr44-documentation-final.yml
          git diff --check

      - name: Validate the accepted documentation state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expectations = {
              'docs/adr/0016-native-specialist-execution-authority.md': (
                  '- Status: Accepted',
                  '- Implementation PR: #44',
                  'concrete bounded `SpecialistPlanPayload`',
                  'cancellation_owner_id',
                  'effective budget and monotonic timeout',
              ),
              'docs/IMPLEMENTATION_MASTER_PLAN.md': (
                  'Phase 1.3 Specialist Execution           VALIDATING — issue #40 / PR #44',
                  'Issue #40; Draft PR #44. ADR 0016 accepted.',
                  'concrete `SpecialistPlanPayload`',
                  'privacy-safe process-local specialist start/completion/failure/replay traces',
              ),
              'docs/AGENT_RUNTIME.md': (
                  'validating in PR #44',
                  'PR #44 adds an internal control-plane method',
                  'per-invocation cancellation-owner identity',
                  '#40 / PR #44 validate the native specialist execution interface',
              ),
              'docs/README.md': (
                  'PR #44 validates an internal zero-external specialist execution runtime.',
                  'issue #40 / PR #44 — native typed specialist execution, validating;',
              ),
              'docs/SPECIALIST_EXECUTION.md': (
                  'Draft PR #44; ADR 0016 is accepted.',
                  'stable `context_bundle_id`',
                  'stable per-invocation `cancellation_owner_id`',
                  'concrete bounded `SpecialistPlanPayload`',
                  'privacy-safe specialist start/completion/failure/replay traces',
              ),
          }
          for path, required in expectations.items():
              text = Path(path).read_text(encoding='utf-8')
              for value in required:
                  if value not in text:
                      raise SystemExit(f'{path}: missing expected text {value!r}')
          PY

      - name: Commit accepted documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: accept ADR 0016 and align Phase 1.3 with PR 44'
          git push origin HEAD:core/specialist-execution-runtime-clean
