name: PR44 Final Specialist Authority Contract

on:
  push:
    branches:
      - core/specialist-execution-runtime-clean
    paths:
      - .github/workflows/pr44-authority-contract-final.yml

permissions:
  contents: write

concurrency:
  group: pr44-specialist-authority-contract
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply audited authority patch and exact fixture budget
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          authority_test = Path(
              'services/core/tests/test_specialist_authority_hardening.py'
          )
          test_text = authority_test.read_text(encoding='utf-8')
          old = (
              '        execution_mode=ExecutionMode.PLAN,\n'
              '        allowed_data_sources=frozenset(),\n'
              '    )\n'
          )
          new = (
              '        execution_mode=ExecutionMode.PLAN,\n'
              '        allowed_data_sources=frozenset(),\n'
              '        budget=default_specialist_registry()\n'
              '        .get("development.planner")\n'
              '        .budget_ceiling,\n'
              '    )\n'
          )
          if test_text.count(old) != 1:
              raise SystemExit(
                  f'authority fixture anchor count={test_text.count(old)}, expected=1'
              )
          authority_test.write_text(test_text.replace(old, new, 1), encoding='utf-8')

          source = Path('.github/workflows/pr44-authority-contract.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1:
              raise SystemExit('authority workflow Python start marker is not unique')
          remainder = source.split(start_marker, 1)[1]
          if remainder.count(end_marker) != 1:
              raise SystemExit('authority workflow Python end marker is not unique')
          embedded = dedent(remainder.split(end_marker, 1)[0])
          namespace = {'__name__': '__main__'}
          exec(compile(embedded, 'pr44-authority-contract-embedded.py', 'exec'), namespace)
          PY
          rm -f .github/workflows/pr44-authority-contract.yml
          rm -f .github/workflows/pr44-authority-contract-final.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate complete specialist authority
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest

      - name: Commit validated specialist authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: complete typed specialist authority and private trace'
          git push origin HEAD:core/specialist-execution-runtime-clean
