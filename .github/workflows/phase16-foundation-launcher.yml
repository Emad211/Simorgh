name: Phase 1.6 Foundation Launcher v5

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase16-foundation-launcher.yml

permissions:
  contents: write

concurrency:
  group: phase16-cancellation-foundation
  cancel-in-progress: false

jobs:
  launch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply embedded foundation patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY' > "$RUNNER_TEMP/phase16-patch.log" 2>&1
          from pathlib import Path

          source = Path(
              ".github/workflows/phase16-cancellation-foundation.yml"
          ).read_text(encoding="utf-8")
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if source.count(start) != 1:
              raise SystemExit("foundation start marker is not unique")
          remainder = source.split(start, 1)[1]
          if remainder.count(end) != 1:
              raise SystemExit("foundation end marker is not unique")
          raw = remainder.split(end, 1)[0]
          embedded = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          )
          exec(compile(embedded, "phase16-foundation.py", "exec"), {"__name__": "__main__"})
          PY
          status=$?
          if [[ "$status" == "0" ]]; then
            rm -f .github/workflows/phase16-cancellation-foundation.yml
            rm -f .github/workflows/phase16-foundation-launcher.yml
            git diff --check >> "$RUNNER_TEMP/phase16-patch.log" 2>&1
            status=$?
          fi
          echo "patch_status=$status" >> "$RUNNER_TEMP/phase16-patch.log"
          exit "$status"

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16-foundation-patch-diagnostic
          path: ${{ runner.temp }}/phase16-patch.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop on patch failure
        if: steps.patch.outcome != 'success'
        shell: bash
        run: exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run complete Core gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix services/core/src/simorgh_core/agents/invocations.py services/core/src/simorgh_core/agents/invocation_store.py services/core/src/simorgh_core/agents/cancellation_contracts.py services/core/tests/test_cancellation_invocation_authority.py
          ruff check .
          mypy services/core/src
          pytest

      - name: Publish exact validated foundation
        shell: bash
        env:
          BRANCH: core/cancellation-propagation
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: add durable invocation cancellation fences'
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo "Branch moved during validation: $remote_head != $EXPECTED_HEAD" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
