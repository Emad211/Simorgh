name: PR39 Canonical Invocation State Diagnostic

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-invocation-state-anchor-fix
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply correction in diagnostic workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/core/src/simorgh_core/agents/invocations.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('from typing import Any, Protocol, Self\n', 'from typing import Any, Literal, Protocol, Self, TypeAlias\n'),
              ('from simorgh_core.agents.contracts import UsageVector\n', 'from simorgh_core.agents.contracts import InvocationState, UsageVector\n'),
              (
                  '''class InvocationPhase(StrEnum):
              PENDING = "pending"
              RESERVED = "reserved"
              COMPLETED = "completed"
              FAILED = "failed"
              CANCELLED = "cancelled"
              EXPIRED = "expired"
              UNKNOWN = "unknown"
              UNKNOWN_SIDE_EFFECT = "unknown_side_effect"


          class InvocationKind(StrEnum):
          '''.replace('          ', ''),
                  '''InvocationPhase: TypeAlias = InvocationState


          class InvocationKind(StrEnum):
          '''.replace('          ', ''),
              ),
          ]
          current = text
          for old, new in replacements:
              if current.count(old) != 1 or current.count(new) != 0:
                  raise SystemExit(
                      f'invalid anchor state old={current.count(old)} final={current.count(new)}'
                  )
              current = current.replace(old, new, 1)
          path.write_text(current, encoding='utf-8')
          PY
          python -m py_compile services/core/src/simorgh_core/agents/invocations.py

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Ruff diagnostic
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check services/core/src/simorgh_core/agents/invocations.py \
            2>&1 | tee "$RUNNER_TEMP/ruff.log"

      - name: MyPy diagnostic
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy services/core/src/simorgh_core/agents/invocations.py \
            2>&1 | tee "$RUNNER_TEMP/mypy.log"

      - name: Focused test diagnostic
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            services/core/tests/test_agent_invocations.py \
            services/core/tests/test_durable_invocation_store.py \
            2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Publish validation diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          temp = Path(os.environ['RUNNER_TEMP'])
          sections = [
              '<!-- pr39-rc3-status -->',
              'Canonical InvocationState validation diagnostic:',
              '',
              f"- Head: `{os.environ['GITHUB_SHA']}`",
              f"- Ruff: **{os.environ.get('RUFF_OUTCOME', 'not-run')}**",
              f"- MyPy: **{os.environ.get('MYPY_OUTCOME', 'not-run')}**",
              f"- Focused tests: **{os.environ.get('TEST_OUTCOME', 'not-run')}**",
              f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ]
          for title, filename in (
              ('Ruff tail', 'ruff.log'),
              ('MyPy tail', 'mypy.log'),
              ('Test tail', 'tests.log'),
          ):
              path = temp / filename
              if path.is_file():
                  sections.extend([
                      '',
                      f'### {title}',
                      '```text',
                      path.read_text(encoding='utf-8', errors='replace')[-5000:],
                      '```',
                  ])
          body = '\n'.join(sections)
          (temp / 'comment.json').write_text(json.dumps({'body': body}), encoding='utf-8')
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            --input "$RUNNER_TEMP/comment.json"
