name: PR39 AST-Verified Invocation State Correction

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr39-invocation-state-anchor-fix
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply AST-verified correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          def enum_members(node: ast.ClassDef) -> list[tuple[str, str]]:
              members: list[tuple[str, str]] = []
              for statement in node.body:
                  if not isinstance(statement, ast.Assign) or len(statement.targets) != 1:
                      continue
                  target = statement.targets[0]
                  value = statement.value
                  if (
                      isinstance(target, ast.Name)
                      and isinstance(value, ast.Constant)
                      and isinstance(value.value, str)
                  ):
                      members.append((target.id, value.value))
              return members

          contracts_path = Path('services/core/src/simorgh_core/agents/contracts.py')
          contracts_text = contracts_path.read_text(encoding='utf-8')
          contracts_tree = ast.parse(contracts_text)
          state_nodes = [
              node for node in contracts_tree.body
              if isinstance(node, ast.ClassDef) and node.name == 'InvocationState'
          ]
          if len(state_nodes) != 1:
              raise SystemExit(f'expected one InvocationState class, found {len(state_nodes)}')
          state_node = state_nodes[0]
          expected_current = [
              ('PENDING', 'pending'),
              ('COMPLETED', 'completed'),
              ('FAILED', 'failed'),
              ('CANCELLED', 'cancelled'),
              ('EXPIRED', 'expired'),
          ]
          if enum_members(state_node) != expected_current:
              raise SystemExit(
                  f'unexpected InvocationState members: {enum_members(state_node)!r}'
              )
          contracts_lines = contracts_text.splitlines(keepends=True)
          canonical_state = (
              'class InvocationState(StrEnum):\n'
              '    PENDING = "pending"\n'
              '    RESERVED = "reserved"\n'
              '    COMPLETED = "completed"\n'
              '    FAILED = "failed"\n'
              '    CANCELLED = "cancelled"\n'
              '    EXPIRED = "expired"\n'
              '    UNKNOWN = "unknown"\n'
              '    UNKNOWN_SIDE_EFFECT = "unknown_side_effect"\n'
          )
          contracts_lines[state_node.lineno - 1 : state_node.end_lineno] = [canonical_state]
          contracts_path.write_text(''.join(contracts_lines), encoding='utf-8')

          invocations_path = Path('services/core/src/simorgh_core/agents/invocations.py')
          invocations_text = invocations_path.read_text(encoding='utf-8')
          invocations_tree = ast.parse(invocations_text)

          phase_nodes = [
              node for node in invocations_tree.body
              if isinstance(node, ast.ClassDef) and node.name == 'InvocationPhase'
          ]
          if len(phase_nodes) != 1:
              raise SystemExit(f'expected one InvocationPhase class, found {len(phase_nodes)}')
          phase_node = phase_nodes[0]
          expected_phase = [
              ('PENDING', 'pending'),
              ('RESERVED', 'reserved'),
              ('COMPLETED', 'completed'),
              ('FAILED', 'failed'),
              ('CANCELLED', 'cancelled'),
              ('EXPIRED', 'expired'),
              ('UNKNOWN', 'unknown'),
              ('UNKNOWN_SIDE_EFFECT', 'unknown_side_effect'),
          ]
          if enum_members(phase_node) != expected_phase:
              raise SystemExit(
                  f'unexpected InvocationPhase members: {enum_members(phase_node)!r}'
              )

          typing_imports = [
              node for node in invocations_tree.body
              if isinstance(node, ast.ImportFrom) and node.module == 'typing'
          ]
          contract_imports = [
              node for node in invocations_tree.body
              if isinstance(node, ast.ImportFrom)
              and node.module == 'simorgh_core.agents.contracts'
          ]
          if len(typing_imports) != 1 or [alias.name for alias in typing_imports[0].names] != [
              'Any', 'Protocol', 'Self'
          ]:
              raise SystemExit('unexpected typing import shape')
          if len(contract_imports) != 1 or [alias.name for alias in contract_imports[0].names] != [
              'UsageVector'
          ]:
              raise SystemExit('unexpected agent-contract import shape')

          lines = invocations_text.splitlines(keepends=True)
          edits = [
              (
                  typing_imports[0].lineno - 1,
                  typing_imports[0].end_lineno,
                  'from typing import Any, Literal, Protocol, Self, TypeAlias\n',
              ),
              (
                  contract_imports[0].lineno - 1,
                  contract_imports[0].end_lineno,
                  'from simorgh_core.agents.contracts import InvocationState, UsageVector\n',
              ),
              (
                  phase_node.lineno - 1,
                  phase_node.end_lineno,
                  'InvocationPhase: TypeAlias = InvocationState\n',
              ),
          ]
          for start, end, replacement in sorted(edits, reverse=True):
              lines[start:end] = [replacement]
          invocations_path.write_text(''.join(lines), encoding='utf-8')
          PY
          python -m py_compile \
            services/core/src/simorgh_core/agents/contracts.py \
            services/core/src/simorgh_core/agents/invocations.py

      - name: Install and validate runtime compatibility
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          mypy \
            services/core/src/simorgh_core/agents/contracts.py \
            services/core/src/simorgh_core/agents/invocations.py
          pytest -q \
            services/core/tests/test_agent_invocations.py \
            services/core/tests/test_durable_invocation_store.py

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr39-invocation-state-anchor-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: complete canonical invocation state contract'
          git push origin HEAD:core/durable-agent-invocation-store

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NEW_HEAD=$(git rev-parse HEAD)
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          Canonical InvocationState preflight correction: **passed and pushed**

          - Triggering head: \`${GITHUB_SHA}\`
          - Corrected head: \`${NEW_HEAD}\`
          - AST contract validation: passed
          - Runtime compatibility / MyPy / focused tests: passed
          - Next: RC3 exact-head preflight and transactional apply"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          Canonical InvocationState preflight correction: **failed closed**

          - Triggering head: \`${GITHUB_SHA}\`
          - No product correction was claimed.
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
