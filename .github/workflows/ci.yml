name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  phase15-security-hardening:
    if: github.head_ref == 'core/governed-github-read-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply reviewed security patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/phase15-security-patch.py.b64 > /tmp/phase15_security_patch.py
          python -m py_compile /tmp/phase15_security_patch.py
          python /tmp/phase15_security_patch.py 2>&1 | tee /tmp/phase15-security-patch.log
          rm -f .github/phase15-security-patch.py.b64
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate full Core security boundary
        id: validate
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip > /tmp/pip-upgrade.log 2>&1
          pip_upgrade_status=$?
          pip install -e '.[dev]' > /tmp/install.log 2>&1
          install_status=$?
          ruff format \
            services/core/src/simorgh_core/agents/github_read_service.py \
            services/core/tests/test_github_read_security_boundary.py \
            > /tmp/ruff-format.log 2>&1
          format_status=$?
          ruff check --fix \
            services/core/src/simorgh_core/agents/github_read_service.py \
            services/core/tests/test_github_read_security_boundary.py \
            > /tmp/ruff-fix.log 2>&1
          ruff_fix_status=$?
          ruff check . > /tmp/ruff.log 2>&1
          ruff_status=$?
          mypy services/core/src > /tmp/mypy.log 2>&1
          mypy_status=$?
          pytest > /tmp/pytest.log 2>&1
          pytest_status=$?
          git diff --check > /tmp/diff-check.log 2>&1
          diff_status=$?
          {
            echo "pip_upgrade_status=$pip_upgrade_status"
            echo "install_status=$install_status"
            echo "format_status=$format_status"
            echo "ruff_fix_status=$ruff_fix_status"
            echo "ruff_status=$ruff_status"
            echo "mypy_status=$mypy_status"
            echo "pytest_status=$pytest_status"
            echo "diff_status=$diff_status"
            echo
            echo "=== ruff ==="
            cat /tmp/ruff.log
            echo
            echo "=== mypy ==="
            cat /tmp/mypy.log
            echo
            echo "=== pytest tail ==="
            tail -n 120 /tmp/pytest.log
            echo
            echo "=== diff stat ==="
            git diff --stat
          } | tee /tmp/phase15-security-report.txt
          if (( pip_upgrade_status || install_status || format_status || ruff_fix_status || ruff_status || mypy_status || pytest_status || diff_status )); then
            exit 1
          fi

      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-security-diagnostic-v3
          path: |
            /tmp/phase15-security-patch.log
            /tmp/phase15-security-report.txt
            /tmp/install.log
            /tmp/ruff-format.log
            /tmp/ruff-fix.log
            /tmp/ruff.log
            /tmp/mypy.log
            /tmp/pytest.log
            /tmp/diff-check.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated hardening
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: close GitHub projection privacy and uncertainty gaps'

      - name: Protected fast-forward push
        if: steps.validate.outcome == 'success'
        shell: bash
        env:
          BRANCH: core/governed-github-read-tools
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo "Branch moved during validation: $remote_head != $EXPECTED_HEAD" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
