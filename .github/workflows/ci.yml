name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          ruff check . 2>&1 | tee artifacts/ruff.log

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          mypy services/core/src 2>&1 | tee artifacts/mypy.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest --junitxml=artifacts/junit.xml 2>&1 | tee artifacts/pytest.log

      - name: Upload core quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-quality-diagnostics
          path: artifacts/*.log
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: artifacts/junit.xml
          if-no-files-found: ignore

  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build, lint, and unit test Android app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          gradle \
            :apps:android:assembleDebug \
            :apps:android:testDebugUnitTest \
            :apps:android:lintDebug \
            --stacktrace 2>&1 | tee artifacts/android-build.log

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: artifacts/android-build.log
          if-no-files-found: error

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-android-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
