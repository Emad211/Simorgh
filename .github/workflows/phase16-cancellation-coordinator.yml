name: Phase 1.6 Cancellation Coordinator Source

on:
  push:
    branches:
      - core/cancellation-propagation
    paths:
      - .github/workflows/phase16-cancellation-coordinator.yml

permissions:
  contents: write

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply coordinator implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_count(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: anchor count {count}, expected {expected}: {old[:100]!r}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          contracts = "services/core/src/simorgh_core/agents/cancellation_contracts.py"
          replace_count(
              contracts,
              "    LATE_REGISTRATION_BLOCKED = \"late_registration_blocked\"\n",
              "    LATE_REGISTRATION_BLOCKED = \"late_registration_blocked\"\n"
              "    SIGNAL_FAILED = \"signal_failed\"\n",
          )

          state = "services/core/src/simorgh_core/agents/task_state.py"
          replace_count(
              state,
              "from simorgh_core.agents.budget import BudgetSnapshot\n",
              "from simorgh_core.agents.budget import BudgetSnapshot\n"
              "from simorgh_core.agents.cancellation_contracts import (\n"
              "    TaskCancellationRequest,\n"
              "    TaskCancellationResult,\n"
              ")\n",
          )
          replace_count(
              state,
              "    cancel_reason: str | None = Field(default=None, max_length=1_000)\n"
              "    detail: str = Field(default=\"\", max_length=2_000)\n",
              "    cancel_reason: str | None = Field(default=None, max_length=1_000)\n"
              "    cancellation_request: TaskCancellationRequest | None = None\n"
              "    cancellation_result: TaskCancellationResult | None = None\n"
              "    detail: str = Field(default=\"\", max_length=2_000)\n",
          )
          replace_count(
              state,
              "        if self.phase == AgentTaskPhase.ROUTING:\n",
              "        if self.cancellation_request is not None:\n"
              "            if self.cancellation_request.request_id != self.request_id:\n"
              "                raise ValueError(\n"
              "                    \"cancellation request does not belong to task record\"\n"
              "                )\n"
              "            if self.phase != AgentTaskPhase.CANCELLED:\n"
              "                raise ValueError(\n"
              "                    \"typed cancellation metadata requires cancelled task phase\"\n"
              "                )\n"
              "        if self.cancellation_result is not None:\n"
              "            if self.cancellation_request is None:\n"
              "                raise ValueError(\n"
              "                    \"cancellation result requires an accepted request\"\n"
              "                )\n"
              "            if self.cancellation_result.request != self.cancellation_request:\n"
              "                raise ValueError(\n"
              "                    \"cancellation result request does not match task authority\"\n"
              "                )\n\n"
              "        if self.phase == AgentTaskPhase.ROUTING:\n",
          )
          replace_count(
              state,
              "            if self.budget.cancelled:\n"
              "                raise ValueError(\"non-cancelled task cannot contain a cancelled budget\")\n",
              "            if self.budget.cancelled:\n"
              "                raise ValueError(\"non-cancelled task cannot contain a cancelled budget\")\n"
              "            if (\n"
              "                self.cancellation_request is not None\n"
              "                or self.cancellation_result is not None\n"
              "            ):\n"
              "                raise ValueError(\n"
              "                    \"non-cancelled task cannot contain cancellation authority\"\n"
              "                )\n",
          )

          task_store = "services/core/src/simorgh_core/agents/task_store.py"
          replace_count(
              task_store,
              "    if (\n"
              "        existing.record.cancel_reason is not None\n"
              "        and candidate.record.cancel_reason != existing.record.cancel_reason\n"
              "    ):\n"
              "        raise AgentTaskStoreConflictError(\"durable cancellation reason is immutable\")\n\n",
              "    if (\n"
              "        existing.record.cancel_reason is not None\n"
              "        and candidate.record.cancel_reason != existing.record.cancel_reason\n"
              "    ):\n"
              "        raise AgentTaskStoreConflictError(\"durable cancellation reason is immutable\")\n"
              "    if (\n"
              "        existing.record.cancellation_request is not None\n"
              "        and candidate.record.cancellation_request\n"
              "        != existing.record.cancellation_request\n"
              "    ):\n"
              "        raise AgentTaskStoreConflictError(\n"
              "            \"durable cancellation request is immutable\"\n"
              "        )\n"
              "    if (\n"
              "        existing.record.cancellation_result is not None\n"
              "        and candidate.record.cancellation_result\n"
              "        != existing.record.cancellation_result\n"
              "    ):\n"
              "        raise AgentTaskStoreConflictError(\n"
              "            \"durable cancellation result is immutable\"\n"
              "        )\n\n",
          )

          specialist_execution = (
              "services/core/src/simorgh_core/agents/specialist_execution.py"
          )
          replace_count(
              specialist_execution,
              "        cancellation_owner_id=uuid5(\n"
              "            NAMESPACE_URL,\n"
              "            f\"simorgh-cancellation:{task.request_id}:{invocation_id}\",\n"
              "        ),\n",
              "        cancellation_owner_id=stable_specialist_cancellation_owner_id(\n"
              "            request_id=task.request_id, invocation_id=invocation_id\n"
              "        ),\n",
          )
          replace_count(
              specialist_execution,
              "def _resolve_task_kind(\n",
              "def stable_specialist_cancellation_owner_id(\n"
              "    *, request_id: UUID, invocation_id: UUID\n"
              ") -> UUID:\n"
              "    return uuid5(\n"
              "        NAMESPACE_URL,\n"
              "        f\"simorgh-cancellation:{request_id}:{invocation_id}\",\n"
              "    )\n\n\n"
              "def _resolve_task_kind(\n",
          )

          specialist_runtime = "services/core/src/simorgh_core/agents/specialist_runtime.py"
          replace_count(
