              "            )\n",
              expected=1,
          )

          specialist_service = "services/core/src/simorgh_core/agents/specialist_service.py"
          replace_count(
              specialist_service,
              "from simorgh_core.agents.contracts import SideEffectPolicy\n",
              "from simorgh_core.agents.cancellation_runtime import (\n"
              "    CancellationOwnerRegistry,\n"
              "    CancellationRegistrationBlockedError,\n"
              "    cancellation_owner_registry,\n"
              ")\n"
              "from simorgh_core.agents.contracts import SideEffectPolicy\n",
          )
          replace_count(
              specialist_service,
              "    SpecialistExecutionPolicyError,\n"
              "    SpecialistExecutionResult,\n",
              "    SpecialistExecutionCancelledError,\n"
              "    SpecialistExecutionPolicyError,\n"
              "    SpecialistExecutionResult,\n",
          )
          replace_count(
              specialist_service,
              "    SpecialistExecutorRegistry,\n"
              ")\n",
              "    SpecialistExecutorRegistry,\n"
              "    stable_specialist_cancellation_owner_id,\n"
              ")\n",
          )
          replace_count(
              specialist_service,
              "        invocation_store: InvocationStore,\n"
              "        wall_clock_millis: Callable[[], int] | None = None,\n",
              "        invocation_store: InvocationStore,\n"
              "        cancellation_registry: CancellationOwnerRegistry | None = None,\n"
              "        wall_clock_millis: Callable[[], int] | None = None,\n",
          )
          replace_count(
              specialist_service,
              "        self._invocations = invocation_store\n"
              "        self._adapter = SpecialistTaskExecutionAdapter(\n",
              "        self._invocations = invocation_store\n"
              "        self._cancellation_owners = (\n"
              "            cancellation_registry or cancellation_owner_registry\n"
              "        )\n"
              "        self._adapter = SpecialistTaskExecutionAdapter(\n",
          )
          replace_count(
              specialist_service,
              "        token = SpecialistCancellation()\n"
              "        with self._lock:\n"
              "            if invocation_id in self._active:\n"
              "                raise SpecialistInvocationInProgressError(\n"
              "                    f\"specialist invocation {invocation_id} is already active\"\n"
              "                )\n"
              "            self._active[invocation_id] = token\n"
              "        try:\n"
              "            return await self._adapter.execute_record(\n",
              "        owner_id = stable_specialist_cancellation_owner_id(\n"
              "            request_id=request_id, invocation_id=invocation_id\n"
              "        )\n"
              "        token = SpecialistCancellation(owner_id=owner_id)\n"
              "        with self._lock:\n"
              "            if invocation_id in self._active:\n"
              "                raise SpecialistInvocationInProgressError(\n"
              "                    f\"specialist invocation {invocation_id} is already active\"\n"
              "                )\n"
              "            self._active[invocation_id] = token\n"
              "        try:\n"
              "            try:\n"
              "                self._cancellation_owners.register(\n"
              "                    request_id=request_id,\n"
              "                    owner_id=owner_id,\n"
              "                    target=token,\n"
              "                )\n"
              "            except CancellationRegistrationBlockedError as exc:\n"
              "                raise SpecialistExecutionCancelledError(\n"
              "                    \"durable task cancellation blocks specialist entry\"\n"
              "                ) from exc\n"
              "            return await self._adapter.execute_record(\n",
          )
          replace_count(
              specialist_service,
              "        finally:\n"
              "            with self._lock:\n"
              "                self._active.pop(invocation_id, None)\n",
              "        finally:\n"
              "            self._cancellation_owners.unregister(\n"
              "                request_id=request_id,\n"
              "                owner_id=owner_id,\n"
              "                target=token,\n"
              "            )\n"
              "            with self._lock:\n"
              "                self._active.pop(invocation_id, None)\n",
          )

          tool_gateway = "services/core/src/simorgh_core/agents/tool_gateway.py"
          replace_count(
              tool_gateway,
              "    allowed_data_sources: frozenset[str] = Field(default_factory=frozenset, max_length=256)\n"
              "    effect: ToolEffect = ToolEffect.READ_ONLY\n",
              "    allowed_data_sources: frozenset[str] = Field(default_factory=frozenset, max_length=256)\n"
              "    cancellation_owner_id: UUID | None = None\n"
              "    effect: ToolEffect = ToolEffect.READ_ONLY\n",
          )
          replace_count(
              tool_gateway,
              "                connector_id=request.connector_id,\n"
              "            )\n",
              "                connector_id=request.connector_id,\n"
              "                cancellation_owner_id=request.cancellation_owner_id,\n"
              "            )\n",
              expected=1,
          )

          github_service = "services/core/src/simorgh_core/agents/github_read_service.py"
          replace_count(
              github_service,
              "                allowed_data_sources=task.allowed_data_sources,\n"
              "                effect=ToolEffect.READ_ONLY,\n",
              "                allowed_data_sources=task.allowed_data_sources,\n"
              "                cancellation_owner_id=request.cancellation_owner_id,\n"
              "                effect=ToolEffect.READ_ONLY,\n",
          )

          model_gateway = "services/core/src/simorgh_core/agents/model_gateway.py"
          replace_count(
              model_gateway,
              "    policy_hash: str = Field(\n",
              "    cancellation_owner_id: UUID | None = None\n"
              "    policy_hash: str = Field(\n",
          )
          replace_count(
              model_gateway,
              "                model_id=spec.model_id,\n"
              "            )\n",
              "                model_id=spec.model_id,\n"
              "                cancellation_owner_id=request.cancellation_owner_id,\n"
              "            )\n",
              expected=1,
          )

          control = "services/core/src/simorgh_core/agents/control_plane.py"
          replace_count(
              control,
              "from uuid import UUID\n",
              "from uuid import UUID\n\n"
              "from simorgh_core.agents.cancellation_contracts import (\n"
              "    AdapterCancellationDisposition,\n"
              "    CancellationDisposition,\n"
              "    CancellationRequesterAuthority,\n"
              "    CancellationSignalDisposition,\n"
              "    InvocationCancellationOutcome,\n"
              "    TaskCancellationRequest,\n"
              "    TaskCancellationResult,\n"
              "    stable_cancellation_audit_id,\n"
              "    stable_cancellation_id,\n"
              ")\n"
              "from simorgh_core.agents.cancellation_runtime import (\n"
              "    CancellationOwnerRegistry,\n"
              "    cancellation_owner_registry,\n"
              ")\n",
          )
          replace_count(
              control,
              "from simorgh_core.agents.invocations import canonical_fingerprint\n",
              "from simorgh_core.agents.invocations import (\n"
              "    InMemoryInvocationStore,\n"
              "    InvocationPhase,\n"
              "    InvocationStore,\n"
              "    canonical_fingerprint,\n"
              ")\n",
          )
          replace_count(
              control,
              "        store: AgentTaskStore | None = None,\n"
              "        wall_clock_millis: Callable[[], int] | None = None,\n",
              "        store: AgentTaskStore | None = None,\n"
              "        invocation_store: InvocationStore | None = None,\n"
              "        cancellation_registry: CancellationOwnerRegistry | None = None,\n"
              "        wall_clock_millis: Callable[[], int] | None = None,\n",
          )
          replace_count(
              control,
              "        self._store = store or InMemoryAgentTaskStore()\n"
              "        self._wall_clock_millis = wall_clock_millis or (\n",
              "        self._store = store or InMemoryAgentTaskStore()\n"
              "        self._invocations = invocation_store or InMemoryInvocationStore()\n"
              "        self._cancellation_owners = (\n"
              "            cancellation_registry\n"
              "            or CancellationOwnerRegistry(self._invocations)\n"
              "        )\n"
              "        self._wall_clock_millis = wall_clock_millis or (\n",
          )
          replace_count(
              control,
              "    async def reset_to_memory_store(self) -> None:\n",
              "    async def configure_invocation_store(\n"
              "        self, store: InvocationStore\n"
              "    ) -> None:\n"
              "        store.load()\n"
              "        with self._lock:\n"
              "            self._invocations = store\n"
              "            self._cancellation_owners.configure_store(store)\n\n"
              "    async def reset_to_memory_store(self) -> None:\n",
          )
          replace_count(
              control,
              "             previous_store.close()\n\n"
              "    async def submit(self, task: TaskEnvelope) -> AgentTaskRecord:\n",
              "             previous_store.close()\n"
              "            replacement_invocations = InMemoryInvocationStore()\n"
              "            self._invocations = replacement_invocations\n"
              "            self._cancellation_owners.configure_store(\n"
              "                replacement_invocations\n"
              "            )\n\n"
              "    async def submit(self, task: TaskEnvelope) -> AgentTaskRecord:\n",
          )
          start = control
          old_cancel = '''    async def cancel(
        self,
        *,
        request_id: UUID,
        reason: str,
    ) -> AgentTaskRecord:
        normalized_reason = reason.strip() or "operator requested cancellation"
        with self._lock:
            self._require_store_healthy_locked()
            state = self._states.get(request_id)
            if state is None:
                raise AgentTaskNotFoundError(f"agent task {request_id} was not found")
            if state.record.phase in {
                AgentTaskPhase.CANCELLED,
                AgentTaskPhase.EXPIRED,
            }:
                return state.record

            state.cancelled = True
            state.cancel_reason = normalized_reason[:1_000]
            state.account.cancel()
            cancelled_record = AgentTaskRecord(
                request_id=request_id,
                phase=AgentTaskPhase.CANCELLED,
                created_at_ms=state.record.created_at_ms,
                updated_at_ms=self._next_record_time(state.record.updated_at_ms),
                task=state.task,
                routing_decision=state.record.routing_decision,
                budget=state.account.snapshot(),
                cancel_reason=state.cancel_reason,
                detail=state.cancel_reason,
            )
            self._persist_transition_locked(
                state=state,
                account=state.account,
                record=cancelled_record,
            )
            return cancelled_record
'''
          new_cancel = '''    async def cancel(
        self,
        *,
        request_id: UUID,
        reason: str,
        cancellation_id: UUID | None = None,
        reason_code: str = "operator_requested",
        requester_authority: CancellationRequesterAuthority = (
            CancellationRequesterAuthority.OPERATOR
        ),
    ) -> AgentTaskRecord:
        normalized_reason = " ".join(reason.strip().split())[:1_000]
        if not normalized_reason:
            normalized_reason = "operator requested cancellation"
        with self._lock:
            self._require_store_healthy_locked()
            state = self._states.get(request_id)
            if state is None:
                raise AgentTaskNotFoundError(f"agent task {request_id} was not found")
            if state.record.phase == AgentTaskPhase.EXPIRED:
                return state.record

            existing_request = state.record.cancellation_request
            if existing_request is not None:
                candidate_id = cancellation_id or existing_request.cancellation_id
                candidate = existing_request.model_copy(
                    update={
                        "cancellation_id": candidate_id,
                        "reason_code": reason_code,
                        "operator_reason": normalized_reason,
                        "requester_authority": requester_authority,
                    }
                )
                if candidate != existing_request:
                    raise AgentTaskConflictError(
                        "cancellation identity was replayed with different content"
                    )
                cancellation_request = existing_request
                if state.record.cancellation_result is not None:
                    return state.record
            else:
                now = self._now_ms()
                resolved_id = cancellation_id or stable_cancellation_id(
                    request_id=request_id,
                    reason_code=reason_code,
                    operator_reason=normalized_reason,
                    requester_authority=requester_authority,
                )
                cancellation_request = TaskCancellationRequest(
                    request_id=request_id,
                    cancellation_id=resolved_id,
                    requested_at_ms=now,
                    reason_code=reason_code,
                    operator_reason=normalized_reason,
                    requester_authority=requester_authority,
                    observed_task_phase=state.record.phase.value,
                    observed_task_version=state.record.updated_at_ms,
                )
                state.cancelled = True
                state.cancel_reason = normalized_reason
                state.account.cancel()
                accepted_record = AgentTaskRecord(
                    request_id=request_id,
                    phase=AgentTaskPhase.CANCELLED,
                    created_at_ms=state.record.created_at_ms,
                    updated_at_ms=self._next_record_time(
                        state.record.updated_at_ms
                    ),
                    task=state.task,
                    routing_decision=state.record.routing_decision,
                    budget=state.account.snapshot(),
                    cancel_reason=state.cancel_reason,
                    cancellation_request=cancellation_request,
                    detail=state.cancel_reason,
                )
                self._persist_transition_locked(
                    state=state,
                    account=state.account,
                    record=accepted_record,
                )

        fence = self._invocations.accept_cancellation(cancellation_request)
        signal_dispositions = self._cancellation_owners.signal_request(
            request_id=request_id,
            reason=normalized_reason,
        )
        settled = self._invocations.settle_cancellation(request_id)
        settled_by_id = {record.invocation_id: record for record in settled}
        outcomes: list[InvocationCancellationOutcome] = []
        terminal_count = 0
        pending_cancelled_count = 0
        reserved_uncertain_count = 0
        signalled_count = 0
        for owned in fence.owned_invocations:
            final = settled_by_id[owned.invocation_id]
            signal = (
                signal_dispositions.get(
                    owned.cancellation_owner_id,
                    CancellationSignalDisposition.NOT_REGISTERED,
                )
                if owned.cancellation_owner_id is not None
                else CancellationSignalDisposition.NOT_REGISTERED
            )
            if signal == CancellationSignalDisposition.ALREADY_SIGNALLED:
                signal = CancellationSignalDisposition.SIGNALLED
            if signal == CancellationSignalDisposition.SIGNALLED:
                signalled_count += 1
            if owned.terminal:
                terminal_count += 1
                adapter = AdapterCancellationDisposition.ALREADY_TERMINAL
            elif owned.state == InvocationPhase.PENDING.value:
                pending_cancelled_count += 1
                adapter = AdapterCancellationDisposition.PROVEN_NOT_ENTERED
            else:
                reserved_uncertain_count += 1
                adapter = AdapterCancellationDisposition.NOT_SUPPORTED
            outcomes.append(
                InvocationCancellationOutcome(
                    invocation_id=owned.invocation_id,
                    prior_state=owned.state,
                    final_state=final.state.value,
                    signal_disposition=signal,
                    adapter_disposition=adapter,
                    usage_sha256=canonical_fingerprint(final.committed_usage),
                )
            )
        if reserved_uncertain_count:
            disposition = CancellationDisposition.PARTIALLY_UNCERTAIN
        elif outcomes and terminal_count == len(outcomes):
            disposition = CancellationDisposition.OBSERVED_TERMINAL
        else:
            disposition = CancellationDisposition.APPLIED
        result = TaskCancellationResult(
            request=cancellation_request,
            accepted_at_ms=fence.accepted_at_ms,
            completed_at_ms=max(fence.accepted_at_ms, self._now_ms()),
            ownership_snapshot_sha256=fence.ownership_snapshot_sha256,
            outcomes=tuple(outcomes),
            terminal_count=terminal_count,
            pending_cancelled_count=pending_cancelled_count,
            reserved_uncertain_count=reserved_uncertain_count,
            signalled_count=signalled_count,
            disposition=disposition,
            audit_event_id=stable_cancellation_audit_id(
                request_id=request_id,
                cancellation_id=cancellation_request.cancellation_id,
                ownership_snapshot_sha256=fence.ownership_snapshot_sha256,
            ),
        )
        with self._lock:
            self._require_store_healthy_locked()
            state = self._states[request_id]
            if state.record.cancellation_result is not None:
                return state.record
            completed_record = state.record.model_copy(
                update={
                    "updated_at_ms": self._next_record_time(
                        state.record.updated_at_ms
                    ),
                    "cancellation_result": result,
                    "detail": "durable cancellation propagation completed",
                }
            )
            self._persist_transition_locked(
                state=state,
                account=state.account,
                record=completed_record,
            )
            return completed_record
'''
          replace_count(start, old_cancel, new_cancel)

          api = "services/core/src/simorgh_core/agents/api.py"
          replace_count(
              api,
              "from uuid import UUID\n",
              "from uuid import UUID\n\n"
              "from simorgh_core.agents.cancellation_contracts import (\n"
              "    CancellationRequesterAuthority,\n"
              ")\n"
              "from simorgh_core.agents.cancellation_runtime import (\n"
              "    cancellation_owner_registry,\n"
              ")\n",
          )
          replace_count(
              api,
              "    )\n)\n\n\nclass AgentTaskCancelRequest",
              "    ),\n"
              "    cancellation_registry=cancellation_owner_registry,\n"
              ")\n\n\nclass AgentTaskCancelRequest",
          )
          replace_count(
              api,
              "    reason: str = Field(default=\"operator requested cancellation\", max_length=1_000)\n",
              "    cancellation_id: UUID | None = None\n"
              "    reason_code: str = Field(\n"
              "        default=\"operator_requested\",\n"
              "        pattern=r\"^[a-z][a-z0-9_.-]{0,127}$\",\n"
              "        max_length=128,\n"
              "    )\n"
              "    reason: str = Field(\n"
              "        default=\"operator requested cancellation\", max_length=1_000\n"
              "    )\n",
          )
          replace_count(
              api,
              "            request_id=request_id,\n"
              "            reason=payload.reason,\n",
              "            request_id=request_id,\n"
              "            reason=payload.reason,\n"
              "            cancellation_id=payload.cancellation_id,\n"
              "            reason_code=payload.reason_code,\n"
              "            requester_authority=CancellationRequesterAuthority.OPERATOR,\n",
          )
          replace_count(
              api,
              "    except AgentTaskNotFoundError as exc:\n"
