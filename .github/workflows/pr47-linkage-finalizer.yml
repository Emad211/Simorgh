name: PR47 Invocation Linkage Finalizer

on:
  push:
    branches:
      - core/typed-results-artifacts
    paths:
      - .github/workflows/pr47-linkage-finalizer.yml

permissions:
  contents: write

concurrency:
  group: pr47-invocation-linkage-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact result-to-invocation linkage hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, *, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}, expected=1')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          authority = Path(
              'services/core/src/simorgh_core/agents/result_authority.py'
          )
          replace_once(
              authority,
              'from simorgh_core.agents.contracts import UsageVector\n',
              '',
              label='remove duplicated usage import',
          )
          replace_once(
              authority,
              '    committed_usage: UsageVector = Field(default_factory=UsageVector)\n'
              '    invocation_result_sha256: str = Field(\n',
              '    invocation_usage_sha256: str = Field(\n'
              '        min_length=64,\n'
              '        max_length=64,\n'
              '        pattern=_SHA256_PATTERN,\n'
              '    )\n'
              '    invocation_result_sha256: str = Field(\n',
              label='usage reference field',
          )
          replace_once(
              authority,
              '    committed_usage: UsageVector | None = None,\n'
              '    invocation_result_sha256: str | None = None,\n',
              '    invocation_usage_sha256: str,\n'
              '    invocation_result_sha256: str,\n',
              label='required invocation hashes',
          )
          replace_once(
              authority,
              '        committed_usage=committed_usage or UsageVector(),\n'
              '        invocation_result_sha256=(\n'
              '            invocation_result_sha256\n'
              '            or canonical_fingerprint(\n'
              '                {"invocation_id": str(producer.invocation_id)}\n'
              '            )\n'
              '        ),\n',
              '        invocation_usage_sha256=invocation_usage_sha256,\n'
              '        invocation_result_sha256=invocation_result_sha256,\n',
              label='remove synthetic invocation authority',
          )

          terminalizer = Path(
              'services/core/src/simorgh_core/agents/result_terminalizer.py'
          )
          replace_once(
              terminalizer,
              '            committed_usage=invocation.committed_usage,\n'
              '            invocation_result_sha256=canonical_fingerprint(\n'
              '                durable_result_payload\n'
              '            ),\n',
              '            invocation_usage_sha256=canonical_fingerprint(\n'
              '                invocation.committed_usage\n'
              '            ),\n'
              '            invocation_result_sha256=canonical_fingerprint(\n'
              '                durable_result_payload\n'
              '            ),\n',
              label='terminalizer linkage hashes',
          )

          authority_tests = Path(
              'services/core/tests/test_result_authority.py'
          )
          replace_once(
              authority_tests,
              '        retention=RetentionClass.PROJECT,\n'
              '        created_at_ms=1_000,\n'
              '        completed_at_ms=3_000,\n',
              '        retention=RetentionClass.PROJECT,\n'
              '        invocation_usage_sha256="c" * 64,\n'
              '        invocation_result_sha256="d" * 64,\n'
              '        created_at_ms=1_000,\n'
              '        completed_at_ms=3_000,\n',
              label='authority test result hashes',
          )
          replace_once(
              authority_tests,
              '            retention=RetentionClass.PROJECT,\n'
              '            created_at_ms=1_000,\n'
              '            completed_at_ms=2_000,\n',
              '            retention=RetentionClass.PROJECT,\n'
              '            invocation_usage_sha256="c" * 64,\n'
              '            invocation_result_sha256="d" * 64,\n'
              '            created_at_ms=1_000,\n'
              '            completed_at_ms=2_000,\n',
              label='invalid payload test hashes',
          )

          store_tests = Path(
              'services/core/tests/test_result_store_terminalizer.py'
          )
          replace_once(
              store_tests,
              '    InvocationKind,\n'
              ')\n',
              '    InvocationKind,\n'
              '    canonical_fingerprint,\n'
              ')\n',
              label='test fingerprint import',
          )
          replace_once(
              store_tests,
              '        committed_usage=UsageVector(),\n'
              '        invocation_result_sha256="c" * 64,\n',
              '        invocation_usage_sha256="d" * 64,\n'
              '        invocation_result_sha256="c" * 64,\n',
              label='store fixture linkage hashes',
          )
          replace_once(
              store_tests,
              '        committed_usage=record.committed_usage,\n'
              '        invocation_result_sha256=record.invocation_result_sha256,\n',
              '        invocation_usage_sha256=record.invocation_usage_sha256,\n'
              '        invocation_result_sha256=record.invocation_result_sha256,\n',
              label='changed result linkage hashes',
          )
          replace_once(
              store_tests,
              '    assert created.record.committed_usage == invocation.committed_usage\n'
              '    assert created.record.invocation_result_sha256 != "0" * 64\n',
              '    assert created.record.invocation_usage_sha256 == canonical_fingerprint(\n'
              '        invocation.committed_usage\n'
              '    )\n'
              '    assert created.record.invocation_result_sha256 == canonical_fingerprint(\n'
              '        invocation.result_payload\n'
              '    )\n',
              label='terminalizer linkage assertions',
          )
          PY
          rm -f .github/workflows/pr47-linkage-finalizer.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate nonduplicating invocation linkage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest

      - name: Commit validated invocation linkage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: bind typed results to invocation hashes without duplicating usage'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/typed-results-artifacts
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
