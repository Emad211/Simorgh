name: PR44 Specialist Authority Contract

on:
  push:
    branches:
      - core/specialist-execution-runtime-clean
    paths:
      - .github/workflows/pr44-authority-contract.yml

permissions:
  contents: write

concurrency:
  group: pr44-specialist-authority-contract
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact authority contract and private trace changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"anchor count={count}, expected=1: {old[:140]!r}")
              return text.replace(old, new, 1)

          results_path = Path('services/core/src/simorgh_core/agents/specialist_results.py')
          results_text = results_path.read_text(encoding='utf-8')
          results_text = replace_once(
              results_text,
              'from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n\n\nclass SpecialistPlanPayload',
              'from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n\n\n'
              'SPECIALIST_PLAN_OUTPUT_CONTRACT = "simorgh.typed-plan.v1"\n\n\n'
              'class SpecialistPlanPayload',
          )
          results_path.write_text(results_text, encoding='utf-8')

          execution_path = Path('services/core/src/simorgh_core/agents/specialist_execution.py')
          execution_text = execution_path.read_text(encoding='utf-8')
          transitions = (
              (
                  'from uuid import UUID\n',
                  'from uuid import NAMESPACE_URL, UUID, uuid5\n',
              ),
              (
                  'from pydantic import BaseModel, ConfigDict, Field, JsonValue, field_validator, model_validator\n',
                  'from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n',
              ),
              (
                  'from simorgh_core.agents.registry import intersect_budgets\n',
                  'from simorgh_core.agents.registry import intersect_budgets\n'
                  'from simorgh_core.agents.specialist_results import (\n'
                  '    SPECIALIST_PLAN_OUTPUT_CONTRACT,\n'
                  '    SpecialistPlanPayload,\n'
                  ')\n',
              ),
              (
                  '    schema_version: Literal["1.0"] = SPECIALIST_EXECUTION_CONTRACT_VERSION\n'
                  '    request_id: UUID\n'
                  '    invocation_id: UUID\n'
                  '    agent_id: str = Field(pattern=_AGENT_ID_PATTERN, max_length=128)\n',
                  '    schema_version: Literal["1.0"] = SPECIALIST_EXECUTION_CONTRACT_VERSION\n'
                  '    request_id: UUID\n'
                  '    invocation_id: UUID\n'
                  '    context_bundle_id: UUID\n'
                  '    cancellation_owner_id: UUID\n'
                  '    agent_id: str = Field(pattern=_AGENT_ID_PATTERN, max_length=128)\n',
              ),
              (
                  '    capabilities: SpecialistCapabilitySet\n'
                  '    effective_budget: TaskBudget\n'
                  '    created_at_ms: int = Field(ge=0)\n',
                  '    capabilities: SpecialistCapabilitySet\n'
                  '    effective_budget: TaskBudget\n'
                  '    monotonic_timeout_ms: int = Field(ge=1, le=86_400_000)\n'
                  '    created_at_ms: int = Field(ge=0)\n',
              ),
              (
                  '        if self.effect == InvocationEffect.PROPOSAL and not self.capabilities.proposal_allowed:\n'
                  '            raise ValueError("proposal specialist execution requires proposal capability")\n'
                  '        return self\n',
                  '        if self.effect == InvocationEffect.PROPOSAL and not self.capabilities.proposal_allowed:\n'
                  '            raise ValueError("proposal specialist execution requires proposal capability")\n'
                  '        if self.monotonic_timeout_ms != self.effective_budget.max_elapsed_ms:\n'
                  '            raise ValueError(\n'
                  '                "specialist monotonic timeout must equal the effective budget limit"\n'
                  '            )\n'
                  '        return self\n',
              ),
              (
                  '    parent_invocation_id: None = None\n',
                  '    parent_invocation_id: UUID | None = None\n',
              ),
              (
                  '    payload: dict[str, JsonValue] | None = None\n',
                  '    payload: SpecialistPlanPayload | None = None\n',
              ),
              (
                  '    @model_validator(mode="after")\n'
                  '    def validate_terminal_shape(self) -> Self:\n',
                  '    @property\n'
                  '    def replayed(self) -> bool:\n'
                  '        return self.replay == SpecialistReplayDisposition.REPLAYED\n\n'
                  '    @model_validator(mode="after")\n'
                  '    def validate_terminal_shape(self) -> Self:\n',
              ),
              (
                  '        if self.outcome == SpecialistExecutionOutcome.COMPLETED:\n'
                  '            if self.payload is None:\n'
                  '                raise ValueError("completed specialist execution requires a typed payload")\n'
                  '            if self.reason is not None:\n',
                  '        if self.outcome == SpecialistExecutionOutcome.COMPLETED:\n'
                  '            if self.payload is None:\n'
                  '                raise ValueError("completed specialist execution requires a typed payload")\n'
                  '            if self.output_contract != SPECIALIST_PLAN_OUTPUT_CONTRACT:\n'
                  '                raise ValueError(\n'
                  '                    "specialist plan payload requires the typed-plan output contract"\n'
                  '                )\n'
                  '            if self.reason is not None:\n',
              ),
              (
                  '    def __init__(self) -> None:\n'
                  '        self._lock = RLock()\n'
                  '        self._cancelled = False\n'
                  '        self._reason: str | None = None\n',
                  '    def __init__(self, *, owner_id: UUID | None = None) -> None:\n'
                  '        self._lock = RLock()\n'
                  '        self._owner_id = owner_id\n'
                  '        self._cancelled = False\n'
                  '        self._reason: str | None = None\n',
              ),
              (
                  '    @property\n'
                  '    def cancelled(self) -> bool:\n'
                  '        with self._lock:\n'
                  '            return self._cancelled\n',
                  '    @property\n'
                  '    def owner_id(self) -> UUID | None:\n'
                  '        with self._lock:\n'
                  '            return self._owner_id\n\n'
                  '    def require_owner(self, expected_owner_id: UUID) -> None:\n'
                  '        with self._lock:\n'
                  '            if self._owner_id is None:\n'
                  '                self._owner_id = expected_owner_id\n'
                  '                return\n'
                  '            if self._owner_id != expected_owner_id:\n'
                  '                raise SpecialistExecutionPolicyError(\n'
                  '                    "specialist cancellation owner does not match execution request"\n'
                  '                )\n\n'
                  '    @property\n'
                  '    def cancelled(self) -> bool:\n'
                  '        with self._lock:\n'
                  '            return self._cancelled\n',
              ),
              (
                  '        payload: dict[str, JsonValue],\n',
                  '        payload: SpecialistPlanPayload | dict[str, object],\n',
              ),
              (
                  '        self._output_contract = output_contract\n'
                  '        self._payload = dict(payload)\n',
                  '        if output_contract != SPECIALIST_PLAN_OUTPUT_CONTRACT:\n'
                  '            raise SpecialistExecutionPolicyError(\n'
                  '                "static proposal executor requires the typed-plan output contract"\n'
                  '            )\n'
                  '        self._output_contract = output_contract\n'
                  '        self._payload = SpecialistPlanPayload.model_validate(payload)\n',
              ),
              (
                  '    task_payload = task.model_dump(mode="json")\n'
                  '    task_payload["allowed_data_sources"] = sorted(task.allowed_data_sources)\n'
                  '    return SpecialistExecutionRequest(\n',
                  '    task_payload = task.model_dump(mode="json")\n'
                  '    task_payload["allowed_data_sources"] = sorted(task.allowed_data_sources)\n'
                  '    effective_budget = intersect_budgets(task.budget, definition.budget_ceiling)\n'
                  '    return SpecialistExecutionRequest(\n',
              ),
              (
                  '        request_id=task.request_id,\n'
                  '        invocation_id=invocation_id,\n'
                  '        agent_id=definition.agent_id,\n',
                  '        request_id=task.request_id,\n'
                  '        invocation_id=invocation_id,\n'
                  '        context_bundle_id=uuid5(\n'
                  '            NAMESPACE_URL,\n'
                  '            f"simorgh-context:{task.request_id}:{context_fingerprint}",\n'
                  '        ),\n'
                  '        cancellation_owner_id=uuid5(\n'
                  '            NAMESPACE_URL,\n'
                  '            f"simorgh-cancellation:{task.request_id}:{invocation_id}",\n'
                  '        ),\n'
                  '        agent_id=definition.agent_id,\n',
              ),
              (
                  '        capabilities=capabilities,\n'
                  '        effective_budget=intersect_budgets(task.budget, definition.budget_ceiling),\n'
                  '        created_at_ms=now,\n',
                  '        capabilities=capabilities,\n'
                  '        effective_budget=effective_budget,\n'
                  '        monotonic_timeout_ms=effective_budget.max_elapsed_ms,\n'
                  '        created_at_ms=now,\n',
              ),
          )
          current = execution_text
          for old, new in transitions:
              current = replace_once(current, old, new)
          execution_path.write_text(current, encoding='utf-8')

          tracing_path = Path('services/core/src/simorgh_core/agents/tracing.py')
          tracing_text = tracing_path.read_text(encoding='utf-8')
          tracing_text = replace_once(
              tracing_text,
              '    "accessibility_tree",\n',
              '    "accessibility_tree",\n'
              '    "prompt",\n'
              '    "context_body",\n'
              '    "context_content",\n'
              '    "result_payload",\n'
              '    "tool_arguments",\n'
              '    "tool_results",\n'
              '    "audio",\n'
              '    "notification",\n',
          )
          tracing_text = replace_once(
              tracing_text,
              '    TOOL_FAILED = "tool_failed"\n'
              '    ESCALATION = "escalation"\n',
              '    TOOL_FAILED = "tool_failed"\n'
              '    SPECIALIST_STARTED = "specialist_started"\n'
              '    SPECIALIST_COMPLETED = "specialist_completed"\n'
              '    SPECIALIST_FAILED = "specialist_failed"\n'
              '    ESCALATION = "escalation"\n',
          )
          tracing_path.write_text(tracing_text, encoding='utf-8')

          runtime_path = Path('services/core/src/simorgh_core/agents/specialist_runtime.py')
          runtime_text = runtime_path.read_text(encoding='utf-8')
          runtime_transitions = (
              (
                  'from simorgh_core.agents.specialist_execution import (\n',
                  'from simorgh_core.agents.specialist_execution import (\n',
              ),
              (
                  ')\n\n_SPECIALIST_OPERATION = "specialist.execute"\n',
                  ')\n'
                  'from simorgh_core.agents.tracing import (\n'
                  '    NullTraceSink,\n'
                  '    TraceEventKind,\n'
                  '    TraceSink,\n'
                  '    trace_event,\n'
                  ')\n\n'
                  '_SPECIALIST_OPERATION = "specialist.execute"\n',
              ),
              (
                  '        invocation_store: InvocationStore,\n'
                  '        wall_clock_millis: Callable[[], int] | None = None,\n',
                  '        invocation_store: InvocationStore,\n'
                  '        trace_sink: TraceSink | None = None,\n'
                  '        wall_clock_millis: Callable[[], int] | None = None,\n',
              ),
              (
                  '        self._invocations = invocation_store\n'
                  '        self._wall_clock_millis = wall_clock_millis or (\n',
                  '        self._invocations = invocation_store\n'
                  '        self._traces = trace_sink or NullTraceSink()\n'
                  '        self._wall_clock_millis = wall_clock_millis or (\n',
              ),
              (
                  '        self._require_budget(request=request, budget=budget)\n'
                  '        fingerprint = specialist_execution_fingerprint(request)\n',
                  '        token.require_owner(request.cancellation_owner_id)\n'
                  '        self._require_budget(request=request, budget=budget)\n'
                  '        fingerprint = specialist_execution_fingerprint(request)\n',
              ),
              (
                  '        if started.kind == InvocationStartKind.REPLAY:\n'
                  '            return self._replay_completed(\n'
                  '                request=request,\n'
                  '                record=started.record,\n'
                  '            )\n',
                  '        if started.kind == InvocationStartKind.REPLAY:\n'
                  '            replayed = self._replay_completed(\n'
                  '                request=request,\n'
                  '                record=started.record,\n'
                  '            )\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.INVOCATION_REPLAYED,\n'
                  '                outcome=replayed.outcome.value,\n'
                  '                usage=replayed.committed_usage,\n'
                  '                replayed=True,\n'
                  '            )\n'
                  '            return replayed\n',
              ),
              (
                  '            executor = self._executors.require_definition(definition)\n'
                  '            raw_result = await executor.execute(\n',
                  '            executor = self._executors.require_definition(definition)\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.SPECIALIST_STARTED,\n'
                  '                outcome="started",\n'
                  '            )\n'
                  '            raw_result = await executor.execute(\n',
              ),
              (
                  '        except SpecialistExecutionCancelledError:\n'
                  '            self._cancel_invocation(request.invocation_id)\n',
                  '        except SpecialistExecutionCancelledError:\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.SPECIALIST_FAILED,\n'
                  '                outcome=SpecialistExecutionOutcome.CANCELLED.value,\n'
                  '                reason="specialist_cancelled",\n'
                  '            )\n'
                  '            self._cancel_invocation(request.invocation_id)\n',
              ),
              (
                  '        except SpecialistExecutionExpiredError:\n'
                  '            self._expire_invocation(request.invocation_id)\n',
                  '        except SpecialistExecutionExpiredError:\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.SPECIALIST_FAILED,\n'
                  '                outcome=SpecialistExecutionOutcome.EXPIRED.value,\n'
                  '                reason="specialist_expired",\n'
                  '            )\n'
                  '            self._expire_invocation(request.invocation_id)\n',
              ),
              (
                  '        except asyncio.CancelledError:\n'
                  '            self._mark_unknown(\n',
                  '        except asyncio.CancelledError:\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.SPECIALIST_FAILED,\n'
                  '                outcome=SpecialistExecutionOutcome.UNKNOWN.value,\n'
                  '                reason="specialist_coroutine_cancelled",\n'
                  '            )\n'
                  '            self._mark_unknown(\n',
              ),
              (
                  '        except (ValidationError, SpecialistResultContractError) as exc:\n'
                  '            self._fail_invocation(\n',
                  '        except (ValidationError, SpecialistResultContractError) as exc:\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.SPECIALIST_FAILED,\n'
                  '                outcome=SpecialistExecutionOutcome.FAILED.value,\n'
                  '                reason="specialist_result_contract_invalid",\n'
                  '            )\n'
                  '            self._fail_invocation(\n',
              ),
              (
                  '        except SpecialistExecutionPolicyError as exc:\n'
                  '            self._fail_invocation(\n',
                  '        except SpecialistExecutionPolicyError as exc:\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.SPECIALIST_FAILED,\n'
                  '                outcome=SpecialistExecutionOutcome.FAILED.value,\n'
                  '                reason="specialist_policy_failure",\n'
                  '            )\n'
                  '            self._fail_invocation(\n',
              ),
              (
                  '        except Exception as exc:\n'
                  '            self._fail_invocation(\n',
                  '        except Exception as exc:\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.SPECIALIST_FAILED,\n'
                  '                outcome=SpecialistExecutionOutcome.FAILED.value,\n'
                  '                reason="specialist_execution_failure",\n'
                  '            )\n'
                  '            self._fail_invocation(\n',
              ),
              (
                  '        except InvocationStoreError as exc:\n'
                  '            self._mark_unknown_after_completion_failure(\n'
                  '                invocation_id=request.invocation_id,\n'
                  '            )\n'
                  '            raise SpecialistExecutionStoreError(\n'
                  '                "specialist result could not be durably committed"\n'
                  '            ) from exc\n'
                  '        return result\n',
                  '        except InvocationStoreError as exc:\n'
                  '            self._mark_unknown_after_completion_failure(\n'
                  '                invocation_id=request.invocation_id,\n'
                  '            )\n'
                  '            self._emit_trace(\n'
                  '                request=request,\n'
                  '                kind=TraceEventKind.SPECIALIST_FAILED,\n'
                  '                outcome=SpecialistExecutionOutcome.UNKNOWN.value,\n'
                  '                reason="specialist_result_commit_failed",\n'
                  '            )\n'
                  '            raise SpecialistExecutionStoreError(\n'
                  '                "specialist result could not be durably committed"\n'
                  '            ) from exc\n'
                  '        self._emit_trace(\n'
                  '            request=request,\n'
                  '            kind=TraceEventKind.SPECIALIST_COMPLETED,\n'
                  '            outcome=result.outcome.value,\n'
                  '            usage=result.committed_usage,\n'
                  '        )\n'
                  '        return result\n',
              ),
              (
                  '    def _now_ms(self) -> int:\n'
                  '        return max(0, int(self._wall_clock_millis()))\n',
                  '    def _emit_trace(\n'
                  '        self,\n'
                  '        *,\n'
                  '        request: SpecialistExecutionRequest,\n'
                  '        kind: TraceEventKind,\n'
                  '        outcome: str,\n'
                  '        usage: UsageVector | None = None,\n'
                  '        reason: str | None = None,\n'
                  '        replayed: bool = False,\n'
                  '    ) -> None:\n'
                  '        self._traces.emit(\n'
                  '            trace_event(\n'
                  '                request_id=request.request_id,\n'
                  '                invocation_id=request.invocation_id,\n'
                  '                kind=kind,\n'
                  '                agent_id=request.agent_id,\n'
                  '                agent_version=request.agent_version,\n'
                  '                usage=usage,\n'
                  '                outcome=outcome,\n'
                  '                reason=reason,\n'
                  '                metadata={\n'
                  '                    "context_bundle_id": str(request.context_bundle_id),\n'
                  '                    "output_contract": request.output_contract,\n'
                  '                    "effect": request.effect.value,\n'
                  '                    "replayed": replayed,\n'
                  '                    "monotonic_timeout_ms": request.monotonic_timeout_ms,\n'
                  '                },\n'
                  '                wall_clock_millis=self._wall_clock_millis,\n'
                  '            )\n'
                  '        )\n\n'
                  '    def _now_ms(self) -> int:\n'
                  '        return max(0, int(self._wall_clock_millis()))\n',
              ),
          )
          current_runtime = runtime_text
          for old, new in runtime_transitions:
              if old == new:
                  continue
              current_runtime = replace_once(current_runtime, old, new)
          runtime_path.write_text(current_runtime, encoding='utf-8')

          contracts_test = Path('services/core/tests/test_specialist_execution_contracts.py')
          contracts_text = contracts_test.read_text(encoding='utf-8')
          contracts_text = replace_once(
              contracts_text,
              '    assert result.payload is not None\n'
              '    assert result.payload["steps"] == ["تعریف قرارداد", "اجرای تست"]\n',
              '    assert result.payload is not None\n'
              '    assert result.payload.steps == ("تعریف قرارداد", "اجرای تست")\n',
          )
          contracts_test.write_text(contracts_text, encoding='utf-8')
          PY
          rm -f .github/workflows/pr44-authority-contract.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate complete authority contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest

      - name: Commit validated authority contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: bind specialist result context cancellation and trace authority'
          git push origin HEAD:core/specialist-execution-runtime-clean
