name: Phase 1.8 Native Authority Test Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase18-native-authority-test-fix.yml

permissions:
  contents: write

concurrency:
  group: phase18-native-authority-test-fix
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Correct exact fixture expectations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              'services/core/tests/test_trace_native_authorities.py'
          )
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'estimated_tokens=bundle.estimated_unit_count,',
                  'estimated_tokens=bundle.estimated_tokens,',
                  'context token field',
              ),
              (
                  'with pytest.raises(TraceCorrelationError, match="result invocation"):',
                  'with pytest.raises(\n'
                  '        TraceCorrelationError,\n'
                  '        match="invocation authority",\n'
                  '    ):',
                  'unknown invocation expectation',
              ),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} count={count}, expected=1')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path(
              '.github/workflows/phase18-native-authority-test-fix.yml'
          ).unlink()
          PY
          git diff --check

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix services/core/tests/test_trace_native_authorities.py
          ruff check .
          mypy services/core/src
          pytest
          git diff --check
          test ! -e .github/workflows/phase18-native-authority-test-fix.yml

      - name: Commit validated fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'tests: align trace authority fixtures with native stores'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/correlated-execution-trace
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$HEAD_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $HEAD_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
