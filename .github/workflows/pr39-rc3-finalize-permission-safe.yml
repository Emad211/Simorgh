name: PR39 RC3 Permission-Safe Diagnostic

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-permission-safe-finalize
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          root = Path('.simorgh-patches/pr39-rc3')
          names = [f'part-{index:02d}.b64' for index in range(9)]
          expected_lengths = [8000] * 8 + [7748]
          if sorted(path.name for path in root.glob('part-*.b64')) != names:
              raise SystemExit('unexpected RC3 chunk set')
          pieces: list[str] = []
          for name, expected_length in zip(names, expected_lengths, strict=True):
              raw = (root / name).read_bytes()
              if len(raw) != expected_length:
                  raise SystemExit(f'{name}: invalid length')
              pieces.append(raw.decode('ascii'))
          archive = base64.b64decode(''.join(pieces), validate=True)
          expected_hash = 'dde9c1eed40d319b1fde9e913b3510aa0fd4fa0e36b31436d58c8d231fa2f2a4'
          if len(archive) != 53811 or hashlib.sha256(archive).hexdigest() != expected_hash:
              raise SystemExit('RC3 archive identity mismatch')
          target = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle'
          target.mkdir(parents=True, exist_ok=False)
          archive_path = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle.zip'
          archive_path.write_bytes(archive)
          with zipfile.ZipFile(archive_path) as bundle:
              if bundle.testzip() is not None:
                  raise SystemExit('corrupt archive member')
              for info in bundle.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('unsafe archive path')
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit('archive symlink is forbidden')
              bundle.extractall(target)
          if (target / 'VERSION').read_text(encoding='utf-8').strip() != '2026.07.26-pr39-step1.2-hardening-rc3':
              raise SystemExit('RC3 VERSION mismatch')
          PY
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          chmod 0755 \
            "$BUNDLE/apply_pr39_complete_hardening.sh" \
            "$BUNDLE/scripts/apply_pr39_complete_hardening.sh"

      - name: Install Core development dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run self-test
        id: selftest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python "$RUNNER_TEMP/pr39-rc3-bundle/scripts/selftest_pr39_hardening_bundle.py" \
            2>&1 | tee "$RUNNER_TEMP/selftest.log"

      - name: Run exact-head dry-run
        id: dryrun
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --dry-run \
            --backup-dir "$RUNNER_TEMP/pr39-backups" \
            2>&1 | tee "$RUNNER_TEMP/dryrun.log"

      - name: Publish exact diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SELFTEST_OUTCOME: ${{ steps.selftest.outcome }}
          DRYRUN_OUTCOME: ${{ steps.dryrun.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          temp = Path(os.environ['RUNNER_TEMP'])
          sections = [
              '<!-- pr39-rc3-status -->',
              'PR39 RC3 permission-safe diagnostic:',
              '',
              f"- Head: `{os.environ['GITHUB_SHA']}`",
              f"- Self-test: **{os.environ.get('SELFTEST_OUTCOME', 'not-run')}**",
              f"- Exact-head dry-run: **{os.environ.get('DRYRUN_OUTCOME', 'not-run')}**",
              f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ]
          for title, filename in (('Self-test tail', 'selftest.log'), ('Dry-run tail', 'dryrun.log')):
              path = temp / filename
              if path.is_file():
                  text = path.read_text(encoding='utf-8', errors='replace')[-6000:]
                  sections.extend(['', f'### {title}', '```text', text, '```'])
          (temp / 'comment.md').write_text('\n'.join(sections), encoding='utf-8')
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            --input "$RUNNER_TEMP/comment.json" 2>/dev/null || \
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'comment.json').write_text(
              json.dumps({'body': (temp / 'comment.md').read_text(encoding='utf-8')}),
              encoding='utf-8',
          )
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            --input "$RUNNER_TEMP/comment.json"
