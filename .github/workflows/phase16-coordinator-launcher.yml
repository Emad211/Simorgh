name: Phase 1.6 Coordinator Registry Probe v8

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase16-coordinator-launcher.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm workflow registration
        run: echo "phase16_coordinator_registry=ready"
