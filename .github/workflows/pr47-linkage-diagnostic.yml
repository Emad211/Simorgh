name: PR47 Invocation Linkage Diagnostic

on:
  push:
    branches:
      - core/typed-results-artifacts
    paths:
      - .github/workflows/pr47-linkage-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr47-invocation-linkage-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Apply reconciliation ephemerally
        shell: bash
        run: |
          set +e
          python - <<'PY' > "$RUNNER_TEMP/patch.log" 2>&1
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              '.github/workflows/pr47-linkage-reconciliation.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          print(f'start_count={source.count(start_marker)}')
          if source.count(start_marker) != 1:
              raise SystemExit('reconciliation Python start marker is not unique')
          remainder = source.split(start_marker, 1)[1]
          print(f'end_count={remainder.count(end_marker)}')
          if remainder.count(end_marker) != 1:
              raise SystemExit('reconciliation Python end marker is not unique')
          embedded = dedent(remainder.split(end_marker, 1)[0])
          print(f'embedded_bytes={len(embedded.encode("utf-8"))}')
          exec(
              compile(embedded, 'pr47-linkage-reconciliation-embedded.py', 'exec'),
              {'__name__': '__main__'},
          )
          print('patch_status=0')
          PY
          echo "$?" > "$RUNNER_TEMP/patch.status"
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run separated post-patch quality diagnostics
        shell: bash
        run: |
          set +e
          patch_status=$(cat "$RUNNER_TEMP/patch.status")
          if [[ "$patch_status" != "0" ]]; then
            echo 99 > "$RUNNER_TEMP/install.status"
            echo 99 > "$RUNNER_TEMP/ruff.status"
            echo 99 > "$RUNNER_TEMP/mypy.status"
            echo 99 > "$RUNNER_TEMP/pytest.status"
            exit 0
          fi
          python -m pip install --upgrade pip > "$RUNNER_TEMP/install.log" 2>&1
          pip install -e '.[dev]' >> "$RUNNER_TEMP/install.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/install.status"
          if [[ "$(cat "$RUNNER_TEMP/install.status")" != "0" ]]; then
            echo 99 > "$RUNNER_TEMP/ruff.status"
            echo 99 > "$RUNNER_TEMP/mypy.status"
            echo 99 > "$RUNNER_TEMP/pytest.status"
            exit 0
          fi
          ruff check . > "$RUNNER_TEMP/ruff.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/ruff.status"
          mypy services/core/src > "$RUNNER_TEMP/mypy.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/mypy.status"
          pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/pytest.status"
          exit 0

      - name: Report exact diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "head=$GITHUB_SHA"
            echo "patch_status=$(cat "$RUNNER_TEMP/patch.status")"
            echo "install_status=$(cat "$RUNNER_TEMP/install.status" 2>/dev/null || echo missing)"
            echo "ruff_status=$(cat "$RUNNER_TEMP/ruff.status" 2>/dev/null || echo missing)"
            echo "mypy_status=$(cat "$RUNNER_TEMP/mypy.status" 2>/dev/null || echo missing)"
            echo "pytest_status=$(cat "$RUNNER_TEMP/pytest.status" 2>/dev/null || echo missing)"
            echo "--- patch_tail ---"
            tail -c 9000 "$RUNNER_TEMP/patch.log" 2>/dev/null
            echo "--- ruff_tail ---"
            tail -c 6000 "$RUNNER_TEMP/ruff.log" 2>/dev/null
            echo "--- mypy_tail ---"
            tail -c 6000 "$RUNNER_TEMP/mypy.log" 2>/dev/null
            echo "--- pytest_tail ---"
            tail -c 12000 "$RUNNER_TEMP/pytest.log" 2>/dev/null
          } > "$RUNNER_TEMP/report.txt"
          body=$(python - <<'PY'
          from pathlib import Path
          text = Path('${{ runner.temp }}/report.txt').read_text(
              encoding='utf-8', errors='replace'
          )
          print('PR #47 linkage diagnostic — no product files persisted.\n\n```text\n' + text + '\n```')
          PY
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/47/comments" -f body="$body"
