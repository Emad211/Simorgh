name: PR40 Specialist Contract Preflight

on:
  push:
    branches:
      - core/specialist-execution-interface

permissions:
  contents: write

concurrency:
  group: pr40-specialist-contract-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact contract corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('services/core/src/simorgh_core/agents/specialist_execution.py')
          text = source.read_text(encoding='utf-8')
          replacements = (
              (
                  'import time\nfrom collections.abc import Callable, Iterable\n',
                  'import re\nimport time\nfrom collections.abc import Callable, Iterable\n',
              ),
              (
                  '_RESOURCE_ID_PATTERN = r"^[a-z][a-z0-9]*(?:[._:/-][a-z0-9]+)*$"\n',
                  '_AGENT_ID_PATTERN = r"^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"\n'
                  '_POLICY_VERSION_PATTERN = r"^[0-9]+\\.[0-9]+\\.[0-9]+$"\n'
                  '_RESOURCE_ID_PATTERN = r"^[a-z][a-z0-9]*(?:[._:/-][a-z0-9]+)*$"\n',
              ),
              (
                  '    agent_id: str = Field(pattern=_RESOURCE_ID_PATTERN, max_length=128)\n'
                  '    agent_version: str = Field(pattern=r"^[0-9]+\\.[0-9]+\\.[0-9]+$", max_length=32)\n',
                  '    agent_id: str = Field(pattern=_AGENT_ID_PATTERN, max_length=128)\n'
                  '    agent_version: str = Field(pattern=_POLICY_VERSION_PATTERN, max_length=32)\n',
              ),
              (
                  '    agent_id: str = Field(pattern=_RESOURCE_ID_PATTERN, max_length=128)\n'
                  '    agent_version: str = Field(pattern=r"^[0-9]+\\.[0-9]+\\.[0-9]+$", max_length=32)\n',
                  '    agent_id: str = Field(pattern=_AGENT_ID_PATTERN, max_length=128)\n'
                  '    agent_version: str = Field(pattern=_POLICY_VERSION_PATTERN, max_length=32)\n',
              ),
              (
                  '        for executor in executors:\n'
                  '            identity = (executor.agent_id, executor.agent_version)\n',
                  '        for executor in executors:\n'
                  '            if re.fullmatch(_AGENT_ID_PATTERN, executor.agent_id) is None:\n'
                  '                raise SpecialistExecutionPolicyError(\n'
                  '                    "specialist executor agent_id is invalid"\n'
                  '                )\n'
                  '            if re.fullmatch(_POLICY_VERSION_PATTERN, executor.agent_version) is None:\n'
                  '                raise SpecialistExecutionPolicyError(\n'
                  '                    "specialist executor version is invalid"\n'
                  '                )\n'
                  '            if re.fullmatch(_RESOURCE_ID_PATTERN, executor.output_contract) is None:\n'
                  '                raise SpecialistExecutionPolicyError(\n'
                  '                    "specialist executor output contract is invalid"\n'
                  '                )\n'
                  '            identity = (executor.agent_id, executor.agent_version)\n',
              ),
          )
          current = text
          for old, new in replacements:
              if current.count(old) != 1:
                  raise SystemExit(f'source anchor mismatch for {old[:60]!r}: {current.count(old)}')
              current = current.replace(old, new, 1)
          source.write_text(current, encoding='utf-8')

          tests = Path('services/core/tests/test_specialist_execution_contracts.py')
          test_text = tests.read_text(encoding='utf-8')
          old_import = '    SpecialistExecutionOutcome,\n    SpecialistExecutionPolicyError,\n'
          new_import = (
              '    SpecialistExecutionOutcome,\n'
              '    SpecialistExecutionPolicyError,\n'
              '    SpecialistExecutionRequest,\n'
          )
          old_return = 'def _request() -> tuple[TaskEnvelope, object]:\n'
          new_return = 'def _request() -> tuple[TaskEnvelope, SpecialistExecutionRequest]:\n'
          if test_text.count(old_import) != 1 or test_text.count(old_return) != 1:
              raise SystemExit('test typing anchors are not unique')
          test_text = test_text.replace(old_import, new_import, 1)
          test_text = test_text.replace(old_return, new_return, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY
          rm -f .github/workflows/pr40-contract-preflight.yml
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install and validate focused slice
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check \
            services/core/src/simorgh_core/agents/specialist_execution.py \
            services/core/tests/test_specialist_execution_contracts.py
          mypy services/core/src/simorgh_core/agents/specialist_execution.py
          pytest -q services/core/tests/test_specialist_execution_contracts.py

      - name: Commit validated contract slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: validate specialist execution contract slice'
          git push origin HEAD:core/specialist-execution-interface
