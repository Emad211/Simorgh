name: Phase 1.8 Trace Service Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase18-trace-service-fix.yml

permissions:
  contents: write

concurrency:
  group: phase18-trace-service-fix
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply exact trace service fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              'services/core/src/simorgh_core/agents/trace_service.py'
          )
          text = path.read_text(encoding='utf-8')

          replacements = (
              (
                  'from simorgh_core.agents.context_store import (\n',
                  'from simorgh_core.agents.context_store import (\n',
                  'context import anchor',
              ),
              (
                  'from simorgh_core.agents.invocations import (\n',
                  'from simorgh_core.agents.contracts import UsageVector\n'
                  'from simorgh_core.agents.invocations import (\n',
                  'usage import',
              ),
              (
                  'from simorgh_core.agents.tracing import (\n'
                  '    CacheDisposition,\n'
                  '    TraceEvent,\n',
                  'from simorgh_core.agents.tracing import (\n'
                  '    TraceEvent,\n',
                  'unused cache import',
              ),
              (
                  '            byte_count=_first_int(metadata, "byte_count", "total_bytes", "response_bytes"),\n',
                  '            byte_count=_first_int(\n'
                  '                metadata,\n'
                  '                "byte_count",\n'
                  '                "total_bytes",\n'
                  '                "response_bytes",\n'
                  '            ),\n',
                  'byte count line',
              ),
              (
                  '            if candidate.operation_id is not None and candidate.operation_id != decision.decision_id:\n',
                  '            if (\n'
                  '                candidate.operation_id is not None\n'
                  '                and candidate.operation_id != decision.decision_id\n'
                  '            ):\n',
                  'routing decision line',
              ),
              (
                  '            if candidate.rule_id is not None and candidate.rule_id not in decision.matched_rule_ids:\n',
                  '            if (\n'
                  '                candidate.rule_id is not None\n'
                  '                and candidate.rule_id not in decision.matched_rule_ids\n'
                  '            ):\n',
                  'routing rule line',
              ),
              (
                  '            if expected_hash is not None:\n'
                  '                if result is None or result.ownership_snapshot_sha256 != expected_hash:\n'
                  '                    raise TraceCorrelationError(\n'
                  '                        "cancellation ownership snapshot conflicts"\n'
                  '                    )\n',
                  '            if expected_hash is not None and (\n'
                  '                result is None\n'
                  '                or result.ownership_snapshot_sha256 != expected_hash\n'
                  '            ):\n'
                  '                raise TraceCorrelationError(\n'
                  '                    "cancellation ownership snapshot conflicts"\n'
                  '                )\n',
                  'cancellation condition',
              ),
              (
                  '        if candidate.provider_id is not None and candidate.provider_id != invocation.provider_id:\n',
                  '        if (\n'
                  '            candidate.provider_id is not None\n'
                  '            and candidate.provider_id != invocation.provider_id\n'
                  '        ):\n',
                  'provider line',
              ),
              (
                  '        if candidate.connector_id is not None and candidate.connector_id != invocation.connector_id:\n',
                  '        if (\n'
                  '            candidate.connector_id is not None\n'
                  '            and candidate.connector_id != invocation.connector_id\n'
                  '        ):\n',
                  'connector line',
              ),
              (
                  '        if candidate.metadata.effect is not None and candidate.metadata.effect != invocation.effect.value:\n',
                  '        if (\n'
                  '            candidate.metadata.effect is not None\n'
                  '            and candidate.metadata.effect != invocation.effect.value\n'
                  '        ):\n',
                  'effect line',
              ),
              (
                  '            if (\n'
                  '                candidate.usage_delta != invocation.committed_usage\n'
                  '                and candidate.usage_delta.model_dump() != {}\n'
                  '            ):\n'
                  '                zero = candidate.usage_delta.__class__()\n'
                  '                if candidate.usage_delta != zero:\n'
                  '                    raise TraceCorrelationError("failure trace usage conflicts")\n',
                  '            if (\n'
                  '                candidate.usage_delta != UsageVector()\n'
                  '                and candidate.usage_delta != invocation.committed_usage\n'
                  '            ):\n'
                  '                raise TraceCorrelationError("failure trace usage conflicts")\n',
                  'failure usage validation',
              ),
              (
                  '        if candidate.agent_id is not None and context.agent_id != candidate.agent_id:\n',
                  '        if (\n'
                  '            candidate.agent_id is not None\n'
                  '            and context.agent_id != candidate.agent_id\n'
                  '        ):\n',
                  'context agent line',
              ),
              (
                  '        if candidate.agent_version is not None and context.agent_version != candidate.agent_version:\n',
                  '        if (\n'
                  '            candidate.agent_version is not None\n'
                  '            and context.agent_version != candidate.agent_version\n'
                  '        ):\n',
                  'context version line',
              ),
              (
                  '        if candidate.privacy != context.privacy or candidate.retention != context.retention:\n',
                  '        if (\n'
                  '            candidate.privacy != context.privacy\n'
                  '            or candidate.retention != context.retention\n'
                  '        ):\n',
                  'context classification line',
              ),
              (
                  '        if candidate.invocation_id is not None and result.invocation_id != candidate.invocation_id:\n',
                  '        if (\n'
                  '            candidate.invocation_id is not None\n'
                  '            and result.invocation_id != candidate.invocation_id\n'
                  '        ):\n',
                  'result invocation line',
              ),
              (
                  '        if candidate.agent_id is not None and result.producer_agent_id != candidate.agent_id:\n',
                  '        if (\n'
                  '            candidate.agent_id is not None\n'
                  '            and result.producer_agent_id != candidate.agent_id\n'
                  '        ):\n',
                  'result producer line',
              ),
              (
                  '        if candidate.privacy != result.privacy or candidate.retention != result.retention:\n',
                  '        if (\n'
                  '            candidate.privacy != result.privacy\n'
                  '            or candidate.retention != result.retention\n'
                  '        ):\n',
                  'result classification line',
              ),
          )

          for old, new, label in replacements:
              count = text.count(old)
              if label == 'context import anchor':
                  if count != 1:
                      raise SystemExit(f'{label} count={count}, expected=1')
                  continue
              if count != 1:
                  raise SystemExit(f'{label} count={count}, expected=1')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/phase18-trace-service-fix.yml').unlink()
          PY
          git diff --check

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix services/core/src/simorgh_core/agents/trace_service.py
          ruff check .
          mypy services/core/src
          pytest
          git diff --check
          test ! -e .github/workflows/phase18-trace-service-fix.yml

      - name: Commit validated product fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: harden native trace projection and correlation'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/correlated-execution-trace
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$HEAD_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $HEAD_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
