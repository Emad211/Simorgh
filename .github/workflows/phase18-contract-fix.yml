name: Phase 1.8 Contract Fix

on:
  push:
    branches:
      - core/end-to-end-trace
    paths:
      - .github/workflows/phase18-contract-fix.yml

permissions:
  contents: write

concurrency:
  group: phase18-contract-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Patch canonical construction and lint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("services/core/src/simorgh_core/agents/trace_contracts.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "from typing import Annotated, Any, Literal, Self, TypeAlias": (
                  "from typing import Annotated, Any, Literal, Self"
              ),
              "TraceEventDetails: TypeAlias = Annotated[": (
                  "type TraceEventDetails = Annotated["
              ),
              '''    return canonical_fingerprint(
              [
                  {
                      "sequence": event.sequence,
                      "event_id": str(event.event_id),
                      "canonical_sha256": event.canonical_sha256,
                  }
                  for event in events
              ]
          )''': '''    return canonical_fingerprint(
              {
                  "events": [
                      {
                          "sequence": event.sequence,
                          "event_id": str(event.event_id),
                          "canonical_sha256": event.canonical_sha256,
                      }
                      for event in events
                  ]
              }
          )''',
              '''    return TraceEventCandidate.model_validate(
              {
                  **payload,
                  "event_id": event_id,
                  "canonical_sha256": trace_event_canonical_sha256(payload),
              }
          )''': '''    provisional = TraceEventCandidate.model_construct(
              **payload,
              event_id=event_id,
              canonical_sha256="0" * 64,
          )
              return TraceEventCandidate.model_validate(
              {
                  **provisional.model_dump(mode="json"),
                  "canonical_sha256": trace_event_canonical_sha256(provisional),
              }
          )''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"patch anchor count={count}, expected=1: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/phase18-contract-fix.yml").unlink()
          PY

          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix --unsafe-fixes services/core/src/simorgh_core/agents/trace_contracts.py
          ruff format services/core/src/simorgh_core/agents/trace_contracts.py
          git diff --check
          test ! -e .github/workflows/phase18-contract-fix.yml

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy services/core/src
          pytest
          git diff --check

      - name: Commit validated contract fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: harden durable trace canonical identity'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/end-to-end-trace
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
