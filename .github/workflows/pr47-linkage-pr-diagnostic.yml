name: PR47 Linkage PR Diagnostic v4

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr47-linkage-pr-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply reconciliation ephemerally
        shell: bash
        run: |
          set +e
          python - <<'PY' > "$RUNNER_TEMP/patch.log" 2>&1
          from pathlib import Path
          from textwrap import dedent

          source_path = Path(
              '.github/workflows/pr47-linkage-reconciliation.yml'
          )
          source = source_path.read_text(encoding='utf-8')
          old_anchor = (
              "              '            committed_usage=invocation.committed_usage,\\n'\n"
              "              '            invocation_result_sha256=canonical_fingerprint(\\n'\n"
              "              '                durable_result_payload\\n'\n"
              "              '            ),\\n',\n"
          )
          new_anchor = (
              "              '            committed_usage=invocation.committed_usage,\\n'\n"
              "              '            invocation_result_sha256=canonical_fingerprint(durable_result_payload),\\n',\n"
          )
          print(f'terminalizer_payload_anchor_count={source.count(old_anchor)}')
          if source.count(old_anchor) != 1:
              raise SystemExit(
                  'terminalizer reconciliation payload anchor is not unique'
              )
          source = source.replace(old_anchor, new_anchor, 1)
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          print(f'start_count={source.count(start_marker)}')
          if source.count(start_marker) != 1:
              raise SystemExit('reconciliation Python start marker is not unique')
          remainder = source.split(start_marker, 1)[1]
          print(f'end_count={remainder.count(end_marker)}')
          if remainder.count(end_marker) != 1:
              raise SystemExit('reconciliation Python end marker is not unique')
          embedded = dedent(remainder.split(end_marker, 1)[0])
          print(f'embedded_bytes={len(embedded.encode("utf-8"))}')
          exec(
              compile(embedded, 'pr47-linkage-reconciliation-embedded.py', 'exec'),
              {'__name__': '__main__'},
          )
          print('patch_complete=true')
          PY
          echo "$?" > "$RUNNER_TEMP/patch.status"
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install and run separated diagnostics
        shell: bash
        run: |
          set +e
          patch_status=$(cat "$RUNNER_TEMP/patch.status")
          if [[ "$patch_status" == "0" ]]; then
            python -m pip install --upgrade pip > "$RUNNER_TEMP/install.log" 2>&1
            pip install -e '.[dev]' >> "$RUNNER_TEMP/install.log" 2>&1
            install_status=$?
            ruff check . > "$RUNNER_TEMP/ruff.log" 2>&1
            ruff_status=$?
            mypy services/core/src > "$RUNNER_TEMP/mypy.log" 2>&1
            mypy_status=$?
            pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
            pytest_status=$?
          else
            install_status=99
            ruff_status=99
            mypy_status=99
            pytest_status=99
            : > "$RUNNER_TEMP/install.log"
            : > "$RUNNER_TEMP/ruff.log"
            : > "$RUNNER_TEMP/mypy.log"
            : > "$RUNNER_TEMP/pytest.log"
          fi
          {
            echo "patch_status=$patch_status"
            echo "install_status=$install_status"
            echo "ruff_status=$ruff_status"
            echo "mypy_status=$mypy_status"
            echo "pytest_status=$pytest_status"
            echo "--- patch_tail ---"
            tail -c 6000 "$RUNNER_TEMP/patch.log"
            echo "--- ruff_tail ---"
            tail -c 6000 "$RUNNER_TEMP/ruff.log"
            echo "--- mypy_tail ---"
            tail -c 6000 "$RUNNER_TEMP/mypy.log"
            echo "--- pytest_tail ---"
            tail -c 10000 "$RUNNER_TEMP/pytest.log"
          } > "$RUNNER_TEMP/report.txt"
          cat "$RUNNER_TEMP/report.txt"
          exit 0

      - name: Upload exact diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: pr47-linkage-diagnostic
          path: ${{ runner.temp }}/report.txt
          if-no-files-found: error
          retention-days: 2
