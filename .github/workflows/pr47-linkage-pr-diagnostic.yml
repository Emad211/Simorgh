name: PR47 Linkage PR Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr47-linkage-pr-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply reconciliation ephemerally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              '.github/workflows/pr47-linkage-reconciliation.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1:
              raise SystemExit('reconciliation Python start marker is not unique')
          remainder = source.split(start_marker, 1)[1]
          if remainder.count(end_marker) != 1:
              raise SystemExit('reconciliation Python end marker is not unique')
          embedded = dedent(remainder.split(end_marker, 1)[0])
          exec(
              compile(embedded, 'pr47-linkage-reconciliation-embedded.py', 'exec'),
              {'__name__': '__main__'},
          )
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Ruff after linkage
        run: ruff check .

      - name: MyPy after linkage
        run: mypy services/core/src

      - name: Tests after linkage
        run: pytest
