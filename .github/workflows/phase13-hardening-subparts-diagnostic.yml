name: Phase 1.3 subpart hardening diagnostic

on:
  push:
    branches:
      - core/specialist-execution-interface
    paths:
      - .github/workflows/phase13-hardening-subparts-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify every source fragment and apply ephemerally
        shell: bash
        run: |
          set +e
          d=.simorgh-patches/phase13-hardening
          {
            echo "head=$GITHUB_SHA"
            sha256sum \
              "$d/p00-00.b64" "$d/p00-01.b64" "$d/p00-02.b64" "$d/p00-03.b64" \
              "$d/part-01.b64" \
              "$d/p02-00.b64" "$d/p02-01.b64" "$d/p02-02.b64" "$d/p02-03.b64" \
              "$d/part-03.b64"
          } > "$RUNNER_TEMP/report.txt"
          cat \
            "$d/p00-00.b64" "$d/p00-01.b64" "$d/p00-02.b64" "$d/p00-03.b64" \
            "$d/part-01.b64" \
            "$d/p02-00.b64" "$d/p02-01.b64" "$d/p02-02.b64" "$d/p02-03.b64" \
            "$d/part-03.b64" > "$RUNNER_TEMP/script.b64"
          rebuilt_sha=$(sha256sum "$RUNNER_TEMP/script.b64" | awk '{print $1}')
          echo "rebuilt_b64_sha=$rebuilt_sha" >> "$RUNNER_TEMP/report.txt"
          echo "expected_b64_sha=f3f2faa897fc91dc53554c7e8c4e68ad9dd4aad58da5ae9af120271870d0e8e9" >> "$RUNNER_TEMP/report.txt"
          base64 --decode "$RUNNER_TEMP/script.b64" | gunzip > "$RUNNER_TEMP/patch.py" 2>"$RUNNER_TEMP/decode.log"
          decode_status=$?
          script_sha=$(sha256sum "$RUNNER_TEMP/patch.py" | awk '{print $1}')
          echo "decode_status=$decode_status" >> "$RUNNER_TEMP/report.txt"
          echo "script_sha=$script_sha" >> "$RUNNER_TEMP/report.txt"
          echo "expected_script_sha=d78f40938624a8b545c46c0449f8d637be089f43225744ef70dbc053bc0adff9" >> "$RUNNER_TEMP/report.txt"
          if [[ $decode_status -eq 0 ]]; then
            python "$RUNNER_TEMP/patch.py" > "$RUNNER_TEMP/patch.log" 2>&1
            patch_status=$?
          else
            patch_status=99
            cp "$RUNNER_TEMP/decode.log" "$RUNNER_TEMP/patch.log"
          fi
          echo "patch_status=$patch_status" >> "$RUNNER_TEMP/report.txt"
          echo "--- patch_log_tail ---" >> "$RUNNER_TEMP/report.txt"
          tail -c 7000 "$RUNNER_TEMP/patch.log" >> "$RUNNER_TEMP/report.txt"
          cat "$RUNNER_TEMP/report.txt"

      - name: Report diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body=$(python - <<'PY'
          from pathlib import Path
          text = Path('${{ runner.temp }}/report.txt').read_text(encoding='utf-8', errors='replace')
          print('Phase 1.3 subpart hardening diagnostic (ephemeral only):\n\n```text\n' + text + '\n```')
          PY
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/41/comments" -f body="$body"
