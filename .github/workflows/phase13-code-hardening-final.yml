name: Phase 1.3 code hardening finalizer

on:
  push:
    branches:
      - core/specialist-execution-interface
    paths:
      - .github/workflows/phase13-code-hardening-final.yml

concurrency:
  group: phase13-code-hardening-finalizer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Report exact-head start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/41/comments" \
            -f body="Phase 1.3 code hardening started on exact head \`${GITHUB_SHA}\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No product commit is claimed until all Core and Android gates pass."

      - name: Verify and apply audited hardening patch
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/phase13_reconcile.py.gz.b64
          echo "f3f2faa897fc91dc53554c7e8c4e68ad9dd4aad58da5ae9af120271870d0e8e9  scripts/phase13_reconcile.py.gz.b64" \
            | sha256sum --check --strict
          base64 --decode scripts/phase13_reconcile.py.gz.b64 | gunzip > "$RUNNER_TEMP/phase13_code_hardening.py"
          echo "d78f40938624a8b545c46c0449f8d637be089f43225744ef70dbc053bc0adff9  $RUNNER_TEMP/phase13_code_hardening.py" \
            | sha256sum --check --strict
          python "$RUNNER_TEMP/phase13_code_hardening.py"

      - name: Remove temporary publication material
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/phase13_reconcile.py.gz.b64
          rmdir scripts 2>/dev/null || true
          rm -f .github/workflows/phase13-reconcile-final.yml
          rm -f .github/workflows/phase13-code-hardening-final.yml

      - name: Enforce bounded product diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          allowed=$(cat <<'EOF'
          .github/workflows/phase13-code-hardening-final.yml
          .github/workflows/phase13-reconcile-final.yml
          docs/IMPLEMENTATION_MASTER_PLAN.md
          docs/SPECIALIST_EXECUTION.md
          docs/adr/0016-native-specialist-execution-authority.md
          scripts/phase13_reconcile.py.gz.b64
          services/core/src/simorgh_core/agents/budget.py
          services/core/src/simorgh_core/agents/specialist_execution.py
          services/core/src/simorgh_core/agents/specialist_runtime.py
          services/core/src/simorgh_core/agents/specialist_service.py
          services/core/src/simorgh_core/agents/tracing.py
          services/core/tests/test_specialist_execution_hardening.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "${changed[@]}") <(printf '%s\n' "$allowed" | sort))
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          test -f services/core/tests/test_specialist_execution_hardening.py
          test -f docs/adr/0016-native-specialist-execution-authority.md
          test ! -e scripts/phase13_reconcile.py.gz.b64
          test ! -e .github/workflows/phase13-reconcile-final.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run Core quality gates
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy services/core/src
          pytest

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Android quality gates
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :apps:android:assembleDebug \
            :apps:android:testDebugUnitTest \
            :apps:android:lintDebug \
            --stacktrace

      - name: Commit validated product state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Core: harden typed specialist execution authority'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/specialist-execution-interface
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Report finalizer outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status='${{ job.status }}'
          gh api "repos/${GITHUB_REPOSITORY}/issues/41/comments" \
            -f body="Phase 1.3 code hardening finalizer finished with status **${status}** for trigger head \`${GITHUB_SHA}\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. A validated product commit exists only if the protected push step succeeded."
