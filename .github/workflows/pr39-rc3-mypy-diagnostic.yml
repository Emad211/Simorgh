name: PR39 RC3 Lock Adapter Gate Isolation

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-lock-adapter-diagnostic
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Core dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Prepare exact RC3 workspace
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python .simorgh-patches/pr39-rc3/prepare_rc3.py \
            "$GITHUB_WORKSPACE" \
            --temp "$RUNNER_TEMP/pr39-prepare" \
            2>&1 | tee "$RUNNER_TEMP/prepare.log"

      - name: Apply dynamic Windows adapter
        id: adapter
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/adapter.log"
          from pathlib import Path

          path = Path('services/core/src/simorgh_core/agents/store_lock.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'from typing import BinaryIO, Self\n',
                  'from typing import Any, BinaryIO, Self\n',
              ),
              (
                  '                msvcrt.locking(handle.fileno(), msvcrt.LK_NBLCK, 1)\n',
                  '                windows_lock: Any = msvcrt\n'
                  '                windows_lock.locking(\n'
                  '                    handle.fileno(),\n'
                  '                    windows_lock.LK_NBLCK,\n'
                  '                    1,\n'
                  '                )\n',
              ),
              (
                  '                msvcrt.locking(handle.fileno(), msvcrt.LK_UNLCK, 1)\n',
                  '                windows_lock: Any = msvcrt\n'
                  '                windows_lock.locking(\n'
                  '                    handle.fileno(),\n'
                  '                    windows_lock.LK_UNLCK,\n'
                  '                    1,\n'
                  '                )\n',
              ),
          )
          for old, new in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              print(f'anchor old={old_count} final={new_count}')
              if old_count != 1 or new_count != 0:
                  raise SystemExit('Windows lock adapter anchor mismatch')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile services/core/src/simorgh_core/agents/store_lock.py

      - name: Ruff diagnostic
        id: ruff
        if: steps.adapter.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check --fix --select I services/core/src/simorgh_core/agents/store_lock.py
          ruff check services/core/src/simorgh_core/agents/store_lock.py \
            --output-format concise 2>&1 | tee "$RUNNER_TEMP/ruff.log"

      - name: Strict MyPy diagnostic
        id: mypy
        if: steps.adapter.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy services/core/src 2>&1 | tee "$RUNNER_TEMP/mypy.log"

      - name: Publish isolated results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE: ${{ steps.prepare.outcome }}
          ADAPTER: ${{ steps.adapter.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          lines = [
              '<!-- pr39-rc3-status -->',
              'PR39 RC3 lock-adapter isolated diagnostic:',
              '',
              f"- Head: `{os.environ['GITHUB_SHA']}`",
              f"- RC3 prepare: **{os.environ.get('PREPARE', 'not-run')}**",
              f"- Adapter patch: **{os.environ.get('ADAPTER', 'not-run')}**",
              f"- Ruff: **{os.environ.get('RUFF', 'not-run')}**",
              f"- Strict MyPy: **{os.environ.get('MYPY', 'not-run')}**",
              f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ]
          for title, filename in (
              ('Prepare', 'prepare.log'),
              ('Adapter', 'adapter.log'),
              ('Ruff', 'ruff.log'),
              ('MyPy', 'mypy.log'),
          ):
              path = temp / filename
              if path.is_file():
                  lines.extend(['', f'### {title}', '```text', path.read_text(errors='replace')[-8000:], '```'])
          (temp / 'comment.json').write_text(json.dumps({'body': '\n'.join(lines)}), encoding='utf-8')
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            --input "$RUNNER_TEMP/comment.json"
