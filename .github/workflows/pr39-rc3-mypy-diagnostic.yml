name: PR39 RC3 MyPy Diagnostic

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-mypy-diagnostic
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact connector-authored head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Core dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Prepare exact RC3 product workspace
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python .simorgh-patches/pr39-rc3/prepare_rc3.py \
              "$GITHUB_WORKSPACE" \
              --temp "$RUNNER_TEMP/pr39-prepare"
            ruff check .
          } 2>&1 | tee "$RUNNER_TEMP/prepare.log"

      - name: Run strict MyPy diagnostic
        id: mypy
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy services/core/src 2>&1 | tee "$RUNNER_TEMP/mypy.log"

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          sections = [
              '<!-- pr39-rc3-status -->',
              'PR39 RC3 exact-head type diagnostic:',
              '',
              f"- Head: `{os.environ['GITHUB_SHA']}`",
              f"- Single-path RC3 prepare + Ruff: **{os.environ.get('PREPARE_OUTCOME', 'not-run')}**",
              f"- Strict MyPy: **{os.environ.get('MYPY_OUTCOME', 'not-run')}**",
              f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ]
          for title, filename in (
              ('Prepare/Ruff tail', 'prepare.log'),
              ('MyPy tail', 'mypy.log'),
          ):
              path = temp / filename
              if not path.is_file():
                  continue
              sections.extend([
                  '',
                  f'### {title}',
                  '```text',
                  path.read_text(encoding='utf-8', errors='replace')[-14000:],
                  '```',
              ])
          (temp / 'comment.json').write_text(
              json.dumps({'body': '\n'.join(sections)}),
              encoding='utf-8',
          )
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            --input "$RUNNER_TEMP/comment.json"

      - name: Enforce diagnostic preparation
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        shell: bash
        run: test "$PREPARE_OUTCOME" = success
