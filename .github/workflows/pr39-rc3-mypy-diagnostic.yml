name: PR39 RC3 Lock Adapter Diagnostic

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-lock-adapter-diagnostic
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact connector-authored head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Core dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Prepare exact RC3 workspace and Protocol adapter
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python .simorgh-patches/pr39-rc3/prepare_rc3.py \
              "$GITHUB_WORKSPACE" \
              --temp "$RUNNER_TEMP/pr39-prepare"
            python - <<'PY'
            from pathlib import Path

            path = Path('services/core/src/simorgh_core/agents/store_lock.py')
            text = path.read_text(encoding='utf-8')
            replacements = (
                (
                    'from typing import BinaryIO, Self\n',
                    'from typing import BinaryIO, Protocol, Self, cast\n',
                ),
                (
                    'class ExclusiveStoreLockError(RuntimeError):\n',
                    'class _WindowsLockApi(Protocol):\n'
                    '    LK_NBLCK: int\n'
                    '    LK_UNLCK: int\n\n'
                    '    def locking(\n'
                    '        self,\n'
                    '        file_descriptor: int,\n'
                    '        mode: int,\n'
                    '        byte_count: int,\n'
                    '        /,\n'
                    '    ) -> None: ...\n\n\n'
                    'class ExclusiveStoreLockError(RuntimeError):\n',
                ),
                (
                    '                msvcrt.locking(handle.fileno(), msvcrt.LK_NBLCK, 1)\n',
                    '                windows_lock = cast(_WindowsLockApi, msvcrt)\n'
                    '                windows_lock.locking(\n'
                    '                    handle.fileno(),\n'
                    '                    windows_lock.LK_NBLCK,\n'
                    '                    1,\n'
                    '                )\n',
                ),
                (
                    '                msvcrt.locking(handle.fileno(), msvcrt.LK_UNLCK, 1)\n',
                    '                windows_lock = cast(_WindowsLockApi, msvcrt)\n'
                    '                windows_lock.locking(\n'
                    '                    handle.fileno(),\n'
                    '                    windows_lock.LK_UNLCK,\n'
                    '                    1,\n'
                    '                )\n',
                ),
            )
            for old, new in replacements:
                if text.count(old) != 1 or text.count(new) != 0:
                    raise SystemExit(
                        f'lock-adapter anchor mismatch old={text.count(old)} final={text.count(new)}'
                    )
                text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')
            PY
            ruff check --fix --select I services/core/src/simorgh_core/agents/store_lock.py
          } 2>&1 | tee "$RUNNER_TEMP/prepare.log"

      - name: Run Ruff diagnostic
        id: ruff
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check services/core/src/simorgh_core/agents/store_lock.py \
            --output-format concise 2>&1 | tee "$RUNNER_TEMP/ruff.log"

      - name: Run strict MyPy diagnostic
        id: mypy
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy services/core/src 2>&1 | tee "$RUNNER_TEMP/mypy.log"

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          sections = [
              '<!-- pr39-rc3-status -->',
              'PR39 RC3 Windows lock-adapter diagnostic:',
              '',
              f"- Head: `{os.environ['GITHUB_SHA']}`",
              f"- RC3 prepare + adapter: **{os.environ.get('PREPARE_OUTCOME', 'not-run')}**",
              f"- Ruff: **{os.environ.get('RUFF_OUTCOME', 'not-run')}**",
              f"- Strict MyPy: **{os.environ.get('MYPY_OUTCOME', 'not-run')}**",
              f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ]
          for title, filename in (
              ('Prepare tail', 'prepare.log'),
              ('Ruff tail', 'ruff.log'),
              ('MyPy tail', 'mypy.log'),
          ):
              path = temp / filename
              if not path.is_file():
                  continue
              sections.extend([
                  '',
                  f'### {title}',
                  '```text',
                  path.read_text(encoding='utf-8', errors='replace')[-12000:],
                  '```',
              ])
          (temp / 'comment.json').write_text(
              json.dumps({'body': '\n'.join(sections)}),
              encoding='utf-8',
          )
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            --input "$RUNNER_TEMP/comment.json"

      - name: Enforce preparation only
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        shell: bash
        run: test "$PREPARE_OUTCOME" = success
