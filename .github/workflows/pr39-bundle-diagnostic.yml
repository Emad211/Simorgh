name: PR39 Bundle Diagnostic

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-bundle-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/durable-agent-invocation-store
          fetch-depth: 1

      - name: Inspect staged archive without executing it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/pr39-bundle-report.txt"
          from pathlib import Path
          import base64
          import hashlib
          import subprocess
          import zipfile
          import io

          source = Path('.simorgh-patches/pr39-rc3/part-00.b64')
          print(f'head={subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()}')
          if not source.is_file():
              print('staged_file=missing')
              raise SystemExit(0)
          raw = source.read_bytes()
          print(f'git_blob={subprocess.check_output(["git", "hash-object", str(source)], text=True).strip()}')
          print(f'file_bytes={len(raw)}')
          print(f'file_sha256={hashlib.sha256(raw).hexdigest()}')
          try:
              encoded = raw.decode('ascii').strip()
              archive = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              print(f'base64_status=invalid:{type(exc).__name__}')
              raise SystemExit(0)
          print(f'base64_chars={len(encoded)}')
          print(f'archive_bytes={len(archive)}')
          print(f'archive_sha256={hashlib.sha256(archive).hexdigest()}')
          try:
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  bad = bundle.testzip()
                  print(f'zip_status={"ok" if bad is None else "bad:" + bad}')
                  names = bundle.namelist()
                  print(f'zip_entries={len(names)}')
                  roots = sorted({name.split("/", 1)[0] for name in names if name})
                  print('zip_roots=' + ','.join(roots[:20]))
                  versions = [name for name in names if name == 'VERSION' or name.endswith('/VERSION')]
                  print('version_paths=' + ','.join(versions))
                  for name in versions:
                      value = bundle.read(name).decode('utf-8', errors='replace').strip()
                      print(f'version[{name}]={value}')
          except Exception as exc:
              print(f'zip_status=invalid:{type(exc).__name__}')
          PY
          cat "$RUNNER_TEMP/pr39-bundle-report.txt"

      - name: Report diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT=$(cat "$RUNNER_TEMP/pr39-bundle-report.txt" 2>/dev/null || echo 'diagnostic report unavailable')
          gh api "repos/${GITHUB_REPOSITORY}/issues/39/comments" \
            -f body="PR39 staged-bundle diagnostic for run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}:\n\n\`\`\`text\n${REPORT}\n\`\`\`"
