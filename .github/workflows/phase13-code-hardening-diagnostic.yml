name: Phase 1.3 code hardening audit only

on:
  push:
    branches:
      - core/specialist-execution-interface
    paths:
      - .github/workflows/phase13-code-hardening-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: phase13-code-hardening-diagnostic
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Decode and hash without executing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path
          import py_compile

          source = Path('scripts/phase13_reconcile.py.gz.b64')
          audit = Path(os.environ['RUNNER_TEMP']) / 'audit'
          expected_source = 'f3f2faa897fc91dc53554c7e8c4e68ad9dd4aad58da5ae9af120271870d0e8e9'
          expected_script = 'd78f40938624a8b545c46c0449f8d637be089f43225744ef70dbc053bc0adff9'
          report: list[str] = [f'head={os.environ["GITHUB_SHA"]}']
          if not source.is_file():
              report.append('source=missing')
          else:
              raw = source.read_bytes()
              source_hash = hashlib.sha256(raw).hexdigest()
              report.extend([
                  f'source_bytes={len(raw)}',
                  f'source_sha256={source_hash}',
                  f'source_expected_sha256={expected_source}',
                  f'source_hash_match={source_hash == expected_source}',
              ])
              try:
                  compressed = base64.b64decode(raw.strip(), validate=True)
                  report.append('base64_status=valid')
                  report.append(f'gzip_bytes={len(compressed)}')
                  (audit / 'phase13_code_hardening.py.gz').write_bytes(compressed)
              except Exception as exc:
                  compressed = None
                  report.append(f'base64_status=invalid:{exc.__class__.__name__}')
              if compressed is not None:
                  try:
                      script = gzip.decompress(compressed)
                      script_hash = hashlib.sha256(script).hexdigest()
                      report.extend([
                          'gzip_status=valid',
                          f'script_bytes={len(script)}',
                          f'script_sha256={script_hash}',
                          f'script_expected_sha256={expected_script}',
                          f'script_hash_match={script_hash == expected_script}',
                      ])
                      script_path = audit / 'phase13_code_hardening.py'
                      script_path.write_bytes(script)
                      try:
                          py_compile.compile(str(script_path), doraise=True)
                          report.append('syntax_status=valid')
                      except Exception as exc:
                          report.append(f'syntax_status=invalid:{exc.__class__.__name__}')
                  except Exception as exc:
                      report.append(f'gzip_status=invalid:{exc.__class__.__name__}')
          (audit / 'REPORT.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Upload plain script for human review
        uses: actions/upload-artifact@v4
        with:
          name: phase13-code-hardening-script-audit
          path: ${{ runner.temp }}/audit
          if-no-files-found: error
          retention-days: 7

      - name: Report audit run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          REPORT=$(cat "$RUNNER_TEMP/audit/REPORT.txt" 2>/dev/null || echo 'report unavailable')
          gh api "repos/${GITHUB_REPOSITORY}/issues/41/comments" \
            -f body="Phase 1.3 hardening payload audit completed without executing the script. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\n\`\`\`text\n${REPORT}\n\`\`\`"
