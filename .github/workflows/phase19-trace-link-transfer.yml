name: Phase 1.9 Trace Link Transfer

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/phase19-trace-link-transfer.yml

permissions:
  contents: write

concurrency:
  group: phase19-trace-link-transfer
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: core/live-provider-staging
          fetch-depth: 16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Apply and validate deterministic candidate
        shell: bash
        run: |
          set +e
          set -u -o pipefail
          baseline=ccdf59a7c5b4f96ce6cd628f3ec720cd3aa93fec
          log=/tmp/phase19-trace-link-transfer.log
          status=0

          {
            echo "baseline=$baseline"
            echo "input_head=$(git rev-parse HEAD)"
            test "$(git merge-base HEAD "$baseline")" = "$baseline"
            actual="$(git diff --name-only "$baseline"..HEAD | sort)"
            expected=$'.github/workflows/phase19-trace-link-transfer.yml\ntools/apply_phase19_trace_link.py'
            test "$actual" = "$expected"
            python tools/apply_phase19_trace_link.py
            ruff check . --exclude tools/apply_phase19_trace_link.py
            mypy services/core/src
            pytest
            git diff --check
          } >"$log" 2>&1
          status=$?

          sed -E 's/(api[_-]?key|authorization|bearer)[^[:space:]]*/[redacted]/Ig' "$log" | tail -n 320
          exit "$status"
