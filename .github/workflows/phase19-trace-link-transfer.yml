name: Phase 1.9 Trace Link Transfer

on:
  push:
    branches:
      - core/live-provider-staging
    paths:
      - .github/workflows/phase19-trace-link-transfer.yml

permissions:
  contents: write

concurrency:
  group: phase19-trace-link-transfer
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: core/live-provider-staging
          fetch-depth: 4

      - name: Verify exact transfer ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "ccdf59a7c5b4f96ce6cd628f3ec720cd3aa93fec"
          test "$(git diff --name-only HEAD~2..HEAD | sort)" = $'.github/workflows/phase19-trace-link-transfer.yml\ntools/apply_phase19_trace_link.py'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply deterministic candidate
        run: python tools/apply_phase19_trace_link.py

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Core candidate
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy services/core/src
          pytest
          git diff --check

      - name: Verify final product diff
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_phase19_trace_link.py
          rm .github/workflows/phase19-trace-link-transfer.yml
          actual="$(git diff --name-only HEAD~2 | sort)"
          expected=$'docs/DEVELOPMENT_HANDOFF.md\ndocs/validation/phase-1-9-user-api-contract-candidate.md\nservices/core/src/simorgh_core/agents/live_provider_staging.py\nservices/core/src/simorgh_core/agents/live_provider_staging_contracts.py\nservices/core/src/simorgh_core/agents/live_provider_staging_trace.py\nservices/core/src/simorgh_core/app.py\nservices/core/tests/test_live_provider_staging_lifespan.py\nservices/core/tests/test_live_provider_staging_store.py\nservices/core/tests/test_live_provider_staging_trace.py'
          test "$actual" = "$expected"
          git diff --check

      - name: Publish validated product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "core: link staging results to terminal trace evidence"
          git push origin HEAD:core/live-provider-staging
