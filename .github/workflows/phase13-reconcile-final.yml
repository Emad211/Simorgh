name: Phase 1.3 audited reconciliation finalizer

on:
  push:
    branches:
      - core/specialist-execution-interface
    paths:
      - .github/workflows/phase13-reconcile-final.yml

concurrency:
  group: phase13-audited-reconciliation-finalizer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify and run audited reconciliation
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/phase13_reconcile.py.gz.b64
          echo "34531d58090371fa05a0a4f4a3c43f1c7595596ba5f0e23fe969fc03ca023b5c  scripts/phase13_reconcile.py.gz.b64" \
            | sha256sum --check --strict
          base64 --decode scripts/phase13_reconcile.py.gz.b64 | gunzip > "$RUNNER_TEMP/phase13_reconcile.py"
          echo "e93d4c22ea804cc408da10dadbe9dd8b4c3888b9619c4b3b07f5f8f5bdea87e2  $RUNNER_TEMP/phase13_reconcile.py" \
            | sha256sum --check --strict
          python "$RUNNER_TEMP/phase13_reconcile.py"

      - name: Remove all temporary publisher and audit material
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/phase13_reconcile.py.gz.b64
          rmdir scripts 2>/dev/null || true
          rm -f .github/workflows/phase13-publish.yml
          rm -f .github/workflows/phase13-audit-only.yml
          rm -f .github/workflows/phase13-reconcile-final.yml
          rm -f .phase13-concurrency-stop
          rm -rf .simorgh-patches/phase13

      - name: Enforce bounded product diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          allowed=$(cat <<'EOF'
          .github/workflows/phase13-audit-only.yml
          .github/workflows/phase13-publish.yml
          .github/workflows/phase13-reconcile-final.yml
          .phase13-concurrency-stop
          .simorgh-patches/phase13/part-00.b64
          .simorgh-patches/phase13/part-01.b64
          .simorgh-patches/phase13/part-02.b64
          docs/AGENT_RUNTIME.md
          docs/IMPLEMENTATION_MASTER_PLAN.md
          docs/README.md
          docs/SPECIALIST_EXECUTION.md
          docs/adr/0016-native-specialist-execution-authority.md
          scripts/phase13_reconcile.py.gz.b64
          services/core/src/simorgh_core/agents/budget.py
          services/core/src/simorgh_core/agents/specialist_execution.py
          services/core/src/simorgh_core/agents/specialist_runtime.py
          services/core/src/simorgh_core/agents/specialist_service.py
          services/core/src/simorgh_core/agents/tracing.py
          services/core/tests/test_specialist_execution_hardening.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "${changed[@]}") <(printf '%s\n' "$allowed" | sort))
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          test -f docs/adr/0016-native-specialist-execution-authority.md
          test -f services/core/tests/test_specialist_execution_hardening.py
          test ! -e .simorgh-patches/phase13
          test ! -e .phase13-concurrency-stop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run Core quality gates
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy services/core/src
          pytest

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Android quality gates
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :apps:android:assembleDebug \
            :apps:android:testDebugUnitTest \
            :apps:android:lintDebug \
            --stacktrace

      - name: Commit validated product state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Core: harden typed specialist execution authority'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/specialist-execution-interface
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
