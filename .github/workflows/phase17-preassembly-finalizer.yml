name: Phase 1.7 Pre-Assembly Finalizer v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase17-preassembly-finalizer.yml

permissions:
  contents: write

concurrency:
  group: phase17-preassembly-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Add pre-assembly authority fence and acceptance test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          compiler = Path(
              "services/core/src/simorgh_core/agents/context_compiler.py"
          )
          text = compiler.read_text(encoding="utf-8")
          old = (
              "        sections, omissions = self._admit_materials(\n"
              "            materials=materials,\n"
              "            freshness=authority.record.task.freshness,\n"
              "            now_ms=now_ms,\n"
              "        )\n"
              "        bundle = self._compact_and_build(\n"
          )
          new = (
              "        sections, omissions = self._admit_materials(\n"
              "            materials=materials,\n"
              "            freshness=authority.record.task.freshness,\n"
              "            now_ms=now_ms,\n"
              "        )\n"
              "        self._require_still_active(\n"
              "            request.request_id,\n"
              "            now_ms=self._now_ms(),\n"
              "        )\n"
              "        bundle = self._compact_and_build(\n"
          )
          if text.count(old) != 1:
              raise SystemExit(
                  f"pre-assembly authority anchor count={text.count(old)}, expected=1"
              )
          compiler.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("services/core/tests/test_context_compiler.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "test_cancellation_after_admission_never_enters_canonical_assembly"
          if marker in test_text:
              raise SystemExit("pre-assembly race test already exists")
          test_text = test_text.rstrip() + "\n\n" + dedent('''
          def test_cancellation_after_admission_never_enters_canonical_assembly(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              task = _task()
              service, _, _, invocations, contexts = _runtime(task=task)
              original_admit = service._admit_materials
              original_build = service._compact_and_build
              assembly_entered = False

              def admit_then_cancel(*args, **kwargs):
                  admitted = original_admit(*args, **kwargs)
                  invocations.accept_cancellation(_cancellation(task))
                  return admitted

              def track_assembly(*args, **kwargs):
                  nonlocal assembly_entered
                  assembly_entered = True
                  return original_build(*args, **kwargs)

              monkeypatch.setattr(service, "_admit_materials", admit_then_cancel)
              monkeypatch.setattr(service, "_compact_and_build", track_assembly)

              with pytest.raises(ContextCompilerCancelledError, match="won the race"):
                  service.compile(_request(task=task, invocation_id=uuid4()))

              assert not assembly_entered
              assert contexts.load() == []
          ''').lstrip()
          tests.write_text(test_text, encoding="utf-8")

          validation = Path(
              "docs/validation/phase-1-7-context-compiler-start.md"
          )
          validation_text = validation.read_text(encoding="utf-8")
          note = (
              "\n- Final race hardening rechecks cancellation/deadline authority "
              "after material admission and before canonical assembly; the focused "
              "test proves assembly and durable claim are never entered when the "
              "fence wins.\n"
          )
          if "Final race hardening rechecks" not in validation_text:
              validation.write_text(
                  validation_text.rstrip() + "\n" + note,
                  encoding="utf-8",
              )

          Path(
              ".github/workflows/phase17-preassembly-finalizer.yml"
          ).unlink()
          PY
          git diff --check

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix \
            services/core/src/simorgh_core/agents/context_compiler.py \
            services/core/tests/test_context_compiler.py
          ruff check .
          mypy services/core/src
          pytest
          git diff --check
          test ! -e .github/workflows/phase17-preassembly-finalizer.yml

      - name: Commit validated product hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: fence context authority before canonical assembly'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/context-compiler
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$HEAD_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $HEAD_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
