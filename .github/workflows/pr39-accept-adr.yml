name: PR39 Accept ADR 0015

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr39-accept-adr-0015
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify validated product ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ca193325b4efcad2bb48a1d942e8f5cd20e3a533 HEAD
          test -f services/core/src/simorgh_core/agents/store_lock.py
          test -f docs/INVOCATION_STORE_HARDENING.md
          test ! -e .simorgh-patches/pr39-rc3

      - name: Accept ADR exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/adr/0015-durable-invocation-identity-and-replay.md')
          text = path.read_text(encoding='utf-8')
          old = '- Status: Proposed\n'
          new = '- Status: Accepted\n'
          if text.count(old) != 1 or text.count(new) != 0:
              raise SystemExit(
                  f'ADR status anchor mismatch old={text.count(old)} accepted={text.count(new)}'
              )
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/pr39-accept-adr.yml
          git diff --check

      - name: Commit and push accepted ADR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: accept durable invocation identity ADR'
          git push origin HEAD:core/durable-agent-invocation-store

      - name: Report acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NEW_HEAD=$(git rev-parse HEAD)
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/5083518493" \
            -f body="<!-- pr39-rc3-status -->
          ADR 0015: **Accepted and pushed**

          - Product ancestry: \`ca193325b4efcad2bb48a1d942e8f5cd20e3a533\`
          - ADR head: \`${NEW_HEAD}\`
          - Next gate: owner-authored clean CI trigger and exact-head validation"
