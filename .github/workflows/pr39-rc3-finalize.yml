name: PR39 RC3 Corrected-Head Diagnostic

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-corrected-head-finalize
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct verified RC3 archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath

          root = Path('.simorgh-patches/pr39-rc3')
          names = [f'part-{i:02d}.b64' for i in range(9)]
          lengths = [8000] * 8 + [7748]
          if sorted(p.name for p in root.glob('part-*.b64')) != names:
              raise SystemExit('unexpected chunk set')
          encoded = ''.join((root / n).read_text(encoding='ascii') for n in names)
          if [len((root / n).read_bytes()) for n in names] != lengths:
              raise SystemExit('unexpected chunk length')
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != 53811 or hashlib.sha256(archive).hexdigest() != 'dde9c1eed40d319b1fde9e913b3510aa0fd4fa0e36b31436d58c8d231fa2f2a4':
              raise SystemExit('archive identity mismatch')
          target = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle'
          target.mkdir(parents=True, exist_ok=False)
          archive_path = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3.zip'
          archive_path.write_bytes(archive)
          with zipfile.ZipFile(archive_path) as zf:
              if zf.testzip() is not None:
                  raise SystemExit('corrupt archive')
              for info in zf.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit('unsafe archive member')
              zf.extractall(target)
          PY
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          chmod 0755 "$BUNDLE/apply_pr39_complete_hardening.sh" "$BUNDLE/scripts/apply_pr39_complete_hardening.sh"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Self-test
        id: selftest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python "$RUNNER_TEMP/pr39-rc3-bundle/scripts/selftest_pr39_hardening_bundle.py" 2>&1 | tee "$RUNNER_TEMP/selftest.log"

      - name: Exact-head dry-run
        id: dryrun
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" --dry-run --backup-dir "$RUNNER_TEMP/pr39-backups" 2>&1 | tee "$RUNNER_TEMP/dryrun.log"

      - name: Publish diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SELFTEST: ${{ steps.selftest.outcome }}
          DRYRUN: ${{ steps.dryrun.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          parts = [
              '<!-- pr39-rc3-status -->',
              'PR39 corrected-head RC3 diagnostic:', '',
              f"- Head: `{os.environ['GITHUB_SHA']}`",
              f"- Self-test: **{os.environ.get('SELFTEST', 'not-run')}**",
              f"- Dry-run: **{os.environ.get('DRYRUN', 'not-run')}**",
              f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ]
          for title, filename in [('Self-test tail','selftest.log'),('Dry-run tail','dryrun.log')]:
              path = temp / filename
              if path.exists():
                  parts += ['', f'### {title}', '```text', path.read_text(errors='replace')[-7000:], '```']
          (temp/'comment.json').write_text(json.dumps({'body':'\n'.join(parts)}), encoding='utf-8')
          PY
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" --input "$RUNNER_TEMP/comment.json"
