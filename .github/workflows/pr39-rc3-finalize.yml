name: PR39 RC3 Finalize

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository == 'Emad211/Simorgh'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: core/durable-agent-invocation-store
          fetch-depth: 0

      - name: Report finalizer start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/39/comments" \
            -f body="PR39 RC3 finalizer started on exact head ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify and extract staged RC3 bundle
        shell: bash
        run: |
          set -euo pipefail
          STAGED='.simorgh-patches/pr39-rc3/part-00.b64'
          EXPECTED_BLOB='6df3eaed301f4327e0604ae4090233c8625fa664'
          test -f "$STAGED"
          ACTUAL_BLOB=$(git hash-object "$STAGED")
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          mkdir -p "$RUNNER_TEMP/pr39-rc3"
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          source = Path('.simorgh-patches/pr39-rc3/part-00.b64')
          encoded = source.read_text(encoding='ascii').strip()
          archive = base64.b64decode(encoded, validate=True)
          target = Path.home() / 'pr39-rc3-bundle.zip'
          target.write_bytes(archive)
          print(f'archive_bytes={len(archive)}')
          print(f'archive_sha256={hashlib.sha256(archive).hexdigest()}')
          PY
          unzip -t "$HOME/pr39-rc3-bundle.zip"
          unzip -q "$HOME/pr39-rc3-bundle.zip" -d "$RUNNER_TEMP/pr39-rc3/bundle"
          test "$(cat "$RUNNER_TEMP/pr39-rc3/bundle/VERSION")" = '2026.07.26-pr39-step1.2-hardening-rc3'

      - name: Install Core and development tools
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run bundle self-test and exact-head precheck
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3/bundle"
          python "$BUNDLE/scripts/selftest_pr39_hardening_bundle.py"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --dry-run \
            --backup-dir "$RUNNER_TEMP/pr39-backups"

      - name: Apply RC3 transactionally with targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3/bundle"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --backup-dir "$RUNNER_TEMP/pr39-backups" \
            --run-targeted-tests

      - name: Remove transient publisher inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .simorgh-patches/pr39-rc3
          rmdir .simorgh-patches 2>/dev/null || true
          rm -f .github/workflows/pr39-rc3-finalize.yml
          git diff --check
          test ! -e .simorgh-patches/pr39-rc3
          test ! -e .github/workflows/pr39-rc3-finalize.yml

      - name: Core lint
        run: ruff check .

      - name: Core strict type check
        run: mypy services/core/src

      - name: Full Core test suite
        run: pytest

      - name: Install stable Android platform
        run: sdkmanager 'platforms;android-36'

      - name: Android build, JVM tests, lint, and APK
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :apps:android:assembleDebug \
            :apps:android:testDebugUnitTest \
            :apps:android:lintDebug \
            --stacktrace

      - name: Commit only validated product changes
        shell: bash
        env:
          BRANCH: core/durable-agent-invocation-store
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'RC3 produced no product changes' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '^(\.simorgh-patches/|\.github/workflows/pr39-rc3-finalize\.yml$)'; then
            echo 'transient publisher input remained staged' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'core: harden durable invocation replay and recovery'
          git push origin "HEAD:$BRANCH"

      - name: Report finalizer success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/39/comments" \
            -f body="PR39 RC3 finalizer passed all targeted, Core, and Android gates and pushed the validated product commit. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report finalizer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/39/comments" \
            -f body="PR39 RC3 finalizer failed closed; no product commit was claimed. Inspect run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
