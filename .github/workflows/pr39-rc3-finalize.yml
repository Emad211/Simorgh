name: PR39 RC3 Dry-Run Diagnostic

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-finalize
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and verify exact RC3 archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          root = Path('.simorgh-patches/pr39-rc3')
          parts = sorted(root.glob('part-*.b64'))
          expected_names = [f'part-{index:02d}.b64' for index in range(9)]
          if [path.name for path in parts] != expected_names:
              raise SystemExit('unexpected RC3 chunk set')
          encoded = ''.join(path.read_text(encoding='ascii') for path in parts)
          if len(encoded) != 71748:
              raise SystemExit(f'expected 71748 Base64 characters, found {len(encoded)}')
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != 53811:
              raise SystemExit(f'expected 53811 archive bytes, found {len(archive)}')
          archive_hash = hashlib.sha256(archive).hexdigest()
          expected_hash = 'dde9c1eed40d319b1fde9e913b3510aa0fd4fa0e36b31436d58c8d231fa2f2a4'
          if archive_hash != expected_hash:
              raise SystemExit('RC3 archive SHA-256 mismatch')

          bundle_root = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle'
          bundle_root.mkdir(parents=True, exist_ok=False)
          archive_path = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle.zip'
          archive_path.write_bytes(archive)
          with zipfile.ZipFile(archive_path) as bundle:
              bad = bundle.testzip()
              if bad is not None:
                  raise SystemExit(f'corrupt ZIP member: {bad}')
              for info in bundle.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe ZIP path: {info.filename}')
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f'ZIP symlink is not allowed: {info.filename}')
              bundle.extractall(bundle_root)
          version = (bundle_root / 'VERSION').read_text(encoding='utf-8').strip()
          if version != '2026.07.26-pr39-step1.2-hardening-rc3':
              raise SystemExit('RC3 VERSION mismatch')
          print(f'archive_sha256={archive_hash}')
          PY

      - name: Install Core development dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run bundle self-test
        id: selftest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          python "$BUNDLE/scripts/selftest_pr39_hardening_bundle.py" \
            2>&1 | tee "$RUNNER_TEMP/pr39-selftest.log"

      - name: Run exact-head dry-run
        id: dryrun
        if: steps.selftest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --dry-run \
            --backup-dir "$RUNNER_TEMP/pr39-backups" \
            2>&1 | tee "$RUNNER_TEMP/pr39-dryrun.log"

      - name: Report diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SELFTEST_OUTCOME: ${{ steps.selftest.outcome }}
          DRYRUN_OUTCOME: ${{ steps.dryrun.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          temp = Path(os.environ['RUNNER_TEMP'])
          lines = [
              f"head={os.environ['GITHUB_SHA']}",
              f"selftest={os.environ.get('SELFTEST_OUTCOME', 'not-run')}",
              f"dryrun={os.environ.get('DRYRUN_OUTCOME', 'not-run')}",
          ]
          for label, name in (
              ('selftest_log', 'pr39-selftest.log'),
              ('dryrun_log', 'pr39-dryrun.log'),
          ):
              path = temp / name
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              text = text[-8000:]
              lines.extend([f'--- {label} ---', text])
          report = '\n'.join(lines)
          Path(temp / 'pr39-report.txt').write_text(report, encoding='utf-8')
          PY
          REPORT=$(cat "$RUNNER_TEMP/pr39-report.txt")
          gh api "repos/${GITHUB_REPOSITORY}/issues/39/comments" \
            -f body="PR39 RC3 dry-run diagnostic. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\n\`\`\`text\n${REPORT}\n\`\`\`"

      - name: Enforce diagnostic success
        if: always()
        env:
          SELFTEST_OUTCOME: ${{ steps.selftest.outcome }}
          DRYRUN_OUTCOME: ${{ steps.dryrun.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SELFTEST_OUTCOME" = success
          test "$DRYRUN_OUTCOME" = success
