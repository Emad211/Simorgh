name: PR39 RC3 Finalize

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-finalize
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'
  PR_BRANCH: core/durable-agent-invocation-store

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Report exact-head start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **running**

          - Exact triggering head: \`${GITHUB_SHA}\`
          - Current gate: checkout complete
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and verify exact RC3 archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          root = Path('.simorgh-patches/pr39-rc3')
          expected = {
              'part-00.b64': ('4de18cf2095ded03fe926d73557be3bbf55884c1be903d8ad412dcf194843388', 8000),
              'part-01.b64': ('f649d630df3f725243eb133095fa6c445dbac4f20c941bc36bb3d7c2a73131ad', 8000),
              'part-02.b64': ('a752ecb7f049d38d7c6c335d66c4b4763539c88c9cdbd7417b6f3ae02ae350af', 8000),
              'part-03.b64': ('0131f2000b0005996425e1fc3be07e47a82271b4bfd16f90ace6240c9095efdd', 8000),
              'part-04.b64': ('5f1d0795d2ea2063bd4a4d9cccf4696a9c19ae674d0f5335f84e67d11f35cfe6', 8000),
              'part-05.b64': ('ef9e4c59f4cb15249f83dd1b5497a2253c222748ee94382564582c52a2861e90', 8000),
              'part-06.b64': ('600b1a67096c9a25489386640af34beb1e28217e4bd52cae2d4babe679694457', 8000),
              'part-07.b64': ('12ba6fa743ca9627a0bc14bce1941ff79c28ed376de2c367d7663c6a2dd06219', 8000),
              'part-08.b64': ('c573188280ccf7d18a2229624e18a72163c84edae58c6b70de9868454e0d377f', 7748),
          }
          actual = sorted(path.name for path in root.glob('part-*.b64'))
          if actual != sorted(expected):
              raise SystemExit(f'unexpected RC3 chunk set: {actual!r}')

          encoded_parts: list[str] = []
          for name in sorted(expected):
              expected_hash, expected_bytes = expected[name]
              raw = (root / name).read_bytes()
              if len(raw) != expected_bytes:
                  raise SystemExit(f'{name}: expected {expected_bytes} bytes, found {len(raw)}')
              if hashlib.sha256(raw).hexdigest() != expected_hash:
                  raise SystemExit(f'{name}: SHA-256 mismatch')
              encoded_parts.append(raw.decode('ascii'))

          encoded = ''.join(encoded_parts)
          if len(encoded) != 71748:
              raise SystemExit(f'expected 71748 Base64 characters, found {len(encoded)}')
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != 53811:
              raise SystemExit(f'expected 53811 archive bytes, found {len(archive)}')
          archive_hash = hashlib.sha256(archive).hexdigest()
          expected_archive_hash = 'dde9c1eed40d319b1fde9e913b3510aa0fd4fa0e36b31436d58c8d231fa2f2a4'
          if archive_hash != expected_archive_hash:
              raise SystemExit('RC3 archive SHA-256 mismatch')

          bundle_root = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle'
          archive_path = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle.zip'
          archive_path.write_bytes(archive)
          bundle_root.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(archive_path) as bundle:
              bad = bundle.testzip()
              if bad is not None:
                  raise SystemExit(f'corrupt ZIP member: {bad}')
              for info in bundle.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe ZIP path: {info.filename}')
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f'ZIP symlink is not allowed: {info.filename}')
              bundle.extractall(bundle_root)

          version = (bundle_root / 'VERSION').read_text(encoding='utf-8').strip()
          if version != '2026.07.26-pr39-step1.2-hardening-rc3':
              raise SystemExit(f'RC3 VERSION mismatch: {version!r}')
          print(f'RC3 archive verified: {archive_hash}, {len(archive)} bytes')
          PY

      - name: Report archive integrity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **running**

          - Exact triggering head: \`${GITHUB_SHA}\`
          - Archive: verified \`dde9c1eed40d319b1fde9e913b3510aa0fd4fa0e36b31436d58c8d231fa2f2a4\`
          - Current gate: install and exact-head preflight
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Install Core development dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run self-test and exact-head dry-run
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          python "$BUNDLE/scripts/selftest_pr39_hardening_bundle.py"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --dry-run \
            --backup-dir "$RUNNER_TEMP/pr39-backups"

      - name: Report preflight success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **running**

          - Exact triggering head: \`${GITHUB_SHA}\`
          - Archive integrity: passed
          - Bundle self-test: passed
          - Exact-head dry-run: passed
          - Current gate: transactional apply and targeted regressions
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Apply RC3 transactionally with targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --backup-dir "$RUNNER_TEMP/pr39-backups" \
            --run-targeted-tests

      - name: Remove transient publisher inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .simorgh-patches/pr39-rc3
          rmdir .simorgh-patches 2>/dev/null || true
          rm -f .github/workflows/pr39-rc3-finalize.yml
          git diff --check

      - name: Report apply success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **running**

          - Exact triggering head: \`${GITHUB_SHA}\`
          - Transactional apply: passed
          - Targeted RC3 regressions: passed
          - Transient bundle/workflow cleanup: passed
          - Current gate: Ruff, strict MyPy, and full Core tests
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Core lint
        run: ruff check .

      - name: Core strict type check
        run: mypy services/core/src

      - name: Full Core test suite
        run: pytest

      - name: Report Core success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **running**

          - Exact triggering head: \`${GITHUB_SHA}\`
          - RC3 regressions: passed
          - Ruff: passed
          - Strict MyPy: passed
          - Full Core suite: passed
          - Current gate: Android build, JVM tests, lint, and APK
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Android build, JVM tests, lint, and APK
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :apps:android:assembleDebug \
            :apps:android:testDebugUnitTest \
            :apps:android:lintDebug \
            --stacktrace

      - name: Report Android success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **running**

          - Exact triggering head: \`${GITHUB_SHA}\`
          - Core quality gates: passed
          - Android build/JVM/lint/APK: passed
          - Current gate: commit and protected fast-forward push
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Commit and push only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'RC3 produced no product changes' >&2
            exit 1
          fi
          BAD_TRANSIENT=$(git diff --cached --name-status | awk '
            ($2 ~ /^\.simorgh-patches\// || $2 == ".github/workflows/pr39-rc3-finalize.yml") && $1 != "D" {print}
          ')
          if [ -n "$BAD_TRANSIENT" ]; then
            echo 'transient publisher input was not staged only as deletion:' >&2
            echo "$BAD_TRANSIENT" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'core: harden durable invocation replay and recovery'
          git push origin "HEAD:${PR_BRANCH}"

      - name: Report finalizer success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NEW_HEAD=$(git rev-parse HEAD)
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **validated product commit pushed**

          - Triggering head: \`${GITHUB_SHA}\`
          - Product head: \`${NEW_HEAD}\`
          - Archive integrity: passed
          - Targeted RC3 regressions: passed
          - Ruff / strict MyPy / full Core: passed
          - Android build / JVM / lint / APK: passed
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report finalizer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **failed closed**

          - Exact triggering head: \`${GITHUB_SHA}\`
          - No validated product commit was claimed by this run.
          - Inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
