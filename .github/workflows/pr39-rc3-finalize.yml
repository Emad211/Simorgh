name: PR39 RC3 AST-Normalized Finalize

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-product-finalize
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'
  PR_BRANCH: core/durable-agent-invocation-store

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 AST-normalized finalizer: **running**

          - Exact head: \`${GITHUB_SHA}\`
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and verify RC3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path('.simorgh-patches/pr39-rc3')
          names = [f'part-{i:02d}.b64' for i in range(9)]
          lengths = [8000] * 8 + [7748]
          if sorted(p.name for p in root.glob('part-*.b64')) != names:
              raise SystemExit('unexpected chunk set')
          pieces = []
          for name, length in zip(names, lengths, strict=True):
              raw = (root / name).read_bytes()
              if len(raw) != length:
                  raise SystemExit(f'{name}: invalid length')
              pieces.append(raw.decode('ascii'))
          archive = base64.b64decode(''.join(pieces), validate=True)
          expected = 'dde9c1eed40d319b1fde9e913b3510aa0fd4fa0e36b31436d58c8d231fa2f2a4'
          if len(archive) != 53811 or hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit('archive identity mismatch')
          bundle = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle'
          bundle.mkdir(parents=True, exist_ok=False)
          archive_path = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3.zip'
          archive_path.write_bytes(archive)
          with zipfile.ZipFile(archive_path) as zf:
              if zf.testzip() is not None:
                  raise SystemExit('corrupt archive')
              for info in zf.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit('unsafe archive member')
              zf.extractall(bundle)
          if (bundle / 'VERSION').read_text(encoding='utf-8').strip() != '2026.07.26-pr39-step1.2-hardening-rc3':
              raise SystemExit('version mismatch')
          PY
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          chmod 0755 "$BUNDLE/apply_pr39_complete_hardening.sh" "$BUNDLE/scripts/apply_pr39_complete_hardening.sh"

      - name: Install Core dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Self-test and exact Publisher compatibility
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          python "$BUNDLE/scripts/selftest_pr39_hardening_bundle.py"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle/scripts/apply_pr39_hardening.py'
          text = path.read_text(encoding='utf-8')
          pairs = [
              (
                  'from typing import Any, Protocol, Self\\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\\n\nfrom simorgh_core.agents.contracts import UsageVector\\n',
                  'from typing import Any, Protocol, Self\\nfrom uuid import NAMESPACE_URL, UUID, uuid5\\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\\n\nfrom simorgh_core.agents.contracts import UsageVector\\n',
              ),
              (
                  'from typing import Any, Literal, Protocol, Self, TypeAlias\\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\\n\nfrom simorgh_core.agents.contracts import InvocationState, UsageVector\\n',
                  'from typing import Any, Literal, Protocol, Self, TypeAlias\\nfrom uuid import NAMESPACE_URL, UUID, uuid5\\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\\n\nfrom simorgh_core.agents.contracts import InvocationState, UsageVector\\n',
              ),
          ]
          for old, new in pairs:
              if text.count(old) != 1 or text.count(new) != 0:
                  raise SystemExit('Publisher compatibility anchor mismatch')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Dry-run and apply RC3 transactionally
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --dry-run --backup-dir "$RUNNER_TEMP/pr39-backups"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --backup-dir "$RUNNER_TEMP/pr39-backups" --run-targeted-tests

      - name: AST-normalize exact Ruff findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          invocations = Path('services/core/src/simorgh_core/agents/invocations.py')
          text = invocations.read_text(encoding='utf-8')
          old_import = 'from typing import Any, Literal, Protocol, Self, TypeAlias\n'
          old_alias = 'InvocationPhase: TypeAlias = InvocationState\n'
          if text.count(old_import) != 1 or text.count(old_alias) != 1:
              raise SystemExit('unexpected post-RC3 alias state')
          invocations.write_text(
              text.replace(old_import, 'from typing import Any, Literal, Protocol, Self\n', 1)
                  .replace(old_alias, 'type InvocationPhase = InvocationState\n', 1),
              encoding='utf-8',
          )

          def handler_names(node: ast.expr | None) -> set[str]:
              if isinstance(node, ast.Name):
                  return {node.id}
              if isinstance(node, ast.Tuple):
                  return {item.id for item in node.elts if isinstance(item, ast.Name)}
              return set()

          def statement_text(lines: list[str], statement: ast.stmt, indent: str) -> str:
              segment = lines[statement.lineno - 1 : statement.end_lineno]
              dedented = []
              for line in segment:
                  if line.strip():
                      dedented.append(line[statement.col_offset:])
                  else:
                      dedented.append(line)
              return ''.join(indent + line for line in dedented)

          for filename, gateway_error in (
              ('services/core/src/simorgh_core/agents/model_gateway.py', 'ModelGatewayError'),
              ('services/core/src/simorgh_core/agents/tool_gateway.py', 'ToolGatewayError'),
          ):
              path = Path(filename)
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              lines = source.splitlines(keepends=True)
              edits: list[tuple[int, int, str]] = []
              release_count = 0
              cancel_count = 0
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Try) or len(node.body) != 1 or len(node.handlers) != 1:
                      continue
                  statement = node.body[0]
                  if not isinstance(statement, ast.Expr) or not isinstance(statement.value, ast.Call):
                      continue
                  call = statement.value
                  handler = node.handlers[0]
                  if handler.body != [handler.body[0]] or not isinstance(handler.body[0], ast.Pass):
                      continue
                  indent = ' ' * node.col_offset
                  body_indent = indent + '    '
                  func = call.func
                  if (
                      isinstance(func, ast.Attribute)
                      and isinstance(func.value, ast.Name)
                      and func.value.id == 'budget'
                      and func.attr == 'release'
                      and handler_names(handler.type) == {
                          'BudgetCancelledError',
                          'BudgetReservationNotFoundError',
                      }
                  ):
                      replacement = (
                          indent + 'with suppress(\n'
                          + body_indent + 'BudgetCancelledError,\n'
                          + body_indent + 'BudgetReservationNotFoundError,\n'
                          + indent + '):\n'
                          + statement_text(lines, statement, body_indent)
                      )
                      edits.append((node.lineno - 1, node.end_lineno, replacement))
                      release_count += 1
                  elif (
                      isinstance(func, ast.Attribute)
                      and isinstance(func.value, ast.Name)
                      and func.value.id == 'self'
                      and func.attr == '_mark_unknown_and_settle'
                      and handler_names(handler.type) == {gateway_error}
                  ):
                      replacement = (
                          indent + f'with suppress({gateway_error}):\n'
                          + statement_text(lines, statement, body_indent)
                      )
                      edits.append((node.lineno - 1, node.end_lineno, replacement))
                      cancel_count += 1
              if (release_count, cancel_count) != (1, 1):
                  raise SystemExit(
                      f'{filename}: expected one release and one cancellation Try, '
                      f'found {(release_count, cancel_count)}'
                  )
              for start, end, replacement in sorted(edits, reverse=True):
                  lines[start:end] = [replacement]
              updated = ''.join(lines)
              if updated.count('from contextlib import suppress\n') == 0:
                  if updated.count('import asyncio\n') != 1:
                      raise SystemExit(f'{filename}: asyncio import anchor mismatch')
                  updated = updated.replace(
                      'import asyncio\n',
                      'import asyncio\nfrom contextlib import suppress\n',
                      1,
                  )
              path.write_text(updated, encoding='utf-8')

          test_path = Path('services/core/tests/test_gateway_failure_semantics_rc3.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_default = '        committed_usage: UsageVector = UsageVector(),\n'
          if test_text.count(old_default) != 1:
              raise SystemExit('B008 default anchor mismatch')
          test_path.write_text(
              test_text.replace(
                  old_default,
                  '        committed_usage: UsageVector | None = None,\n',
                  1,
              ),
              encoding='utf-8',
          )
          PY
          ruff check --fix --select I \
            services/core/src/simorgh_core/agents/model_gateway.py \
            services/core/src/simorgh_core/agents/tool_gateway.py

      - name: Remove transient Publisher inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .simorgh-patches/pr39-rc3
          rmdir .simorgh-patches 2>/dev/null || true
          rm -f \
            .github/workflows/pr39-rc3-finalize.yml \
            .github/workflows/pr39-rc3-finalize-permission-safe.yml \
            .github/workflows/pr39-rc3-ruff-diagnostic.yml
          git diff --check

      - name: Core Ruff
        run: ruff check .

      - name: Core strict MyPy
        run: mypy services/core/src

      - name: Full Core tests
        run: pytest

      - name: Report Core success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 AST-normalized finalizer: **running**

          - RC3 / targeted regressions / Ruff / strict MyPy / full Core: passed
          - Current gate: Android build, JVM tests, lint, and APK
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Android build, JVM tests, lint, and APK
        run: gradle :apps:android:assembleDebug :apps:android:testDebugUnitTest :apps:android:lintDebug --stacktrace

      - name: Commit and push validated product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          BAD=$(git diff --cached --name-status | awk '($2 ~ /^\.simorgh-patches\// || $2 ~ /^\.github\/workflows\/pr39-rc3-/) && $1 != "D" {print}')
          if [ -n "$BAD" ]; then echo "$BAD"; exit 1; fi
          git commit -m 'core: harden durable invocation replay and recovery'
          git push origin "HEAD:${PR_BRANCH}"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_HEAD=$(git rev-parse HEAD)
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 finalizer: **validated product commit pushed**

          - Triggering head: \`${GITHUB_SHA}\`
          - Product head: \`${NEW_HEAD}\`
          - RC3 / Core / Android gates: passed
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            -f body="<!-- pr39-rc3-status -->
          PR39 RC3 AST-normalized finalizer: **failed closed**

          - Exact triggering head: \`${GITHUB_SHA}\`
          - No validated product commit was claimed.
          - Inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
