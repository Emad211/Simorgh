name: PR47 Linkage Hotfix Finalizer v3

on:
  push:
    branches:
      - core/typed-results-artifacts
    paths:
      - .github/workflows/pr47-linkage-hotfix-final.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr47-linkage-hotfix-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Report exact-head start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/47/comments" \
            -f body="PR #47 invocation-linkage finalizer started on exact head \`${GITHUB_SHA}\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No product commit is claimed until all Core gates and the protected push pass."

      - name: Execute audited reconciliation with exact terminalizer anchor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              '.github/workflows/pr47-linkage-reconciliation.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1:
              raise SystemExit('reconciliation Python start marker is not unique')
          remainder = source.split(start_marker, 1)[1]
          if remainder.count(end_marker) != 1:
              raise SystemExit('reconciliation Python end marker is not unique')
          embedded = dedent(remainder.split(end_marker, 1)[0])

          old = (
              "              '            committed_usage=invocation.committed_usage,\\n'\n"
              "              '            invocation_result_sha256=canonical_fingerprint(\\n'\n"
              "              '                durable_result_payload\\n'\n"
              "              '            ),\\n',\n"
          )
          new = (
              "              '            committed_usage=invocation.committed_usage,\\n'\n"
              "              '            invocation_result_sha256=canonical_fingerprint(durable_result_payload),\\n',\n"
          )
          if embedded.count(old) != 1:
              raise SystemExit(
                  f'terminalizer source-anchor count={embedded.count(old)}, expected=1'
              )
          embedded = embedded.replace(old, new, 1)
          exec(
              compile(embedded, 'pr47-linkage-reconciliation-hotfixed.py', 'exec'),
              {'__name__': '__main__'},
          )
          PY
          rm -f .github/workflows/pr47-linkage-reconciliation.yml
          rm -f .github/workflows/pr47-linkage-single-final.yml
          rm -f .github/workflows/pr47-linkage-diagnostic.yml
          rm -f .github/workflows/pr47-linkage-pr-diagnostic.yml
          rm -f .github/workflows/pr47-linkage-hotfix-final.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run complete reconciled authority gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest

      - name: Commit validated nonduplicating authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: bind result control plane to invocation hash authority'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/typed-results-artifacts
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Report finalizer outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status='${{ job.status }}'
          gh api "repos/${GITHUB_REPOSITORY}/issues/47/comments" \
            -f body="PR #47 invocation-linkage finalizer finished with status **${status}** for trigger head \`${GITHUB_SHA}\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. A product commit exists only if the protected push step succeeded."
