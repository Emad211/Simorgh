name: Phase 1.7 Context Test Identity Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase17-test-identity-finalizer.yml

permissions:
  contents: write

concurrency:
  group: phase17-context-test-identity-finalizer
  cancel-in-progress: false

jobs:
  validate-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic test authority fix
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase17_fix_test_authority_identity.py
          rm -f .github/scripts/phase17_fix_test_authority_identity.py
          rm -f .github/workflows/phase17-test-identity-finalizer.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate complete Core suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix services/core/tests/test_context_compiler.py
          ruff check .
          mypy services/core/src
          pytest -q

      - name: Publish exact tested fixture correction
        shell: bash
        env:
          BRANCH: core/context-compiler
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'tests: stabilize durable routing authority fixture'
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
