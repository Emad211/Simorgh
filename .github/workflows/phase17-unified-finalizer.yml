name: Phase 1.7 Unified Context Finalizer

on:
  push:
    branches:
      - core/context-compiler
    paths:
      - .github/workflows/phase17-unified-finalizer.yml

permissions:
  contents: write

concurrency:
  group: phase17-unified-context-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply acceptance boundary and audited hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str, *, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: anchor count={count}, expected=1")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, content: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if marker in text:
                  raise SystemExit(f"append marker already exists: {marker}")
              file.write_text(text.rstrip() + "\n\n" + dedent(content).lstrip(), encoding="utf-8")

          # First apply the reviewed issue-55 acceptance patch, including the
          # schema-only repository-report authority and routed github.read fixture.
          acceptance = Path(".github/workflows/phase17-acceptance-finalizer.yml")
          source = acceptance.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1:
              raise SystemExit("acceptance Python start marker is not unique")
          remainder = source.split(start_marker, 1)[1]
          if remainder.count(end_marker) != 1:
              raise SystemExit("acceptance Python end marker is not unique")
          embedded = dedent(remainder.split(end_marker, 1)[0])
          exec(
              compile(embedded, "phase17-acceptance-embedded.py", "exec"),
              {"__name__": "__main__"},
          )

          contracts = "services/core/src/simorgh_core/agents/context_contracts.py"
          replace_once(
              contracts,
              "import hashlib\n",
              "import hashlib\nimport re\n",
              label="context secret-regex import",
          )
          replace_once(
              contracts,
              '_SCHEMA_VERSION_PATTERN = r"^[0-9]+\\.[0-9]+$"\n',
              '_SCHEMA_VERSION_PATTERN = r"^[0-9]+\\.[0-9]+$"\n'
              '_SECRET_PATTERNS: tuple[re.Pattern[str], ...] = (\n'
              '    re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),\n'
              '    re.compile(r"\\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\\b"),\n'
              '    re.compile(r"\\bgithub_pat_[A-Za-z0-9_]{20,}\\b"),\n'
              '    re.compile(r"(?im)^\\s*authorization\\s*:\\s*(?:bearer|basic)\\s+\\S{12,}\\s*$"),\n'
              '    re.compile(\n'
              '        r"(?i)\\b(?:api[_-]?key|access[_-]?token|refresh[_-]?token|"\n'
              '        r"client[_-]?secret|password)\\b\\s*[:=]\\s*[\\\"\\\']?"\n'
              '        r"[A-Za-z0-9_./+=-]{16,}"\n'
              '    ),\n'
              ')\n',
              label="high-confidence secret patterns",
          )
          replace_once(
              contracts,
              '    EVIDENCE_LIMIT = "evidence_limit"\n    TEXT_LIMIT = "text_limit"\n',
              '    EVIDENCE_LIMIT = "evidence_limit"\n'
              '    PROJECT_LIMIT = "project_limit"\n'
              '    DECISION_LIMIT = "decision_limit"\n'
              '    TEXT_LIMIT = "text_limit"\n',
              label="project and decision omission reasons",
          )
          replace_once(
              contracts,
              '    max_evidence_items: int = Field(default=24, ge=0, le=MAX_CONTEXT_SECTIONS)\n'
              '    max_text_characters: int = Field(default=24_000, ge=1, le=250_000)\n',
              '    max_evidence_items: int = Field(default=24, ge=0, le=MAX_CONTEXT_SECTIONS)\n'
              '    max_project_items: int = Field(default=8, ge=0, le=MAX_CONTEXT_SECTIONS)\n'
              '    max_decision_items: int = Field(default=16, ge=0, le=MAX_CONTEXT_SECTIONS)\n'
              '    max_text_characters: int = Field(default=24_000, ge=1, le=250_000)\n',
              label="project and decision limits",
          )
          replace_once(
              contracts,
              '        if self.evidence_count != expected_evidence:\n'
              '            raise ValueError("context bundle evidence count is invalid")\n'
              '        if self.tool_count != len(self.tool_schemas):\n',
              '        if self.evidence_count != expected_evidence:\n'
              '            raise ValueError("context bundle evidence count is invalid")\n'
              '        project_count = sum(\n'
              '            section.source_kind == ContextSourceKind.PROJECT_GOAL\n'
              '            for section in self.sections\n'
              '        )\n'
              '        if project_count > self.limits.max_project_items:\n'
              '            raise ValueError("context bundle exceeds project item limit")\n'
              '        decision_count = sum(\n'
              '            section.source_kind == ContextSourceKind.DECISION\n'
              '            for section in self.sections\n'
              '        )\n'
              '        if decision_count > self.limits.max_decision_items:\n'
              '            raise ValueError("context bundle exceeds decision item limit")\n'
              '        if self.tool_count != len(self.tool_schemas):\n',
              label="bundle item-limit verification",
          )
          replace_once(
              contracts,
              '    capabilities = payload.get("capabilities")\n'
              '    if isinstance(capabilities, dict):\n'
              '        for key in ("tool_ids", "connector_ids", "model_tiers"):\n'
              '            values = capabilities.get(key)\n'
              '            if isinstance(values, list):\n'
              '                capabilities[key] = sorted(values)\n',
              '    capabilities = payload.get("capabilities")\n'
              '    if isinstance(capabilities, dict):\n'
              '        for key in ("tool_ids", "connector_ids", "model_tiers"):\n'
              '            values = capabilities.get(key)\n'
              '            if isinstance(values, list):\n'
              '                capabilities[key] = sorted(values)\n'
              '    tool_schemas = payload.get("tool_schemas")\n'
              '    if isinstance(tool_schemas, list):\n'
              '        payload["tool_schemas"] = sorted(\n'
              '            tool_schemas,\n'
              '            key=lambda item: (\n'
              '                str(item.get("tool_id", "")),\n'
              '                str(item.get("connector_id") or ""),\n'
              '            ),\n'
              '        )\n',
              label="canonical tool-schema payload ordering",
          )
          replace_once(
              contracts,
              'def _require_safe_text(value: str) -> None:\n'
              '    for character in value:\n'
              '        if ord(character) < 32 and character not in {"\\n", "\\r", "\\t"}:\n'
              '            raise ValueError("context text contains a disallowed control character")\n',
              'def _require_safe_text(value: str) -> None:\n'
              '    for character in value:\n'
              '        if ord(character) < 32 and character not in {"\\n", "\\r", "\\t"}:\n'
              '            raise ValueError("context text contains a disallowed control character")\n'
              '    if any(pattern.search(value) is not None for pattern in _SECRET_PATTERNS):\n'
              '        raise ValueError("context text contains secret-like credential material")\n',
              label="secret-like context rejection",
          )
          contracts_path = Path(contracts)
          contracts_text = contracts_path.read_text(encoding="utf-8")
          citation_anchor = (
              '        if not normalized or "\\n" in normalized or "\\r" in normalized:\n'
              '            raise ValueError("context citation must be one bounded non-empty line")\n'
              '        return normalized\n'
          )
          if contracts_text.count(citation_anchor) != 2:
              raise SystemExit("citation safety anchor count mismatch")
          contracts_path.write_text(
              contracts_text.replace(
                  citation_anchor,
                  '        if not normalized or "\\n" in normalized or "\\r" in normalized:\n'
                  '            raise ValueError("context citation must be one bounded non-empty line")\n'
                  '        _require_safe_text(normalized)\n'
                  '        return normalized\n',
              ),
              encoding="utf-8",
          )

          compiler = "services/core/src/simorgh_core/agents/context_compiler.py"
          replace_once(
              compiler,
              '        evidence_count = 0\n'
              '        ordered = sorted(materials, key=_material_sort_key)\n',
              '        evidence_count = 0\n'
              '        project_count = 0\n'
              '        decision_count = 0\n'
              '        ordered = sorted(materials, key=_material_sort_key)\n',
              label="context material counters",
          )
          replace_once(
              compiler,
              '            if material.source_kind == ContextSourceKind.EVIDENCE:\n'
              '                if evidence_count >= self._policy.limits.max_evidence_items:\n',
              '            if material.source_kind == ContextSourceKind.PROJECT_GOAL:\n'
              '                if project_count >= self._policy.limits.max_project_items:\n'
              '                    if material.required:\n'
              '                        raise ContextCompilerLimitError(\n'
              '                            "required project context exceeds project item limit"\n'
              '                        )\n'
              '                    _append_report_once(\n'
              '                        omissions,\n'
              '                        _omission(material, ContextOmissionReason.PROJECT_LIMIT),\n'
              '                    )\n'
              '                    continue\n'
              '                project_count += 1\n'
              '            elif material.source_kind == ContextSourceKind.DECISION:\n'
              '                if decision_count >= self._policy.limits.max_decision_items:\n'
              '                    if material.required:\n'
              '                        raise ContextCompilerLimitError(\n'
              '                            "required decision context exceeds decision item limit"\n'
              '                        )\n'
              '                    _append_report_once(\n'
              '                        omissions,\n'
              '                        _omission(material, ContextOmissionReason.DECISION_LIMIT),\n'
              '                    )\n'
              '                    continue\n'
              '                decision_count += 1\n'
              '            elif material.source_kind == ContextSourceKind.EVIDENCE:\n'
              '                if evidence_count >= self._policy.limits.max_evidence_items:\n',
              label="project and decision admission limits",
          )
          replace_once(
              compiler,
              '    source_manifest = context_source_manifest_sha256(sections, omissions)\n'
              '    payload: dict[str, object] = {\n',
              '    source_manifest = context_source_manifest_sha256(sections, omissions)\n'
              '    canonical_tool_schemas = tuple(\n'
              '        sorted(\n'
              '            request.tool_schemas,\n'
              '            key=lambda item: (item.tool_id, item.connector_id or ""),\n'
              '        )\n'
              '    )\n'
              '    payload: dict[str, object] = {\n',
              label="canonical tool-schema tuple",
          )
          replace_once(
              compiler,
              '        "tool_schemas": [item.model_dump(mode="json") for item in request.tool_schemas],\n',
              '        "tool_schemas": [\n'
              '            item.model_dump(mode="json") for item in canonical_tool_schemas\n'
              '        ],\n',
              label="canonical hash tool schemas",
          )
          replace_once(
              compiler,
              '        tool_schemas=tuple(sorted(request.tool_schemas, key=lambda item: item.tool_id)),\n',
              '        tool_schemas=canonical_tool_schemas,\n',
              label="canonical bundle tool schemas",
          )
          replace_once(
              compiler,
              '        tool_count=len(request.tool_schemas),\n',
              '        tool_count=len(canonical_tool_schemas),\n',
              label="canonical tool count",
          )

          tests = "services/core/tests/test_context_compiler.py"
          replace_once(
              tests,
              'def _capabilities() -> SpecialistCapabilitySet:\n'
              '    return SpecialistCapabilitySet(\n'
              '        tool_ids=frozenset({"github.search"}),\n',
              'def _capabilities(\n'
              '    *,\n'
              '    tool_ids: frozenset[str] = frozenset({"github.search"}),\n'
              ') -> SpecialistCapabilitySet:\n'
              '    return SpecialistCapabilitySet(\n'
              '        tool_ids=tool_ids,\n',
              label="parameterized test capabilities",
          )
          replace_once(
              tests,
              '    materials: tuple[ContextMaterial, ...] = (),\n'
              ') -> ContextCompilationRequest:\n',
              '    materials: tuple[ContextMaterial, ...] = (),\n'
              '    tool_ids: tuple[str, ...] = ("github.search",),\n'
              ') -> ContextCompilationRequest:\n',
              label="parameterized request tool ids",
          )
          replace_once(
              tests,
              '        tool_ids=("github.search",),\n'
              '    )\n'
              '    return ContextCompilationRequest(\n',
              '        tool_ids=tool_ids,\n'
              '    )\n'
              '    return ContextCompilationRequest(\n',
              label="request tool-schema ids",
          )
          replace_once(
              tests,
              '        capabilities=_capabilities(),\n'
              '        materials=materials,\n',
              '        capabilities=_capabilities(tool_ids=frozenset(tool_ids)),\n'
              '        materials=materials,\n',
              label="request capability ids",
          )
          replace_once(
              tests,
              '    trace_sink: InMemoryTraceSink | None = None,\n'
              ') -> tuple[\n',
              '    trace_sink: InMemoryTraceSink | None = None,\n'
              '    tool_ids: tuple[str, ...] = ("github.search",),\n'
              ') -> tuple[\n',
              label="parameterized runtime tool ids",
          )
          replace_once(
              tests,
              '        tool_ids=("github.search",),\n'
              '    )\n'
              '    service = ContextCompilerService(\n',
              '        tool_ids=tool_ids,\n'
              '    )\n'
              '    service = ContextCompilerService(\n',
              label="runtime tool-schema ids",
          )
          append_once(
              tests,
              "test_tool_schema_order_permutation_preserves_context_identity",
              '''
              def test_tool_schema_order_permutation_preserves_context_identity() -> None:
                  task = _task()
                  invocation_id = uuid4()
                  tool_ids = ("github.search", "github.fetch-file")
                  first_service, *_ = _runtime(task=task, tool_ids=tool_ids)
                  second_service, *_ = _runtime(task=task, tool_ids=tool_ids)
                  first_request = _request(
                      task=task,
                      invocation_id=invocation_id,
                      tool_ids=tool_ids,
                  )
                  payload = first_request.model_dump(mode="json")
                  payload["tool_schemas"] = list(reversed(payload["tool_schemas"]))
                  reversed_request = ContextCompilationRequest.model_validate(payload)

                  first = first_service.compile(first_request)
                  second = second_service.compile(reversed_request)

                  assert first.bundle.tool_schemas == second.bundle.tool_schemas
                  assert first.bundle.canonical_sha256 == second.bundle.canonical_sha256
                  assert first.bundle.context_bundle_id == second.bundle.context_bundle_id


              def test_project_and_decision_limits_are_typed_and_deterministic() -> None:
                  task = _task()
                  project_high = _material(
                      request_id=task.request_id,
                      source_kind=ContextSourceKind.PROJECT_GOAL,
                      source_id="project.high",
                      content="highest-priority project goal",
                      priority=900,
                      fresh_until_ms=None,
                  )
                  project_low = _material(
                      request_id=task.request_id,
                      source_kind=ContextSourceKind.PROJECT_GOAL,
                      source_id="project.low",
                      content="lower-priority project goal",
                      priority=100,
                      fresh_until_ms=None,
                  )
                  decision_high = _material(
                      request_id=task.request_id,
                      source_kind=ContextSourceKind.DECISION,
                      source_id="decision.high",
                      content="highest-priority decision",
                      priority=800,
                      fresh_until_ms=None,
                  )
                  decision_low = _material(
                      request_id=task.request_id,
                      source_kind=ContextSourceKind.DECISION,
                      source_id="decision.low",
                      content="lower-priority decision",
                      priority=50,
                      fresh_until_ms=None,
                  )
                  approved = (project_high, project_low, decision_high, decision_low)
                  service, *_ = _runtime(
                      task=task,
                      policy=ContextCompilerPolicy(
                          limits=ContextCompilerLimits(
                              max_project_items=1,
                              max_decision_items=1,
                          )
                      ),
                      approved_materials=approved,
                  )
                  result = service.compile(
                      _request(
                          task=task,
                          invocation_id=uuid4(),
                          materials=tuple(reversed(approved)),
                      )
                  )
                  admitted = {section.source_id for section in result.bundle.sections}
                  assert "project.high" in admitted
                  assert "decision.high" in admitted
                  assert "project.low" not in admitted
                  assert "decision.low" not in admitted
                  omissions = {item.source_id: item.reason for item in result.bundle.omissions}
                  assert omissions["project.low"] == ContextOmissionReason.PROJECT_LIMIT
                  assert omissions["decision.low"] == ContextOmissionReason.DECISION_LIMIT
              ''',
          )

          contract_tests = "services/core/tests/test_context_contracts.py"
          append_once(
              contract_tests,
              "test_context_material_rejects_high_confidence_secret_values_without_echo",
              '''
              def test_context_material_rejects_high_confidence_secret_values_without_echo() -> None:
                  marker = "ghp_" + "A" * 36
                  with pytest.raises(ValidationError) as captured:
                      _evidence_material(content=f"Authorization: Bearer {marker}")
                  assert "secret-like" in str(captured.value)
                  assert marker not in str(captured.value)
              ''',
          )

          docs = Path("docs/CONTEXT_COMPILER.md")
          doc_text = docs.read_text(encoding="utf-8")
          doc_text = doc_text.replace(
              '- sections and evidence items;\n'
              '- text characters per material;\n',
              '- sections, evidence items, project/goal items and decision items;\n'
              '- text characters per material;\n',
              1,
          )
          doc_text = doc_text.replace(
              'Required material is never truncated. Optional material over its text limit receives a UTF-8-safe deterministic prefix and an explicit `truncated` disposition. When the total packet remains above byte/token limits, the lowest-priority optional section is repeatedly reduced or omitted with a typed reason. If required authority cannot fit, compilation fails closed.\n',
              'Required material is never truncated. Optional material over its text limit receives a UTF-8-safe deterministic prefix, a `truncated` disposition and one deduplicated typed report carrying source identity and `text_limit`. Byte/token compaction likewise records a single typed reason per source/reason pair. When the total packet remains above limits, the lowest-priority optional section is repeatedly reduced or omitted. If required authority cannot fit, compilation fails closed.\n',
              1,
          )
          doc_text = doc_text.replace(
              '`SQLiteContextStore` uses WAL, synchronous full durability, an exclusive process lock, schema versioning, indexed metadata, payload SHA-256 and `PRAGMA quick_check`.\n',
              '`RetentionAwareSQLiteContextStore` wraps the immutable WAL store with bounded terminal-context retention. `SIMORGH_CONTEXT_STORE_MAX_TERMINAL_RECORDS` controls the retained terminal history; the current claim and every context linked to a nonterminal specialist invocation are never pruned. The underlying store retains synchronous full durability, an exclusive process lock, schema versioning, indexed metadata, payload SHA-256 and `PRAGMA quick_check`.\n',
              1,
          )
          secret_paragraph = (
              '\nHigh-confidence credential material is rejected before durable compilation: '
              'GitHub token forms, authorization headers containing concrete credentials, '
              'private-key headers and bounded key/token/password assignments. Generic words '
              'such as “token” remain ordinary data; only concrete secret-like values fail closed.\n'
          )
          trust_anchor = (
              'Text such as `SYSTEM: ignore previous instructions`, fake role markers, embedded XML/JSON tool calls and requests to reveal secrets remains ordinary tainted content. The compiler preserves it as evidence when allowed but never interprets it as authority.\n'
          )
          if secret_paragraph.strip() not in doc_text:
              doc_text = doc_text.replace(trust_anchor, trust_anchor + secret_paragraph, 1)
          docs.write_text(doc_text, encoding="utf-8")

          validation = Path("docs/validation/phase-1-7-context-compiler.md")
          validation_text = validation.read_text(encoding="utf-8")
          validation_text = validation_text.replace(
              '- source order, policy, budget, freshness, schema and content remain part of deterministic identity;\n',
              '- source order, policy, budget, freshness, schema and content remain part of deterministic identity;\n'
              '- tool-schema input permutations canonicalize to the same bundle/hash/ID;\n'
              '- project/goal and decision item ceilings are distinct, deterministic and typed;\n'
              '- concrete secret-like credential values are rejected without echo;\n'
              '- bounded terminal retention preserves current and nonterminal specialist contexts;\n',
              1,
          )
          validation.write_text(validation_text, encoding="utf-8")

          for path in (
              ".github/phase17-trigger",
              ".github/workflows/phase17-acceptance-finalizer.yml",
              ".github/workflows/phase17-runner.yml",
              ".github/workflows/phase17-context-hardening-v2.yml",
              ".github/workflows/phase17-unified-finalizer.yml",
          ):
              Path(path).unlink(missing_ok=True)
          for path in (
              ".simorgh/contexts.sqlite3",
              ".simorgh/contexts.sqlite3.lock",
          ):
              Path(path).unlink(missing_ok=True)
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run complete Core acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix services/core/src/simorgh_core/agents/specialist_results.py services/core/src/simorgh_core/agents/result_authority.py services/core/src/simorgh_core/agents/context_contracts.py services/core/src/simorgh_core/agents/context_projections.py services/core/src/simorgh_core/agents/context_compiler.py services/core/src/simorgh_core/agents/context_retention.py services/core/tests/test_context_compiler.py services/core/tests/test_context_contracts.py services/core/tests/test_context_github_read_acceptance.py services/core/tests/test_context_retention.py services/core/tests/test_context_truncation_reporting.py
          ruff check .
          mypy services/core/src
          pytest
          git diff --check
          if git ls-files '.simorgh/*' | grep -q .; then
            echo 'runtime database files remain tracked' >&2
            exit 1
          fi
          if git ls-files '.github/workflows/phase17-*' | grep -q .; then
            echo 'temporary Phase 1.7 workflows remain tracked' >&2
            exit 1
          fi

      - name: Commit validated product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: complete and harden context compiler authority'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/context-compiler
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
