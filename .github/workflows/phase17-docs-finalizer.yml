name: Phase 1.7 Documentation Finalizer

on:
  push:
    branches:
      - core/context-compiler
    paths:
      - .github/workflows/phase17-docs-finalizer.yml

permissions:
  contents: write

concurrency:
  group: phase17-documentation-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Synchronize authoritative documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: anchor count={count}, expected=1")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          plan = "docs/IMPLEMENTATION_MASTER_PLAN.md"
          replace_once(
              plan,
              "Phase 1.6 Cancellation Propagation       VALIDATING — PR #54\n"
              "Phase 1.7 Context Compiler               QUEUED\n",
              "Phase 1.6 Cancellation Propagation       COMPLETE — PR #54\n"
              "Phase 1.7 Context Compiler               VALIDATING — PR #56\n",
              label="master-plan current position",
          )
          replace_once(
              plan,
              "## 1.6 Cancellation propagation — VALIDATING\n\n"
              "Implementation is active in PR #54 for issue #53. The current boundary adds durable task-to-invocation ownership, admission fences, conservative reserved-work settlement, optional typed adapter cancellation and privacy-safe audit metadata. Merge still requires exact-head Core/Android CI and review audit.\n",
              "## 1.6 Cancellation propagation — COMPLETE\n\n"
              "Merged through PR #54 at `8fd7cb31275d037cb50a4da0ad86c7871f1be13f`. Issue #53 completed; ADR 0019 accepted. The validated implementation head `930c8bb679e415efbf2f8b412074b9875e8ca3b7` passed CI run `30280106847` with 360 Core tests and full Android build/JVM/lint/APK gates.\n",
              label="master-plan Phase 1.6 closeout",
          )
          replace_once(
              plan,
              "## 1.7 Context compiler and compaction — QUEUED\n\n"
              "### Objective\n",
              "## 1.7 Context compiler and compaction — VALIDATING\n\n"
              "Implementation is active in PR #56 for issue #55. The current boundary provides deterministic taint-aware compilation, exact tool/output-schema intersection, typed omission and truncation reports, distinct project/decision/evidence limits, schema-only repository-report authority, restart-safe replay, bounded terminal retention and cancellation fences before assembly, claim and handoff. No model, tool, connector or specialist call occurs during compilation.\n\n"
              "### Objective\n",
              label="master-plan Phase 1.7 activation",
          )

          context_doc = "docs/CONTEXT_COMPILER.md"
          replace_once(
              context_doc,
              "- `context_projections.py` — reviewed tool-schema and registered output-schema projections;\n"
              "- `context_compiler.py` — authority intersection, freshness/privacy filtering, deterministic compaction and race checks;\n"
              "- `context_store.py` — in-memory and SQLite WAL immutable replay authority;\n"
              "- `SIMORGH_CONTEXT_STORE_PATH` — independent durable database path;\n",
              "- `context_projections.py` — reviewed tool-schema and registered output-schema projections;\n"
              "- `context_result_schemas.py` — context-visible exact result-schema registry, including the schema-only repository-report family;\n"
              "- `context_compiler.py` — authority intersection, freshness/privacy filtering, deterministic compaction and race checks;\n"
              "- `context_store.py` — in-memory and SQLite WAL immutable replay authority;\n"
              "- `context_retention.py` — bounded terminal-context retention that protects nonterminal specialist ownership;\n"
              "- `SIMORGH_CONTEXT_STORE_PATH` and `SIMORGH_CONTEXT_STORE_MAX_TERMINAL_RECORDS` — independent durable path and retention ceiling;\n",
              label="context native components",
          )
          replace_once(
              context_doc,
              "Text such as `SYSTEM: ignore previous instructions`, fake role markers, embedded XML/JSON tool calls and requests to reveal secrets remains ordinary tainted content. The compiler preserves it as evidence when allowed but never interprets it as authority.\n",
              "Text such as `SYSTEM: ignore previous instructions`, fake role markers and embedded XML/JSON tool calls remains ordinary tainted content. The compiler preserves it as evidence when allowed but never interprets it as authority. High-confidence concrete credential shapes—GitHub tokens, authorization headers, private-key headers and bounded key/token/password assignments—are rejected before durable compilation without echoing the value.\n",
              label="context credential boundary",
          )
          replace_once(
              context_doc,
              "The output projection must match an exact registered `ResultSchemaRegistry` handler. The current successful vertical slice uses `development.planner` with `simorgh.typed-plan.v1` and the registered specialist-plan result schema.\n\n"
              "`github.read` currently declares the future `simorgh.repository-report.v1` contract. That final report schema belongs to Phase 1.10 and is intentionally not invented in Phase 1.7. Context compilation for that output therefore fails closed until the registered schema exists.\n",
              "The output projection must match an exact registered `ResultSchemaRegistry` handler. `development.planner` uses `simorgh.typed-plan.v1`; `github.read` uses a strict schema-only `simorgh.repository-report.v1` family exposed by `default_context_result_schema_registry()`. The latter authorizes only the expected context output shape. It does not add a report executor, authoritative terminalizer, model workflow or Persian presentation; those remain Phase 1.10.\n",
              label="context output schema authority",
          )
          replace_once(
              context_doc,
              "- sections and evidence items;\n"
              "- text characters per material;\n",
              "- sections, evidence items, project/goal items and decision items;\n"
              "- text characters per material;\n",
              label="context limits list",
          )
          replace_once(
              context_doc,
              "Required material is never truncated. Optional material over its text limit receives a UTF-8-safe deterministic prefix and an explicit `truncated` disposition. When the total packet remains above byte/token limits, the lowest-priority optional section is repeatedly reduced or omitted with a typed reason. If required authority cannot fit, compilation fails closed.\n",
              "Required material is never truncated. Optional material over its text limit receives a UTF-8-safe deterministic prefix, an explicit `truncated` disposition and one deduplicated typed `text_limit` report. Byte/token compaction likewise records one typed reason per source/reason identity while reducing or omitting the lowest-priority optional section. If required authority cannot fit, compilation fails closed.\n",
              label="context truncation reporting",
          )
          replace_once(
              context_doc,
              "`SQLiteContextStore` uses WAL, synchronous full durability, an exclusive process lock, schema versioning, indexed metadata, payload SHA-256 and `PRAGMA quick_check`.\n\n"
              "Startup validates every existing row and latches unhealthy on payload/hash/index/schema corruption. A second Core process cannot own the same context database. The path must be distinct from task, invocation, result and Android journal databases.\n\n"
              "The Core lifespan configures `context_store_registry` from `SIMORGH_CONTEXT_STORE_PATH`, validates it before serving traffic and resets to an in-memory authority on shutdown or failed startup.\n",
              "`SQLiteContextStore` uses WAL, synchronous full durability, an exclusive process lock, schema versioning, indexed metadata, payload SHA-256 and `PRAGMA quick_check`. `RetentionAwareSQLiteContextStore` adds a configurable ceiling for terminal context history while preserving the current claim and every context owned by a nonterminal specialist invocation.\n\n"
              "Startup validates every existing row and latches unhealthy on payload/hash/index/schema corruption. A second Core process cannot own the same context database. The path must be distinct from task, invocation, result and Android journal databases.\n\n"
              "The Core lifespan configures the retention-aware registry from `SIMORGH_CONTEXT_STORE_PATH` and `SIMORGH_CONTEXT_STORE_MAX_TERMINAL_RECORDS`, validates it before serving traffic and resets to an in-memory authority on shutdown or failed startup.\n",
              label="context retention store",
          )
          replace_once(
              context_doc,
              "Checks occur before authority load, before durable claim and after claim before specialist handoff.\n",
              "Checks occur before authority load, after material admission before canonical assembly, before durable claim and after claim before specialist handoff.\n",
              label="context race checks",
          )
          replace_once(
              context_doc,
              "- no final `simorgh.repository-report.v1` schema or complete Persian GitHub report;\n",
              "- no repository-report executor, authoritative terminalizer, model workflow or complete Persian presentation;\n",
              label="context limitation correction",
          )

          readme = "docs/README.md"
          replace_once(
              readme,
              "- [`CANCELLATION_PROPAGATION.md`](CANCELLATION_PROPAGATION.md) — durable task-to-invocation cancellation, ownership fences, conservative uncertainty, adapter acknowledgements, accounting and incident handling.\n"
              "- [`PERSONAL_COLLEAGUE_ARCHITECTURE.md`](PERSONAL_COLLEAGUE_ARCHITECTURE.md) — target Voice, Notification, MCP, Personal Work Graph and developer/research/SEO/marketing/sales crew architecture.\n",
              "- [`CANCELLATION_PROPAGATION.md`](CANCELLATION_PROPAGATION.md) — durable task-to-invocation cancellation, ownership fences, conservative uncertainty, adapter acknowledgements, accounting and incident handling.\n"
              "- [`CONTEXT_COMPILER.md`](CONTEXT_COMPILER.md) — deterministic taint-aware specialist context, exact schemas, typed limits, durable replay, retention and race handling.\n"
              "- [`PERSONAL_COLLEAGUE_ARCHITECTURE.md`](PERSONAL_COLLEAGUE_ARCHITECTURE.md) — target Voice, Notification, MCP, Personal Work Graph and developer/research/SEO/marketing/sales crew architecture.\n",
              label="README context link",
          )
          replace_once(
              readme,
              "The current agent-task API selects one primary owner and persists task/routing state. PR #39 supplies durable invocation authority; PR #44 merged internal zero-external specialist execution; PR #48 merged typed result, artifact and evidence metadata authority; PR #52 merged governed read-only GitHub tools. PR #54 is validating durable cancellation propagation across owned invocations. The public execution API remains routing-only.\n",
              "The current agent-task API selects one primary owner and persists task/routing state. PR #39 supplies durable invocation authority; PR #44 merged internal zero-external specialist execution; PR #48 merged typed result, artifact and evidence metadata authority; PR #52 merged governed read-only GitHub tools; PR #54 merged durable cancellation propagation. PR #56 is validating the deterministic Context Compiler. The public execution API remains routing-only.\n",
              label="README current runtime",
          )
          replace_once(
              readme,
              "- issue #53 / PR #54 — durable task-to-invocation cancellation propagation, validating;\n"
              "- issue #31 / PR #35 — Persian Voice remains parked until issue #36 prerequisites are complete;\n",
              "- issue #53 / PR #54 — durable task-to-invocation cancellation propagation, complete;\n"
              "- issue #55 / PR #56 — deterministic taint-aware Context Compiler, validating;\n"
              "- issue #31 / PR #35 — Persian Voice remains parked until issue #36 prerequisites are complete;\n",
              label="README dependencies",
          )
          replace_once(
              readme,
              "- ADR 0019 — durable task-to-invocation cancellation propagation.\n",
              "- ADR 0019 — durable task-to-invocation cancellation propagation;\n"
              "- ADR 0020 — deterministic taint-aware specialist context authority.\n",
              label="README ADR 0020",
          )
          replace_once(
              readme,
              "- Core persists immutable final typed results plus bounded artifact/evidence metadata, privacy and retention in a separate SQLite result store.\n",
              "- Core persists immutable final typed results plus bounded artifact/evidence metadata, privacy and retention in a separate SQLite result store.\n"
              "- Core persists immutable specialist context bundles in a distinct retention-aware SQLite context store; nonterminal specialist ownership protects required bundles from pruning.\n",
              label="README context durability",
          )

          runtime = "docs/AGENT_RUNTIME.md"
          replace_once(
              runtime,
              "Status: typed routing and policy foundation merged in PR #30; durable task authority merged in PR #37; durable invocation authority merged in PR #39; zero-external specialist execution merged in PR #44; typed result/evidence authority merged in PR #48; governed GitHub read authority merged in PR #52. Phase 1.6 durable cancellation propagation is validating in PR #54. The default execution API remains routing-only.\n",
              "Status: typed routing and policy foundation merged in PR #30; durable task authority merged in PR #37; durable invocation authority merged in PR #39; zero-external specialist execution merged in PR #44; typed result/evidence authority merged in PR #48; governed GitHub read authority merged in PR #52; durable cancellation propagation merged in PR #54. Phase 1.7 deterministic Context Compiler is validating in PR #56. The default execution API remains routing-only.\n",
              label="AGENT runtime status",
          )
          replace_once(
              runtime,
              "RoutingDecision\n"
              "    ↓\n"
              "internal typed specialist execution\n",
              "RoutingDecision\n"
              "    ↓\n"
              "deterministic taint-aware Context Compiler\n"
              "    ↓\n"
              "internal typed specialist execution\n",
              label="AGENT runtime flow",
          )
          replace_once(
              runtime,
              "Four independent operational stores exist:\n",
              "Five independent operational stores exist:\n",
              label="AGENT store count",
          )
          replace_once(
              runtime,
              "ResultStore\n"
              "  immutable final typed result, artifact/evidence metadata, privacy, retention and replay\n\n"
              "AndroidActionJournal\n",
              "ResultStore\n"
              "  immutable final typed result, artifact/evidence metadata, privacy, retention and replay\n\n"
              "ContextStore\n"
              "  immutable compiled specialist context, exact schemas, taint, omissions and replay\n\n"
              "AndroidActionJournal\n",
              label="AGENT context store",
          )
          anchor = "## Specialist execution runtime\n"
          context_section = (
              "## Context Compiler\n\n"
              "PR #56 adds a zero-external compiler between routing and specialist execution. It intersects the durable task/routing record, exact specialist policy, capability subset, remaining budget, reviewed tool schemas, registered output schema and approved task-bound materials into one immutable `SpecialistContextBundle`. User and external evidence remain tainted data; policy and schemas remain top-level typed authority.\n\n"
              "Compilation is deterministic across source and tool-schema permutations, records typed omissions/truncations, applies distinct project/decision/evidence limits, rejects concrete credential-shaped material without echo, and replays from a retention-aware SQLite authority. Cancellation/deadline fences are checked before assembly, before claim and after claim. Compilation consumes no model/tool/connector/specialist call and creates no usage reservation. The schema-only repository-report family enables `github.read` context validation but does not implement the Phase 1.10 report executor or presentation. See [`CONTEXT_COMPILER.md`](CONTEXT_COMPILER.md) and ADR 0020.\n\n"
          )
          runtime_path = Path(runtime)
          runtime_text = runtime_path.read_text(encoding="utf-8")
          if context_section.strip() not in runtime_text:
              if runtime_text.count(anchor) != 1:
                  raise SystemExit("AGENT Context Compiler insertion anchor mismatch")
              runtime_path.write_text(
                  runtime_text.replace(anchor, context_section + anchor, 1),
                  encoding="utf-8",
              )

          adr = "docs/adr/0020-deterministic-taint-aware-context-authority.md"
          replace_once(
              adr,
              "Task cancellation/deadline/fence authority is checked before compilation,\n"
              "before durable claim, and after claim before handoff. A bundle committed before\n",
              "Task cancellation/deadline/fence authority is checked before compilation, after\n"
              "material admission before canonical assembly, before durable claim, and after\n"
              "claim before handoff. A bundle committed before\n",
              label="ADR race boundary",
          )

          Path(".github/workflows/phase17-docs-finalizer.yml").unlink()
          PY
          git diff --check

      - name: Commit documentation candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: synchronize Phase 1.7 authority and runtime status'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/context-compiler
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "branch moved during documentation finalization" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
