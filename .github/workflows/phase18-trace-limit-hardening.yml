name: Phase 1.8 Trace Limit Hardening

on:
  push:
    branches:
      - core/trace-limit-hardening
    paths:
      - .github/workflows/phase18-trace-limit-hardening.yml

permissions:
  contents: write

concurrency:
  group: phase18-trace-limit-hardening
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify exact source and normalize reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object services/core/src/simorgh_core/agents/trace_contracts.py)" = "6bdeff36bdd4b77d1758c439f2107a8c2a1c03b5"
          test "$(git hash-object services/core/src/simorgh_core/agents/trace_store.py)" = "5991ee98d4cbf0400fa500e63c9c174d9c1586d9"
          test "$(git hash-object services/core/tests/test_trace_store.py)" = "07f76119987718495b9e519fce9c0a5e9bb30eb6"
          test "$(git hash-object services/core/tests/test_sqlite_trace_store.py)" = "958e9cfdc6b468fad60c5f411df9ad7bca5122b9"
          test ! -e docs/validation/phase-1-8-trace-limit-hardening.md
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path("tools/phase18-trace-limit-hardening.patch")
          target = Path("/tmp/phase18-trace-limit-hardening.patch")
          text = source.read_text(encoding="utf-8")
          marker = "+diff --git a/services/core/src/simorgh_core/agents/trace_contracts.py"
          if text.count(marker) != 1:
              raise SystemExit("staged patch normalization marker mismatch")
          prefix, suffix = text.split(marker, 1)
          encoded_suffix = marker + suffix
          lines = encoded_suffix.splitlines(keepends=True)
          if any(not line.startswith("+") for line in lines):
              raise SystemExit("staged patch suffix is not uniformly encoded")
          normalized = prefix + "".join(line[1:] for line in lines)
          digest = sha256(normalized.encode("utf-8")).hexdigest()
          expected = "bdee2e47c67f5c9e3e860e81d23fa603f8e83cc7955e788ba90e328654d2f1cf"
          if digest != expected:
              raise SystemExit(f"reviewed patch hash mismatch: {digest}")
          target.write_text(normalized, encoding="utf-8")
          PY
          git apply --check /tmp/phase18-trace-limit-hardening.patch

      - name: Apply hardening and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/phase18-trace-limit-hardening.patch
          rm tools/phase18-trace-limit-hardening.patch
          rm .github/workflows/phase18-trace-limit-hardening.yml
          git diff --check
          test ! -e tools/phase18-trace-limit-hardening.patch
          test ! -e .github/workflows/phase18-trace-limit-hardening.yml

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest
          git diff --check

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            docs/validation/phase-1-8-trace-limit-hardening.md \
            services/core/src/simorgh_core/agents/trace_contracts.py \
            services/core/src/simorgh_core/agents/trace_store.py \
            services/core/tests/test_sqlite_trace_store.py \
            services/core/tests/test_trace_store.py | sort)
          test "$changed" = "$expected"
          git commit -m 'core: enforce durable trace event and gap limits'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/trace-limit-hardening
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
