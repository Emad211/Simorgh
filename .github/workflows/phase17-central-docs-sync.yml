name: Phase 1.7 Central Documentation Sync

on:
  push:
    branches:
      - core/context-compiler
    paths:
      - .github/workflows/phase17-central-docs-sync.yml

permissions:
  contents: write

concurrency:
  group: phase17-central-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Synchronize central status documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: anchor count={count}, expected=1")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          plan = "docs/IMPLEMENTATION_MASTER_PLAN.md"
          replace_once(
              plan,
              "Phase 1.6 Cancellation Propagation       VALIDATING — PR #54\n"
              "Phase 1.7 Context Compiler               QUEUED\n",
              "Phase 1.6 Cancellation Propagation       COMPLETE — PR #54\n"
              "Phase 1.7 Context Compiler               VALIDATING — PR #56\n",
              label="plan current position",
          )
          replace_once(
              plan,
              "## 1.6 Cancellation propagation — VALIDATING\n\n"
              "Implementation is active in PR #54 for issue #53. The current boundary adds durable task-to-invocation ownership, admission fences, conservative reserved-work settlement, optional typed adapter cancellation and privacy-safe audit metadata. Merge still requires exact-head Core/Android CI and review audit.\n",
              "## 1.6 Cancellation propagation — COMPLETE\n\n"
              "Merged through PR #54 at `8fd7cb31275d037cb50a4da0ad86c7871f1be13f`. Issue #53 completed; ADR 0019 accepted. The validated implementation head `930c8bb679e415efbf2f8b412074b9875e8ca3b7` passed CI run `30280106847` with 360 Core tests and full Android build/JVM/lint/APK gates.\n",
              label="plan Phase 1.6 closeout",
          )
          replace_once(
              plan,
              "## 1.7 Context compiler and compaction — QUEUED\n\n"
              "### Objective\n",
              "## 1.7 Context compiler and compaction — VALIDATING\n\n"
              "Implementation is active in PR #56 for issue #55. The boundary now provides deterministic taint-aware compilation, exact tool/output-schema intersection, typed omission and truncation reports, distinct project/decision/evidence limits, schema-only repository-report authority, restart-safe replay, bounded terminal retention and cancellation fences before assembly, claim and handoff. Compilation performs zero model, tool, connector or specialist calls.\n\n"
              "### Objective\n",
              label="plan Phase 1.7 activation",
          )

          readme = "docs/README.md"
          replace_once(
              readme,
              "- [`CANCELLATION_PROPAGATION.md`](CANCELLATION_PROPAGATION.md) — durable task-to-invocation cancellation, ownership fences, conservative uncertainty, adapter acknowledgements, accounting and incident handling.\n"
              "- [`PERSONAL_COLLEAGUE_ARCHITECTURE.md`](PERSONAL_COLLEAGUE_ARCHITECTURE.md) — target Voice, Notification, MCP, Personal Work Graph and developer/research/SEO/marketing/sales crew architecture.\n",
              "- [`CANCELLATION_PROPAGATION.md`](CANCELLATION_PROPAGATION.md) — durable task-to-invocation cancellation, ownership fences, conservative uncertainty, adapter acknowledgements, accounting and incident handling.\n"
              "- [`CONTEXT_COMPILER.md`](CONTEXT_COMPILER.md) — deterministic taint-aware specialist context, exact schemas, typed limits, durable replay, bounded retention and race handling.\n"
              "- [`PERSONAL_COLLEAGUE_ARCHITECTURE.md`](PERSONAL_COLLEAGUE_ARCHITECTURE.md) — target Voice, Notification, MCP, Personal Work Graph and developer/research/SEO/marketing/sales crew architecture.\n",
              label="README context link",
          )
          replace_once(
              readme,
              "The current agent-task API selects one primary owner and persists task/routing state. PR #39 supplies durable invocation authority; PR #44 merged internal zero-external specialist execution; PR #48 merged typed result, artifact and evidence metadata authority; PR #52 merged governed read-only GitHub tools. PR #54 is validating durable cancellation propagation across owned invocations. The public execution API remains routing-only.\n",
              "The current agent-task API selects one primary owner and persists task/routing state. PR #39 supplies durable invocation authority; PR #44 merged internal zero-external specialist execution; PR #48 merged typed result, artifact and evidence metadata authority; PR #52 merged governed read-only GitHub tools; PR #54 merged durable cancellation propagation. PR #56 is validating the deterministic Context Compiler. The public execution API remains routing-only.\n",
              label="README runtime status",
          )
          replace_once(
              readme,
              "- issue #53 / PR #54 — durable task-to-invocation cancellation propagation, validating;\n"
              "- issue #31 / PR #35 — Persian Voice remains parked until issue #36 prerequisites are complete;\n",
              "- issue #53 / PR #54 — durable task-to-invocation cancellation propagation, complete;\n"
              "- issue #55 / PR #56 — deterministic taint-aware Context Compiler, validating;\n"
              "- issue #31 / PR #35 — Persian Voice remains parked until issue #36 prerequisites are complete;\n",
              label="README roadmap status",
          )
          replace_once(
              readme,
              "- ADR 0019 — durable task-to-invocation cancellation propagation.\n",
              "- ADR 0019 — durable task-to-invocation cancellation propagation;\n"
              "- ADR 0020 — deterministic taint-aware specialist context authority.\n",
              label="README ADR 0020",
          )
          replace_once(
              readme,
              "- Core persists immutable final typed results plus bounded artifact/evidence metadata, privacy and retention in a separate SQLite result store.\n",
              "- Core persists immutable final typed results plus bounded artifact/evidence metadata, privacy and retention in a separate SQLite result store.\n"
              "- Core persists immutable specialist context bundles in a distinct retention-aware SQLite context store; nonterminal specialist ownership protects required bundles from pruning.\n",
              label="README context store",
          )

          runtime = "docs/AGENT_RUNTIME.md"
          replace_once(
              runtime,
              "Status: typed routing and policy foundation merged in PR #30; durable task authority merged in PR #37; durable invocation authority merged in PR #39; zero-external specialist execution merged in PR #44; typed result/evidence authority merged in PR #48; governed GitHub read authority merged in PR #52. Phase 1.6 durable cancellation propagation is validating in PR #54. The default execution API remains routing-only.\n",
              "Status: typed routing and policy foundation merged in PR #30; durable task authority merged in PR #37; durable invocation authority merged in PR #39; zero-external specialist execution merged in PR #44; typed result/evidence authority merged in PR #48; governed GitHub read authority merged in PR #52; durable cancellation propagation merged in PR #54. Phase 1.7 deterministic Context Compiler is validating in PR #56. The default execution API remains routing-only.\n",
              label="runtime status",
          )
          replace_once(
              runtime,
              "RoutingDecision\n"
              "    ↓\n"
              "internal typed specialist execution\n",
              "RoutingDecision\n"
              "    ↓\n"
              "deterministic taint-aware Context Compiler\n"
              "    ↓\n"
              "internal typed specialist execution\n",
              label="runtime flow",
          )
          replace_once(
              runtime,
              "Four independent operational stores exist:\n",
              "Five independent operational stores exist:\n",
              label="runtime store count",
          )
          replace_once(
              runtime,
              "ResultStore\n"
              "  immutable final typed result, artifact/evidence metadata, privacy, retention and replay\n\n"
              "AndroidActionJournal\n",
              "ResultStore\n"
              "  immutable final typed result, artifact/evidence metadata, privacy, retention and replay\n\n"
              "ContextStore\n"
              "  immutable compiled specialist context, exact schemas, taint, omissions and replay\n\n"
              "AndroidActionJournal\n",
              label="runtime ContextStore",
          )
          anchor = "## Specialist execution runtime\n"
          section = (
              "## Context Compiler\n\n"
              "PR #56 adds a zero-external compiler between routing and specialist execution. It intersects the durable task/routing record, exact specialist policy, capability subset, remaining budget, reviewed tool schemas, registered output schema and approved task-bound materials into one immutable `SpecialistContextBundle`. User and external evidence remain tainted data; policy and schemas remain top-level typed authority.\n\n"
              "Compilation is deterministic across material and tool-schema permutations, records typed omissions/truncations, applies distinct project/decision/evidence limits, rejects concrete credential-shaped material without echo and replays from a retention-aware SQLite authority. Cancellation/deadline fences are checked before assembly, before claim and after claim. Compilation consumes no model/tool/connector/specialist call and creates no usage reservation. The schema-only repository-report family enables `github.read` context validation but does not implement the Phase 1.10 report executor or presentation. See [`CONTEXT_COMPILER.md`](CONTEXT_COMPILER.md) and ADR 0020.\n\n"
          )
          runtime_path = Path(runtime)
          text = runtime_path.read_text(encoding="utf-8")
          if "## Context Compiler\n" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("runtime context insertion anchor mismatch")
              runtime_path.write_text(text.replace(anchor, section + anchor, 1), encoding="utf-8")

          Path(".github/workflows/phase17-central-docs-sync.yml").unlink()
          PY
          git diff --check

      - name: Commit synchronized documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: synchronize central Phase 1.7 status'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/context-compiler
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "branch moved during central documentation sync" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
