name: Phase 1.7 Context Authority Hardening v2

on:
  push:
    branches:
      - core/context-compiler
    paths:
      - .github/workflows/phase17-context-hardening-v2.yml

permissions:
  contents: write

concurrency:
  group: phase17-context-authority-hardening-v2
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply audited authority hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str, *, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: anchor count={count}, expected=1")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, content: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if marker in text:
                  raise SystemExit(f"append marker already exists: {marker}")
              file.write_text(text.rstrip() + "\n\n" + dedent(content).lstrip(), encoding="utf-8")

          contracts = "services/core/src/simorgh_core/agents/context_contracts.py"
          replace_once(contracts, "import hashlib\n", "import hashlib\nimport re\n", label="regex import")
          replace_once(
              contracts,
              '_SCHEMA_VERSION_PATTERN = r"^[0-9]+\\.[0-9]+$"\n',
              '_SCHEMA_VERSION_PATTERN = r"^[0-9]+\\.[0-9]+$"\n'
              '_SECRET_PATTERNS: tuple[re.Pattern[str], ...] = (\n'
              '    re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),\n'
              '    re.compile(r"\\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\\b"),\n'
              '    re.compile(r"\\bgithub_pat_[A-Za-z0-9_]{20,}\\b"),\n'
              '    re.compile(r"(?im)^\\s*authorization\\s*:\\s*(?:bearer|basic)\\s+\\S{12,}\\s*$"),\n'
              '    re.compile(\n'
              '        r"(?i)\\b(?:api[_-]?key|access[_-]?token|refresh[_-]?token|"\n'
              '        r"client[_-]?secret|password)\\b\\s*[:=]\\s*[\\\"\\\']?"\n'
              '        r"[A-Za-z0-9_./+=-]{16,}"\n'
              '    ),\n'
              ')\n',
              label="secret patterns",
          )
          replace_once(
              contracts,
              '    EVIDENCE_LIMIT = "evidence_limit"\n    TEXT_LIMIT = "text_limit"\n',
              '    EVIDENCE_LIMIT = "evidence_limit"\n'
              '    PROJECT_LIMIT = "project_limit"\n'
              '    DECISION_LIMIT = "decision_limit"\n'
              '    TEXT_LIMIT = "text_limit"\n',
              label="project decision reasons",
          )
          replace_once(
              contracts,
              '    max_evidence_items: int = Field(default=24, ge=0, le=MAX_CONTEXT_SECTIONS)\n'
              '    max_text_characters: int = Field(default=24_000, ge=1, le=250_000)\n',
              '    max_evidence_items: int = Field(default=24, ge=0, le=MAX_CONTEXT_SECTIONS)\n'
              '    max_project_items: int = Field(default=8, ge=0, le=MAX_CONTEXT_SECTIONS)\n'
              '    max_decision_items: int = Field(default=16, ge=0, le=MAX_CONTEXT_SECTIONS)\n'
              '    max_text_characters: int = Field(default=24_000, ge=1, le=250_000)\n',
              label="project decision limits",
          )
          replace_once(
              contracts,
              '        if self.evidence_count != expected_evidence:\n'
              '            raise ValueError("context bundle evidence count is invalid")\n'
              '        if self.tool_count != len(self.tool_schemas):\n',
              '        if self.evidence_count != expected_evidence:\n'
              '            raise ValueError("context bundle evidence count is invalid")\n'
              '        project_count = sum(\n'
              '            section.source_kind == ContextSourceKind.PROJECT_GOAL\n'
              '            for section in self.sections\n'
              '        )\n'
              '        if project_count > self.limits.max_project_items:\n'
              '            raise ValueError("context bundle exceeds project item limit")\n'
              '        decision_count = sum(\n'
              '            section.source_kind == ContextSourceKind.DECISION\n'
              '            for section in self.sections\n'
              '        )\n'
              '        if decision_count > self.limits.max_decision_items:\n'
              '            raise ValueError("context bundle exceeds decision item limit")\n'
              '        if self.tool_count != len(self.tool_schemas):\n',
              label="bundle item limit validation",
          )
          replace_once(
              contracts,
              '    capabilities = payload.get("capabilities")\n'
              '    if isinstance(capabilities, dict):\n'
              '        for key in ("tool_ids", "connector_ids", "model_tiers"):\n'
              '            values = capabilities.get(key)\n'
              '            if isinstance(values, list):\n'
              '                capabilities[key] = sorted(values)\n',
              '    capabilities = payload.get("capabilities")\n'
              '    if isinstance(capabilities, dict):\n'
              '        for key in ("tool_ids", "connector_ids", "model_tiers"):\n'
              '            values = capabilities.get(key)\n'
              '            if isinstance(values, list):\n'
              '                capabilities[key] = sorted(values)\n'
              '    tool_schemas = payload.get("tool_schemas")\n'
              '    if isinstance(tool_schemas, list):\n'
              '        payload["tool_schemas"] = sorted(\n'
              '            tool_schemas,\n'
              '            key=lambda item: (\n'
              '                str(item.get("tool_id", "")),\n'
              '                str(item.get("connector_id") or ""),\n'
              '            ),\n'
              '        )\n',
              label="canonical tool schema order",
          )
          replace_once(
              contracts,
              'def _require_safe_text(value: str) -> None:\n'
              '    for character in value:\n'
              '        if ord(character) < 32 and character not in {"\\n", "\\r", "\\t"}:\n'
              '            raise ValueError("context text contains a disallowed control character")\n',
              'def _require_safe_text(value: str) -> None:\n'
              '    for character in value:\n'
              '        if ord(character) < 32 and character not in {"\\n", "\\r", "\\t"}:\n'
              '            raise ValueError("context text contains a disallowed control character")\n'
              '    if any(pattern.search(value) is not None for pattern in _SECRET_PATTERNS):\n'
              '        raise ValueError("context text contains secret-like credential material")\n',
              label="secret rejection",
          )
          file = Path(contracts)
          text = file.read_text(encoding="utf-8")
          citation_anchor = (
              '        if not normalized or "\\n" in normalized or "\\r" in normalized:\n'
              '            raise ValueError("context citation must be one bounded non-empty line")\n'
              '        return normalized\n'
          )
          if text.count(citation_anchor) != 2:
              raise SystemExit("citation safety anchor count mismatch")
          file.write_text(
              text.replace(
                  citation_anchor,
                  '        if not normalized or "\\n" in normalized or "\\r" in normalized:\n'
                  '            raise ValueError("context citation must be one bounded non-empty line")\n'
                  '        _require_safe_text(normalized)\n'
                  '        return normalized\n',
              ),
              encoding="utf-8",
          )

          compiler = "services/core/src/simorgh_core/agents/context_compiler.py"
          replace_once(
              compiler,
              '    InvocationEffect,\n    InvocationStore,\n',
              '    InvocationEffect,\n    InvocationKind,\n    InvocationStore,\n',
              label="InvocationKind import",
          )
          replace_once(
              compiler,
              '        claim = self._contexts.claim(bundle)\n',
              '        protected_invocations = frozenset(\n'
              '            record.invocation_id\n'
              '            for record in self._invocations.load()\n'
              '            if record.kind == InvocationKind.SPECIALIST and not record.terminal\n'
              '        )\n'
              '        claim = self._contexts.claim(\n'
              '            bundle,\n'
              '            protected_invocation_ids=(\n'
              '                protected_invocations | frozenset({request.specialist_invocation_id})\n'
              '            ),\n'
              '        )\n',
              label="protected retention claim",
          )
          replace_once(
              compiler,
              '        evidence_count = 0\n'
              '        ordered = sorted(materials, key=_material_sort_key)\n',
              '        evidence_count = 0\n'
              '        project_count = 0\n'
              '        decision_count = 0\n'
              '        ordered = sorted(materials, key=_material_sort_key)\n',
              label="material counters",
          )
          replace_once(
              compiler,
              '            if material.source_kind == ContextSourceKind.EVIDENCE:\n'
              '                if evidence_count >= self._policy.limits.max_evidence_items:\n',
              '            if material.source_kind == ContextSourceKind.PROJECT_GOAL:\n'
              '                if project_count >= self._policy.limits.max_project_items:\n'
              '                    if material.required:\n'
              '                        raise ContextCompilerLimitError(\n'
              '                            "required project context exceeds project item limit"\n'
              '                        )\n'
              '                    omissions.append(\n'
              '                        _omission(material, ContextOmissionReason.PROJECT_LIMIT)\n'
              '                    )\n'
              '                    continue\n'
              '                project_count += 1\n'
              '            elif material.source_kind == ContextSourceKind.DECISION:\n'
              '                if decision_count >= self._policy.limits.max_decision_items:\n'
              '                    if material.required:\n'
              '                        raise ContextCompilerLimitError(\n'
              '                            "required decision context exceeds decision item limit"\n'
              '                        )\n'
              '                    omissions.append(\n'
              '                        _omission(material, ContextOmissionReason.DECISION_LIMIT)\n'
              '                    )\n'
              '                    continue\n'
              '                decision_count += 1\n'
              '            elif material.source_kind == ContextSourceKind.EVIDENCE:\n'
              '                if evidence_count >= self._policy.limits.max_evidence_items:\n',
              label="project decision admission limits",
          )
          replace_once(
              compiler,
              '                sections.append(context_section_from_material(material, content=included))\n'
              '                continue\n',
              '                sections.append(context_section_from_material(material, content=included))\n'
              '                _record_truncation(\n'
              '                    omissions,\n'
              '                    material=material,\n'
              '                    reason=ContextOmissionReason.TEXT_LIMIT,\n'
              '                )\n'
              '                continue\n',
              label="text truncation report",
          )
          replace_once(
              compiler,
              '                sections[index] = _truncate_section(\n'
              '                    current,\n'
              '                    current.content[:reduced_length],\n'
              '                )\n',
              '                sections[index] = _truncate_section(\n'
              '                    current,\n'
              '                    current.content[:reduced_length],\n'
              '                )\n'
              '                _record_truncation(\n'
              '                    omissions,\n'
              '                    material=current,\n'
              '                    reason=(\n'
              '                        ContextOmissionReason.BYTE_LIMIT\n'
              '                        if over_bytes\n'
              '                        else ContextOmissionReason.TOKEN_LIMIT\n'
              '                    ),\n'
              '                )\n'
              '                omissions = sorted(omissions, key=context_omission_sort_key)\n'
              '                if len(omissions) > self._policy.limits.max_omissions:\n'
              '                    raise ContextCompilerLimitError(\n'
              '                        "context compaction omission report exceeds limit"\n'
              '                    )\n',
              label="compaction truncation report",
          )
          replace_once(
              compiler,
              '    source_manifest = context_source_manifest_sha256(sections, omissions)\n'
              '    payload: dict[str, object] = {\n',
              '    source_manifest = context_source_manifest_sha256(sections, omissions)\n'
              '    canonical_tool_schemas = tuple(\n'
              '        sorted(\n'
              '            request.tool_schemas,\n'
              '            key=lambda item: (item.tool_id, item.connector_id or ""),\n'
              '        )\n'
              '    )\n'
              '    payload: dict[str, object] = {\n',
              label="canonical tool schema tuple",
          )
          replace_once(
              compiler,
              '        "tool_schemas": [item.model_dump(mode="json") for item in request.tool_schemas],\n',
              '        "tool_schemas": [\n'
              '            item.model_dump(mode="json") for item in canonical_tool_schemas\n'
              '        ],\n',
              label="canonical payload schemas",
          )
          replace_once(
              compiler,
              '        tool_schemas=tuple(sorted(request.tool_schemas, key=lambda item: item.tool_id)),\n',
              '        tool_schemas=canonical_tool_schemas,\n',
              label="bundle canonical schemas",
          )
          replace_once(
              compiler,
              '        tool_count=len(request.tool_schemas),\n',
              '        tool_count=len(canonical_tool_schemas),\n',
              label="canonical tool count",
          )
          replace_once(
              compiler,
              'def _omission(\n'
              '    material: ContextMaterial,\n'
              '    reason: ContextOmissionReason,\n'
              ') -> ContextOmission:\n',
              'def _record_truncation(\n'
              '    omissions: list[ContextOmission],\n'
              '    *,\n'
              '    material: ContextMaterial | ContextSection,\n'
              '    reason: ContextOmissionReason,\n'
              ') -> None:\n'
              '    report = ContextOmission(\n'
              '        material_id=material.material_id,\n'
              '        request_id=material.request_id,\n'
              '        source_kind=material.source_kind,\n'
              '        source_id=material.source_id,\n'
              '        source_sha256=material.source_sha256,\n'
              '        reason=reason,\n'
              '    )\n'
              '    if report not in omissions:\n'
              '        omissions.append(report)\n\n\n'
              'def _omission(\n'
              '    material: ContextMaterial,\n'
              '    reason: ContextOmissionReason,\n'
              ') -> ContextOmission:\n',
              label="deduplicated truncation ledger",
          )

          store = "services/core/src/simorgh_core/agents/context_store.py"
          replace_once(
              store,
              'CONTEXT_STORE_SCHEMA_VERSION: Literal[1] = 1\n',
              'CONTEXT_STORE_SCHEMA_VERSION: Literal[1] = 1\nDEFAULT_MAX_CONTEXT_RECORDS = 10_000\n',
              label="retention default",
          )
          replace_once(
              store,
              '    def claim(self, record: SpecialistContextBundle) -> ContextClaim: ...\n',
              '    def claim(\n'
              '        self,\n'
              '        record: SpecialistContextBundle,\n'
              '        *,\n'
              '        protected_invocation_ids: frozenset[UUID] = frozenset(),\n'
              '    ) -> ContextClaim: ...\n',
              label="store protocol",
          )
          replace_once(
              store,
              '    def __init__(self) -> None:\n        self._lock = threading.RLock()\n',
              '    def __init__(\n'
              '        self,\n'
              '        *,\n'
              '        max_records: int = DEFAULT_MAX_CONTEXT_RECORDS,\n'
              '    ) -> None:\n'
              '        if max_records < 1:\n'
              '            raise ValueError("max_records must be at least one")\n'
              '        self._max_records = max_records\n'
              '        self._lock = threading.RLock()\n',
              label="memory retention constructor",
          )
          replace_once(
              store,
              '    def claim(self, record: SpecialistContextBundle) -> ContextClaim:\n'
              '        candidate = _validated_fresh_record(record)\n'
              '        with self._lock:\n',
              '    def claim(\n'
              '        self,\n'
              '        record: SpecialistContextBundle,\n'
              '        *,\n'
              '        protected_invocation_ids: frozenset[UUID] = frozenset(),\n'
              '    ) -> ContextClaim:\n'
              '        candidate = _validated_fresh_record(record)\n'
              '        protected = protected_invocation_ids | frozenset(\n'
              '            {candidate.specialist_invocation_id}\n'
              '        )\n'
              '        with self._lock:\n',
              label="memory protected claim",
          )
          replace_once(
              store,
              '                return ContextClaim(\n'
              '                    kind=ContextClaimKind.REPLAY,\n'
              '                    record=existing.model_copy(\n'
              '                        update={"replay": ContextReplayDisposition.REPLAYED}\n'
              '                    ),\n'
              '                )\n'
              '            self._records[candidate.context_bundle_id] = candidate\n',
              '                replay = ContextClaim(\n'
              '                    kind=ContextClaimKind.REPLAY,\n'
              '                    record=existing.model_copy(\n'
              '                        update={"replay": ContextReplayDisposition.REPLAYED}\n'
              '                    ),\n'
              '                )\n'
              '                self._prune_locked(protected)\n'
              '                return replay\n'
              '            self._records[candidate.context_bundle_id] = candidate\n',
              label="memory replay prune",
          )
          replace_once(
              store,
              '            self._by_invocation[candidate.specialist_invocation_id] = (\n'
              '                candidate.context_bundle_id\n'
              '            )\n'
              '            return ContextClaim(kind=ContextClaimKind.NEW, record=candidate)\n',
              '            self._by_invocation[candidate.specialist_invocation_id] = (\n'
              '                candidate.context_bundle_id\n'
              '            )\n'
              '            self._prune_locked(protected)\n'
              '            return ContextClaim(kind=ContextClaimKind.NEW, record=candidate)\n',
              label="memory new prune",
          )
          replace_once(
              store,
              '    def close(self) -> None:\n'
              '        with self._lock:\n'
              '            self._closed = True\n',
              '    def _prune_locked(self, protected_invocation_ids: frozenset[UUID]) -> None:\n'
              '        while len(self._records) > self._max_records:\n'
              '            candidates = sorted(\n'
              '                (\n'
              '                    record\n'
              '                    for record in self._records.values()\n'
              '                    if record.specialist_invocation_id\n'
              '                    not in protected_invocation_ids\n'
              '                ),\n'
              '                key=lambda record: (\n'
              '                    record.compiled_at_ms,\n'
              '                    str(record.context_bundle_id),\n'
              '                ),\n'
              '            )\n'
              '            if not candidates:\n'
              '                return\n'
              '            victim = candidates[0]\n'
              '            self._records.pop(victim.context_bundle_id, None)\n'
              '            self._by_invocation.pop(victim.specialist_invocation_id, None)\n\n'
              '    def close(self) -> None:\n'
              '        with self._lock:\n'
              '            self._closed = True\n',
              label="memory prune implementation",
          )
          replace_once(
              store,
              '    def __init__(self, path: str | Path) -> None:\n        raw_path = str(path)\n',
              '    def __init__(\n'
              '        self,\n'
              '        path: str | Path,\n'
              '        *,\n'
              '        max_records: int = DEFAULT_MAX_CONTEXT_RECORDS,\n'
              '    ) -> None:\n'
              '        if max_records < 1:\n'
              '            raise ValueError("max_records must be at least one")\n'
              '        self._max_records = max_records\n'
              '        raw_path = str(path)\n',
              label="sqlite retention constructor",
          )
          replace_once(
              store,
              '    def claim(self, record: SpecialistContextBundle) -> ContextClaim:\n'
              '        candidate = _validated_fresh_record(record)\n'
              '        with self._lock:\n'
              '            self._require_healthy_locked()\n',
              '    def claim(\n'
              '        self,\n'
              '        record: SpecialistContextBundle,\n'
              '        *,\n'
              '        protected_invocation_ids: frozenset[UUID] = frozenset(),\n'
              '    ) -> ContextClaim:\n'
              '        candidate = _validated_fresh_record(record)\n'
              '        protected = protected_invocation_ids | frozenset(\n'
              '            {candidate.specialist_invocation_id}\n'
              '        )\n'
              '        with self._lock:\n'
              '            self._require_healthy_locked()\n',
              label="sqlite protected claim",
          )
          replace_once(
              store,
              '                return ContextClaim(\n'
              '                    kind=ContextClaimKind.REPLAY,\n'
              '                    record=existing.model_copy(\n'
              '                        update={"replay": ContextReplayDisposition.REPLAYED}\n'
              '                    ),\n'
              '                )\n\n'
              '            payload_json, payload_hash = _encoded_record(candidate)\n',
              '                replay = ContextClaim(\n'
              '                    kind=ContextClaimKind.REPLAY,\n'
              '                    record=existing.model_copy(\n'
              '                        update={"replay": ContextReplayDisposition.REPLAYED}\n'
              '                    ),\n'
              '                )\n'
              '                with self._transaction():\n'
              '                    self._prune_locked(protected)\n'
              '                return replay\n\n'
              '            payload_json, payload_hash = _encoded_record(candidate)\n',
              label="sqlite replay prune",
          )
          replace_once(
              store,
              '                    )\n            except sqlite3.IntegrityError as exc:\n',
              '                    )\n'
              '                    self._prune_locked(protected)\n'
              '            except sqlite3.IntegrityError as exc:\n',
              label="sqlite insert prune",
          )
          replace_once(
              store,
              '                    return ContextClaim(\n'
              '                        kind=ContextClaimKind.REPLAY,\n'
              '                        record=current.model_copy(\n'
              '                            update={"replay": ContextReplayDisposition.REPLAYED}\n'
              '                        ),\n'
              '                    )\n',
              '                    with self._transaction():\n'
              '                        self._prune_locked(protected)\n'
              '                    return ContextClaim(\n'
              '                        kind=ContextClaimKind.REPLAY,\n'
              '                        record=current.model_copy(\n'
              '                            update={"replay": ContextReplayDisposition.REPLAYED}\n'
              '                        ),\n'
              '                    )\n',
              label="sqlite integrity replay prune",
          )
          replace_once(
              store,
              '    def _initialize_schema(self) -> None:\n',
              '    def _prune_locked(self, protected_invocation_ids: frozenset[UUID]) -> None:\n'
              '        rows = self._connection.execute(\n'
              '            """\n'
              '            SELECT context_bundle_id, specialist_invocation_id\n'
              '            FROM context_records\n'
              '            ORDER BY compiled_at_ms, context_bundle_id\n'
              '            """\n'
              '        ).fetchall()\n'
              '        excess = len(rows) - self._max_records\n'
              '        if excess <= 0:\n'
              '            return\n'
              '        victims = [\n'
              '            row\n'
              '            for row in rows\n'
              '            if UUID(str(row["specialist_invocation_id"]))\n'
              '            not in protected_invocation_ids\n'
              '        ][:excess]\n'
              '        for row in victims:\n'
              '            self._connection.execute(\n'
              '                "DELETE FROM context_records WHERE context_bundle_id = ?",\n'
              '                (str(row["context_bundle_id"]),),\n'
              '            )\n\n'
              '    def _initialize_schema(self) -> None:\n',
              label="sqlite prune implementation",
          )
          replace_once(
              store,
              '    "CONTEXT_STORE_SCHEMA_VERSION",\n',
              '    "CONTEXT_STORE_SCHEMA_VERSION",\n    "DEFAULT_MAX_CONTEXT_RECORDS",\n',
              label="retention export",
          )

          config = "services/core/src/simorgh_core/config.py"
          replace_once(
              config,
              '    simorgh_context_store_path: str = Field(\n'
              '        default=".simorgh/contexts.sqlite3",\n'
              '        min_length=1,\n'
              '        max_length=4_096,\n'
              '    )\n',
              '    simorgh_context_store_path: str = Field(\n'
              '        default=".simorgh/contexts.sqlite3",\n'
              '        min_length=1,\n'
              '        max_length=4_096,\n'
              '    )\n'
              '    simorgh_context_store_max_records: int = Field(\n'
              '        default=10_000,\n'
              '        ge=1,\n'
              '        le=1_000_000,\n'
              '    )\n',
              label="retention config",
          )
          app = "services/core/src/simorgh_core/app.py"
          replace_once(
              app,
              '        context_store = SQLiteContextStore(settings.simorgh_context_store_path)\n',
              '        context_store = SQLiteContextStore(\n'
              '            settings.simorgh_context_store_path,\n'
              '            max_records=settings.simorgh_context_store_max_records,\n'
              '        )\n',
              label="retention lifespan",
          )

          tests = "services/core/tests/test_context_compiler.py"
          replace_once(
              tests,
              'from simorgh_core.agents.invocations import InMemoryInvocationStore, canonical_fingerprint\n',
              'from simorgh_core.agents.invocations import (\n'
              '    InMemoryInvocationStore,\n'
              '    InvocationEffect,\n'
              '    InvocationKind,\n'
              '    canonical_fingerprint,\n'
              ')\n',
              label="test invocation imports",
          )
          replace_once(
              tests,
              'def _capabilities() -> SpecialistCapabilitySet:\n'
              '    return SpecialistCapabilitySet(\n'
              '        tool_ids=frozenset({"github.search"}),\n',
              'def _capabilities(\n'
              '    *,\n'
              '    tool_ids: frozenset[str] = frozenset({"github.search"}),\n'
              ') -> SpecialistCapabilitySet:\n'
              '    return SpecialistCapabilitySet(\n'
              '        tool_ids=tool_ids,\n',
              label="parameterized capabilities",
          )
          replace_once(
              tests,
              '    materials: tuple[ContextMaterial, ...] = (),\n'
              ') -> ContextCompilationRequest:\n',
              '    materials: tuple[ContextMaterial, ...] = (),\n'
              '    tool_ids: tuple[str, ...] = ("github.search",),\n'
              ') -> ContextCompilationRequest:\n',
              label="request tool ids parameter",
          )
          replace_once(
              tests,
              '        tool_ids=("github.search",),\n'
              '    )\n'
              '    return ContextCompilationRequest(\n',
              '        tool_ids=tool_ids,\n'
              '    )\n'
              '    return ContextCompilationRequest(\n',
              label="request schema ids",
          )
          replace_once(
              tests,
              '        capabilities=_capabilities(),\n        materials=materials,\n',
              '        capabilities=_capabilities(tool_ids=frozenset(tool_ids)),\n'
              '        materials=materials,\n',
              label="request capabilities ids",
          )
          replace_once(
              tests,
              '    trace_sink: InMemoryTraceSink | None = None,\n) -> tuple[\n',
              '    trace_sink: InMemoryTraceSink | None = None,\n'
              '    tool_ids: tuple[str, ...] = ("github.search",),\n'
              ') -> tuple[\n',
              label="runtime tool ids parameter",
          )
          replace_once(
              tests,
              '        tool_ids=("github.search",),\n'
              '    )\n'
              '    service = ContextCompilerService(\n',
              '        tool_ids=tool_ids,\n'
              '    )\n'
              '    service = ContextCompilerService(\n',
              label="runtime schema ids",
          )
          append_once(
              tests,
              "test_tool_schema_order_permutation_preserves_context_identity",
              '''
              def test_tool_schema_order_permutation_preserves_context_identity() -> None:
                  task = _task()
                  invocation_id = uuid4()
                  tool_ids = ("github.search", "github.fetch-file")
                  first_service, *_ = _runtime(task=task, tool_ids=tool_ids)
                  second_service, *_ = _runtime(task=task, tool_ids=tool_ids)
                  first_request = _request(
                      task=task,
                      invocation_id=invocation_id,
                      tool_ids=tool_ids,
                  )
                  payload = first_request.model_dump(mode="json")
                  payload["tool_schemas"] = list(reversed(payload["tool_schemas"]))
                  reversed_request = ContextCompilationRequest.model_validate(payload)

                  first = first_service.compile(first_request)
                  second = second_service.compile(reversed_request)

                  assert first.bundle.tool_schemas == second.bundle.tool_schemas
                  assert first.bundle.canonical_sha256 == second.bundle.canonical_sha256
                  assert first.bundle.context_bundle_id == second.bundle.context_bundle_id


              def test_project_and_decision_limits_are_typed_and_deterministic() -> None:
                  task = _task()
                  project_high = _material(
                      request_id=task.request_id,
                      source_kind=ContextSourceKind.PROJECT_GOAL,
                      source_id="project.high",
                      content="highest-priority project goal",
                      priority=900,
                      fresh_until_ms=None,
                  )
                  project_low = _material(
                      request_id=task.request_id,
                      source_kind=ContextSourceKind.PROJECT_GOAL,
                      source_id="project.low",
                      content="lower-priority project goal",
                      priority=100,
                      fresh_until_ms=None,
                  )
                  decision_high = _material(
                      request_id=task.request_id,
                      source_kind=ContextSourceKind.DECISION,
                      source_id="decision.high",
                      content="highest-priority decision",
                      priority=800,
                      fresh_until_ms=None,
                  )
                  decision_low = _material(
                      request_id=task.request_id,
                      source_kind=ContextSourceKind.DECISION,
                      source_id="decision.low",
                      content="lower-priority decision",
                      priority=50,
                      fresh_until_ms=None,
                  )
                  approved = (project_high, project_low, decision_high, decision_low)
                  service, *_ = _runtime(
                      task=task,
                      policy=ContextCompilerPolicy(
                          limits=ContextCompilerLimits(
                              max_project_items=1,
                              max_decision_items=1,
                          )
                      ),
                      approved_materials=approved,
                  )
                  result = service.compile(
                      _request(
                          task=task,
                          invocation_id=uuid4(),
                          materials=tuple(reversed(approved)),
                      )
                  )

                  admitted = {section.source_id for section in result.bundle.sections}
                  assert "project.high" in admitted
                  assert "decision.high" in admitted
                  assert "project.low" not in admitted
                  assert "decision.low" not in admitted
                  omissions = {item.source_id: item.reason for item in result.bundle.omissions}
                  assert omissions["project.low"] == ContextOmissionReason.PROJECT_LIMIT
                  assert omissions["decision.low"] == ContextOmissionReason.DECISION_LIMIT


              def test_retention_preserves_nonterminal_context_then_prunes_terminal_history() -> None:
                  task = _task()
                  invocations = InMemoryInvocationStore(wall_clock_millis=lambda: _NOW_MS)
                  contexts = InMemoryContextStore(max_records=1)
                  service, *_ = _runtime(
                      task=task,
                      invocation_store=invocations,
                      context_store=contexts,
                  )
                  first_invocation_id = uuid4()
                  first = service.compile(
                      _request(task=task, invocation_id=first_invocation_id)
                  )
                  invocations.begin(
                      invocation_id=first_invocation_id,
                      request_id=task.request_id,
                      agent_id="development.planner",
                      agent_version="1.0.0",
                      operation="specialist:development.planner",
                      input_fingerprint=canonical_fingerprint({"fixture": "protected"}),
                      kind=InvocationKind.SPECIALIST,
                      effect=InvocationEffect.PROPOSAL,
                      cancellation_owner_id=uuid4(),
                  )
                  second = service.compile(_request(task=task, invocation_id=uuid4()))
                  assert {item.context_bundle_id for item in contexts.load()} == {
                      first.bundle.context_bundle_id,
                      second.bundle.context_bundle_id,
                  }

                  invocations.cancel(first_invocation_id)
                  third = service.compile(_request(task=task, invocation_id=uuid4()))
                  assert [item.context_bundle_id for item in contexts.load()] == [
                      third.bundle.context_bundle_id
                  ]


              def test_sqlite_context_retention_is_bounded_after_reopen(tmp_path: Path) -> None:
                  task = _task()
                  path = tmp_path / "retained-contexts.sqlite3"
                  contexts = SQLiteContextStore(path, max_records=1)
                  service, *_ = _runtime(task=task, context_store=contexts)
                  service.compile(_request(task=task, invocation_id=uuid4()))
                  latest = service.compile(_request(task=task, invocation_id=uuid4()))
                  assert [item.context_bundle_id for item in contexts.load()] == [
                      latest.bundle.context_bundle_id
                  ]
                  contexts.close()

                  reopened = SQLiteContextStore(path, max_records=1)
                  assert [item.context_bundle_id for item in reopened.load()] == [
                      latest.bundle.context_bundle_id
                  ]
                  reopened.close()
              ''',
          )

          contract_tests = "services/core/tests/test_context_contracts.py"
          append_once(
              contract_tests,
              "test_context_material_rejects_high_confidence_secret_values_without_echo",
              '''
              def test_context_material_rejects_high_confidence_secret_values_without_echo() -> None:
                  marker = "ghp_" + "A" * 36
                  with pytest.raises(ValidationError) as captured:
                      _evidence_material(content=f"Authorization: Bearer {marker}")
                  assert "secret-like" in str(captured.value)
                  assert marker not in str(captured.value)
              ''',
          )

          Path(".github/workflows/phase17-context-hardening-v2.yml").unlink()
