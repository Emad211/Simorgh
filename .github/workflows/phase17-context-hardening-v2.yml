      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix services/core/src/simorgh_core/agents/context_contracts.py services/core/src/simorgh_core/agents/context_compiler.py services/core/src/simorgh_core/agents/context_store.py services/core/tests/test_context_compiler.py services/core/tests/test_context_contracts.py services/core/tests/test_context_truncation_reporting.py
          ruff check .
          mypy services/core/src
          pytest

      - name: Commit validated authority hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: harden deterministic context authority'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/context-compiler
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
