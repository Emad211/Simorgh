name: Phase 1.3 hardening fixed status

on:
  push:
    branches:
      - core/specialist-execution-interface
    paths:
      - .github/workflows/phase13-hardening-fixed-status.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Rebuild exact payload and run ephemerally
        shell: bash
        run: |
          set +e
          d=.simorgh-patches/phase13-hardening
          cat \
            "$d/p00-00.b64" "$d/p00-01.b64" "$d/p00-02.b64" "$d/p00-03.b64" \
            "$d/part-01.b64" \
            "$d/p02-00.b64" "$d/p02-01.b64" "$d/p02-02.b64" "$d/p02-03.b64" \
            "$d/part-03.b64" > "$RUNNER_TEMP/script.b64"
          rebuilt_sha=$(sha256sum "$RUNNER_TEMP/script.b64" | awk '{print $1}')
          base64 --decode "$RUNNER_TEMP/script.b64" | gunzip > "$RUNNER_TEMP/patch.py" 2>"$RUNNER_TEMP/decode.log"
          decode_status=$?
          script_sha=$(sha256sum "$RUNNER_TEMP/patch.py" | awk '{print $1}')
          if [[ $decode_status -eq 0 ]]; then
            python "$RUNNER_TEMP/patch.py" > "$RUNNER_TEMP/patch.log" 2>&1
            patch_status=$?
          else
            patch_status=99
            cp "$RUNNER_TEMP/decode.log" "$RUNNER_TEMP/patch.log"
          fi
          {
            echo "Phase 1.3 latest hardening diagnostic — no product files persisted."
            echo
            echo '```text'
            echo "head=$GITHUB_SHA"
            echo "rebuilt_b64_sha=$rebuilt_sha"
            echo "expected_b64_sha=f3f2faa897fc91dc53554c7e8c4e68ad9dd4aad58da5ae9af120271870d0e8e9"
            echo "decode_status=$decode_status"
            echo "script_sha=$script_sha"
            echo "expected_script_sha=d78f40938624a8b545c46c0449f8d637be089f43225744ef70dbc053bc0adff9"
            echo "patch_status=$patch_status"
            echo "--- patch_log_tail ---"
            tail -c 7000 "$RUNNER_TEMP/patch.log"
            echo
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      - name: Update fixed diagnostic comment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/5084400739" \
            --raw-field body="$(cat "$RUNNER_TEMP/body.md")"
