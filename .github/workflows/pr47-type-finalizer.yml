name: PR47 Result Authority Type Finalizer

on:
  push:
    branches:
      - core/typed-results-artifacts
    paths:
      - .github/workflows/pr47-type-finalizer.yml

permissions:
  contents: write

concurrency:
  group: pr47-result-authority-type-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact type narrowing and formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          store_path = Path('services/core/src/simorgh_core/agents/result_store.py')
          store = store_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}, expected=1')
              return text.replace(old, new, 1)

          store = replace_once(
              store,
              'from typing import Literal\n',
              'from typing import Literal, NoReturn\n',
              label='NoReturn import',
          )
          store = replace_once(
              store,
              '        self._connection.execute(\n'
              '            "CREATE TABLE IF NOT EXISTS result_store_meta(key TEXT PRIMARY KEY, value TEXT NOT NULL)"\n'
              '        )\n',
              '        self._connection.execute(\n'
              '            "CREATE TABLE IF NOT EXISTS result_store_meta("\n'
              '            "key TEXT PRIMARY KEY, value TEXT NOT NULL)"\n'
              '        )\n',
              label='schema formatting',
          )
          store = replace_once(
              store,
              '    def _latch_failure_locked(self, failure: ResultAuthorityError) -> None:\n',
              '    def _latch_failure_locked(self, failure: ResultAuthorityError) -> NoReturn:\n',
              label='fail-closed return type',
          )
          store_path.write_text(store, encoding='utf-8')

          terminalizer_path = Path(
              'services/core/src/simorgh_core/agents/result_terminalizer.py'
          )
          terminalizer = terminalizer_path.read_text(encoding='utf-8')
          terminalizer = replace_once(
              terminalizer,
              'from typing import Protocol\n',
              'from typing import Protocol, runtime_checkable\n',
              label='runtime protocol import',
          )
          terminalizer = replace_once(
              terminalizer,
              'class ArtifactAwareResultStore(Protocol):\n',
              '@runtime_checkable\nclass ArtifactAwareResultStore(Protocol):\n',
              label='runtime protocol marker',
          )
          terminalizer = replace_once(
              terminalizer,
              '        if execution_result.payload is None:\n'
              '            raise ResultTerminalizationError(\n'
              '                "completed specialist execution has no typed payload"\n'
              '            )\n'
              '        record = create_specialist_plan_result(\n',
              '        if execution_result.payload is None:\n'
              '            raise ResultTerminalizationError(\n'
              '                "completed specialist execution has no typed payload"\n'
              '            )\n'
              '        durable_result_payload = invocation.result_payload\n'
              '        if durable_result_payload is None:\n'
              '            raise ResultTerminalizationError(\n'
              '                "completed specialist invocation has no durable result payload"\n'
              '            )\n'
              '        record = create_specialist_plan_result(\n',
              label='durable payload narrowing',
          )
          terminalizer = replace_once(
              terminalizer,
              '            invocation_result_sha256=canonical_fingerprint(invocation.result_payload),\n',
              '            invocation_result_sha256=canonical_fingerprint(durable_result_payload),\n',
              label='durable payload fingerprint',
          )
          terminalizer = replace_once(
              terminalizer,
              '        if blobs:\n'
              '            writer = getattr(self._store, "put_with_artifacts", None)\n'
              '            if writer is None or not callable(writer):\n'
              '                raise ResultTerminalizationError(\n'
              '                    "configured result store cannot persist local artifact bytes"\n'
              '                )\n'
              '            return writer(record, artifact_bytes=blobs)\n',
              '        if blobs:\n'
              '            if not isinstance(self._store, ArtifactAwareResultStore):\n'
              '                raise ResultTerminalizationError(\n'
              '                    "configured result store cannot persist local artifact bytes"\n'
              '                )\n'
              '            return self._store.put_with_artifacts(\n'
              '                record, artifact_bytes=blobs\n'
              '            )\n',
              label='artifact store narrowing',
          )
          terminalizer_path.write_text(terminalizer, encoding='utf-8')
          PY
          rm -f .github/workflows/pr47-store-finalizer.yml
          rm -f .github/workflows/pr47-store-diagnostic.yml
          rm -f .github/workflows/pr47-type-finalizer.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run complete Core authority gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest

      - name: Commit validated type-safe authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: make typed result store and terminalizer type-safe'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/typed-results-artifacts
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
