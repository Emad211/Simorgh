name: PR41 Remove Unused Test Import

on:
  push:
    branches:
      - core/specialist-execution-interface

permissions:
  contents: write

concurrency:
  group: pr41-remove-unused-test-import
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact lint correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/core/tests/test_specialist_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = 'from typing import Any\n'
          if text.count(old) != 1:
              raise SystemExit(f'unused import anchor count was {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          rm -f .github/workflows/pr41-remove-unused-import.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate runtime slice
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check \
            services/core/src/simorgh_core/agents/specialist_execution.py \
            services/core/src/simorgh_core/agents/specialist_runtime.py \
            services/core/tests/test_specialist_execution_contracts.py \
            services/core/tests/test_specialist_runtime.py
          mypy \
            services/core/src/simorgh_core/agents/specialist_execution.py \
            services/core/src/simorgh_core/agents/specialist_runtime.py
          pytest -q \
            services/core/tests/test_specialist_execution_contracts.py \
            services/core/tests/test_specialist_runtime.py

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: remove specialist runtime lint residue'
          git push origin HEAD:core/specialist-execution-interface
