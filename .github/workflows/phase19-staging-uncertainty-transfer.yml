name: Phase 1.9 Staging Uncertainty Transfer

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/phase19-staging-uncertainty-transfer.yml

permissions:
  contents: write

concurrency:
  group: phase19-staging-uncertainty-transfer
  cancel-in-progress: true

jobs:
  apply-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: core/live-provider-staging
          fetch-depth: 8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Apply, validate, and publish product commit
        shell: bash
        run: |
          set -euo pipefail
          baseline=e6089f16caf3f189e98bb1ce7cfa4e0aafeaf78c
          test "$(git merge-base HEAD "$baseline")" = "$baseline"
          actual="$(git diff --name-only "$baseline"..HEAD | sort)"
          expected=$'.github/workflows/phase19-staging-uncertainty-transfer.yml\nservices/core/tests/test_live_provider_staging_uncertainty.py\ntools/apply_phase19_staging_uncertainty.py'
          test "$actual" = "$expected"

          python tools/apply_phase19_staging_uncertainty.py
          ruff check . --exclude tools/apply_phase19_staging_uncertainty.py --fix
          ruff check . --exclude tools/apply_phase19_staging_uncertainty.py
          mypy services/core/src
          pytest
          git diff --check

          rm tools/apply_phase19_staging_uncertainty.py
          rm .github/workflows/phase19-staging-uncertainty-transfer.yml
          ruff check .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          actual="$(git diff --cached --name-only "$baseline" | sort)"
          expected=$'docs/validation/phase-1-9-user-api-contract-candidate.md\nservices/core/src/simorgh_core/agents/live_provider_staging.py\nservices/core/src/simorgh_core/agents/live_provider_staging_contracts.py\nservices/core/tests/test_live_provider_staging_uncertainty.py'
          test "$actual" = "$expected"
          git diff --cached --check

          git commit -m "core: persist staging cancellation uncertainty"
          git push origin HEAD:core/live-provider-staging
