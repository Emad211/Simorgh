- untrusted user/GitHub text remains tainted data and cannot widen authority;
- required stale/oversized authority fails closed and optional omissions/truncations are explicit;
- cancellation/deadline/fence races block handoff while committed bundles remain immutable audit records;
- in-memory and SQLite replay, conflict, corruption, process lock and lifespan path separation are covered;
- traces and failure metadata contain only bounded authority metadata;
- runtime `.simorgh` databases and lock files are ignored and absent from the PR diff.

## Automated validation

The acceptance finalizer runs:

- `ruff check .`;
- strict `mypy services/core/src`;
- full `pytest` with the deterministic acceptance test;
- `git diff --check` and a tracked-runtime-file audit.

Ordinary validation uses local/fake inputs only and makes zero live model, provider, connector, MCP or paid external calls.

## Final gate

After the product candidate is published without temporary workflows, the exact PR head must pass the repository's standard Core and Android CI. The final record will cite the exact head, workflow run, test count, Android build/JVM/lint/APK result and review-thread audit before merge.
