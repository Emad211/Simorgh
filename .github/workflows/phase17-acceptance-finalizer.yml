name: Phase 1.7 Acceptance Finalizer

on:
  push:
    branches:
      - core/context-compiler
    paths:
      - .github/workflows/phase17-acceptance-finalizer.yml

permissions:
  contents: write

concurrency:
  group: phase17-context-compiler-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply acceptance corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: anchor count={count}, expected=1")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          gitignore = Path(".gitignore")
          ignored = gitignore.read_text(encoding="utf-8")
          if ".simorgh/" not in ignored:
              gitignore.write_text(
                  ignored.rstrip() + "\n\n# Simorgh runtime state\n.simorgh/\n",
                  encoding="utf-8",
              )

          specialist_results = "services/core/src/simorgh_core/agents/specialist_results.py"
          replace_once(
              specialist_results,
              'SPECIALIST_PLAN_OUTPUT_CONTRACT: Literal[\n'
              '    "simorgh.typed-plan.v1"\n'
              '] = "simorgh.typed-plan.v1"\n',
              'SPECIALIST_PLAN_OUTPUT_CONTRACT: Literal[\n'
              '    "simorgh.typed-plan.v1"\n'
              '] = "simorgh.typed-plan.v1"\n'
              'REPOSITORY_REPORT_OUTPUT_CONTRACT: Literal[\n'
              '    "simorgh.repository-report.v1"\n'
              '] = "simorgh.repository-report.v1"\n',
              label="repository report output contract",
          )
          results_path = Path(specialist_results)
          results_text = results_path.read_text(encoding="utf-8")
          if "class RepositoryReportPayload" not in results_text:
              results_text += '''

class RepositoryReportFinding(BaseModel):
    """One bounded, evidence-linked finding in a future repository report."""

    model_config = ConfigDict(
        extra="forbid",
        frozen=True,
        hide_input_in_errors=True,
    )

    finding_id: str = Field(
        min_length=1,
        max_length=128,
        pattern=r"^[a-z0-9][a-z0-9._-]{0,127}$",
    )
    title: str = Field(min_length=1, max_length=500)
    summary: str = Field(min_length=1, max_length=4_000)
    evidence_references: tuple[str, ...] = Field(default=(), max_length=128)

    @field_validator("title", "summary")
    @classmethod
    def normalize_text(cls, value: str) -> str:
        normalized = value.strip()
        if not normalized:
            raise ValueError("repository report text cannot be empty")
        return normalized

    @field_validator("evidence_references")
    @classmethod
    def validate_evidence_references(cls, value: tuple[str, ...]) -> tuple[str, ...]:
        normalized = tuple(item.strip() for item in value)
        if any(not item or len(item) > 2_048 for item in normalized):
            raise ValueError("repository report evidence references must be bounded")
        if len(set(normalized)) != len(normalized):
            raise ValueError("repository report evidence references must be unique")
        return normalized


class RepositoryReportPayload(BaseModel):
    """Strict schema authority for the later complete GitHub report workflow.

    Phase 1.7 registers this contract so ``github.read`` context can be compiled.
    It does not add an executor, model call, final presentation, or result
    terminalization path; those remain Phase 1.10.
    """

    model_config = ConfigDict(
        extra="forbid",
        frozen=True,
        hide_input_in_errors=True,
    )

    schema_version: Literal["1.0"] = "1.0"
    kind: Literal["repository_report"] = "repository_report"
    repository: str = Field(
        min_length=3,
        max_length=201,
        pattern=r"^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$",
    )
    ref: str = Field(
        min_length=1,
        max_length=255,
        pattern=r"^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$",
    )
    executive_summary: str = Field(min_length=1, max_length=8_000)
    findings: tuple[RepositoryReportFinding, ...] = Field(default=(), max_length=128)
    unresolved_risks: tuple[str, ...] = Field(default=(), max_length=128)
    verification_requirements: tuple[str, ...] = Field(default=(), max_length=128)

    @field_validator(
        "executive_summary",
        "unresolved_risks",
        "verification_requirements",
    )
    @classmethod
    def normalize_report_text(
        cls,
        value: str | tuple[str, ...],
    ) -> str | tuple[str, ...]:
        if isinstance(value, str):
            normalized = value.strip()
            if not normalized:
                raise ValueError("repository report summary cannot be empty")
            return normalized
        normalized_items = tuple(item.strip() for item in value)
        if any(not item or len(item) > 2_000 for item in normalized_items):
            raise ValueError("repository report items must be in 1..2000 characters")
        if len(set(normalized_items)) != len(normalized_items):
            raise ValueError("repository report items must be unique")
        return normalized_items

    @model_validator(mode="after")
    def validate_findings(self) -> Self:
        finding_ids = tuple(item.finding_id for item in self.findings)
        if len(set(finding_ids)) != len(finding_ids):
            raise ValueError("repository report finding IDs must be unique")
        return self
'''
