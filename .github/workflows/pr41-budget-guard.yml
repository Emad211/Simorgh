name: PR41 Specialist Budget Guard

on:
  push:
    branches:
      - core/specialist-execution-interface

permissions:
  contents: write

concurrency:
  group: pr41-specialist-budget-guard
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact budget guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          control = Path('services/core/src/simorgh_core/agents/specialist_control.py')
          text = control.read_text(encoding='utf-8')
          old_import = 'from simorgh_core.agents.registry import SpecialistRegistry\n'
          new_import = (
              'from simorgh_core.agents.registry import SpecialistRegistry, intersect_budgets\n'
          )
          old_guard = '''        if record.budget.cancelled:
              raise SpecialistTaskNotExecutableError(
                  "cancelled task budget cannot enter specialist execution"
              )

              budget = BudgetAccount.restore(
          '''.replace('          ', '')
          new_guard = '''        if record.budget.cancelled:
              raise SpecialistTaskNotExecutableError(
                  "cancelled task budget cannot enter specialist execution"
              )
          if (
              intersect_budgets(record.budget.limits, record.task.budget)
              != record.budget.limits
          ):
              raise SpecialistExecutionPolicyError(
                  "durable task budget exceeds the original task budget"
              )

              budget = BudgetAccount.restore(
          '''.replace('          ', '')
          if text.count(old_import) != 1 or text.count(old_guard) != 1:
              raise SystemExit('specialist control budget anchors are not unique')
          text = text.replace(old_import, new_import, 1).replace(old_guard, new_guard, 1)
          control.write_text(text, encoding='utf-8')

          runtime = Path('services/core/src/simorgh_core/agents/specialist_runtime.py')
          runtime_text = runtime.read_text(encoding='utf-8')
          old_runtime = '''        if budget.limits != request.effective_budget:
              raise SpecialistExecutionPolicyError(
                  "specialist budget limits do not match the effective policy intersection"
              )

              def _require_not_cancelled(
          '''.replace('          ', '')
          new_runtime = '''        if budget.limits != request.effective_budget:
              raise SpecialistExecutionPolicyError(
                  "specialist budget limits do not match the effective policy intersection"
              )
          snapshot = budget.snapshot()
          if snapshot.exhausted_dimension is not None:
              raise SpecialistExecutionPolicyError(
                  "exhausted specialist budget cannot enter execution"
              )

              def _require_not_cancelled(
          '''.replace('          ', '')
          if runtime_text.count(old_runtime) != 1:
              raise SystemExit('specialist runtime budget anchor is not unique')
          runtime.write_text(
              runtime_text.replace(old_runtime, new_runtime, 1),
              encoding='utf-8',
          )

          tests = Path('services/core/tests/test_specialist_control.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '''@pytest.mark.asyncio
          async def test_adapter_preserves_capability_widening_rejection() -> None:
          '''.replace('          ', '')
          addition = '''@pytest.mark.asyncio
          async def test_durable_budget_cannot_widen_original_task_budget() -> None:
              task = _task()
              routed = _routed_record(task)
              widened_limits = routed.budget.limits.model_copy(
                  update={"max_model_calls": task.budget.max_model_calls + 1}
              )
              widened_budget = routed.budget.model_copy(update={"limits": widened_limits})
              widened = routed.model_copy(update={"budget": widened_budget})
              adapter, store = _adapter()

              with pytest.raises(SpecialistExecutionPolicyError, match="exceeds"):
                  await adapter.execute_record(
                      record=widened,
                      invocation_id=uuid4(),
                      context_fingerprint=_CONTEXT_FINGERPRINT,
                      capabilities=SpecialistCapabilitySet(proposal_allowed=True),
                  )

              assert store.load() == []


          @pytest.mark.asyncio
          async def test_exhausted_durable_budget_cannot_enter_runtime() -> None:
              task = _task()
              routed = _routed_record(task)
              exhausted_budget = routed.budget.model_copy(
                  update={"exhausted_dimension": "model_calls"}
              )
              exhausted = routed.model_copy(update={"budget": exhausted_budget})
              adapter, store = _adapter()

              with pytest.raises(SpecialistExecutionPolicyError, match="exhausted"):
                  await adapter.execute_record(
                      record=exhausted,
                      invocation_id=uuid4(),
                      context_fingerprint=_CONTEXT_FINGERPRINT,
                      capabilities=SpecialistCapabilitySet(proposal_allowed=True),
                  )

              assert store.load() == []


          @pytest.mark.asyncio
          async def test_adapter_preserves_capability_widening_rejection() -> None:
          '''.replace('          ', '')
          if test_text.count(marker) != 1:
              raise SystemExit('specialist control test insertion anchor is not unique')
          tests.write_text(test_text.replace(marker, addition, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/pr41-budget-guard.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate budget guards
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check \
            services/core/src/simorgh_core/agents/specialist_control.py \
            services/core/src/simorgh_core/agents/specialist_runtime.py \
            services/core/tests/test_specialist_control.py
          mypy \
            services/core/src/simorgh_core/agents/specialist_control.py \
            services/core/src/simorgh_core/agents/specialist_runtime.py
          pytest -q \
            services/core/tests/test_specialist_control.py \
            services/core/tests/test_specialist_runtime.py

      - name: Commit validated guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: enforce specialist execution budget guards'
          git push origin HEAD:core/specialist-execution-interface
