name: Phase 1.7 Context Foundation Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase17-foundation-finalizer.yml

permissions:
  contents: write

concurrency:
  group: phase17-context-foundation-finalizer
  cancel-in-progress: false

jobs:
  validate-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact authority hardening
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python .github/scripts/phase17_harden_foundation.py > "$RUNNER_TEMP/patch.log" 2>&1
          status=$?
          if [[ "$status" == "0" ]]; then
            python .github/scripts/phase17_fix_foundation_types.py >> "$RUNNER_TEMP/patch.log" 2>&1
            status=$?
          fi
          if [[ "$status" == "0" ]]; then
            rm -f .github/scripts/phase17_harden_foundation.py
            rm -f .github/scripts/phase17_fix_foundation_types.py
            rm -f .github/workflows/phase17-foundation-finalizer.yml
            git diff --check >> "$RUNNER_TEMP/patch.log" 2>&1
            status=$?
          fi
          echo "patch_status=$status" >> "$RUNNER_TEMP/patch.log"
          exit "$status"

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-context-foundation-patch
          path: ${{ runner.temp }}/patch.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop on patch failure
        if: steps.patch.outcome != 'success'
        run: exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate complete Core foundation
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip > "$RUNNER_TEMP/install.log" 2>&1
          pip install -e '.[dev]' >> "$RUNNER_TEMP/install.log" 2>&1
          install_status=$?
          if [[ "$install_status" == "0" ]]; then
            ruff check --fix services/core/src/simorgh_core/agents/context_contracts.py services/core/src/simorgh_core/agents/context_projections.py services/core/src/simorgh_core/agents/context_store.py services/core/src/simorgh_core/agents/context_compiler.py > "$RUNNER_TEMP/ruff-fix.log" 2>&1
            ruff_fix_status=$?
            ruff check . > "$RUNNER_TEMP/ruff.log" 2>&1
            ruff_status=$?
            mypy services/core/src > "$RUNNER_TEMP/mypy.log" 2>&1
            mypy_status=$?
            pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
            pytest_status=$?
          else
            ruff_fix_status=99
            ruff_status=99
            mypy_status=99
            pytest_status=99
            : > "$RUNNER_TEMP/ruff-fix.log"
            : > "$RUNNER_TEMP/ruff.log"
            : > "$RUNNER_TEMP/mypy.log"
            : > "$RUNNER_TEMP/pytest.log"
          fi
          {
            echo "install_status=$install_status"
            echo "ruff_fix_status=$ruff_fix_status"
            echo "ruff_status=$ruff_status"
            echo "mypy_status=$mypy_status"
            echo "pytest_status=$pytest_status"
            echo "--- patch_tail ---"
            tail -c 8000 "$RUNNER_TEMP/patch.log"
            echo "--- ruff_fix_tail ---"
            tail -c 8000 "$RUNNER_TEMP/ruff-fix.log"
            echo "--- ruff_tail ---"
            tail -c 12000 "$RUNNER_TEMP/ruff.log"
            echo "--- mypy_tail ---"
            tail -c 24000 "$RUNNER_TEMP/mypy.log"
            echo "--- pytest_tail ---"
            tail -c 30000 "$RUNNER_TEMP/pytest.log"
          } > "$RUNNER_TEMP/quality.txt"
          if [[ "$install_status" != "0" || "$ruff_fix_status" != "0" || "$ruff_status" != "0" || "$mypy_status" != "0" || "$pytest_status" != "0" ]]; then
            exit 1
          fi
          exit 0

      - name: Upload quality diagnostic
        if: always() && steps.patch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phase17-context-foundation-quality
          path: ${{ runner.temp }}/quality.txt
          retention-days: 2
          if-no-files-found: error

      - name: Stop on quality failure
        if: steps.quality.outcome != 'success' && steps.patch.outcome == 'success'
        run: exit 1

      - name: Publish exact tested foundation
        shell: bash
        env:
          BRANCH: core/context-compiler
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: harden deterministic context authority foundation'
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
