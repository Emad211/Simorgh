name: Phase 1.9 SQLite Payload Finalize

on:
  push:
    branches:
      - core/live-provider-staging
    paths:
      - .github/workflows/phase19-sqlite-finalize.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/phase19-sqlite-finalize.yml

permissions:
  contents: write

concurrency:
  group: phase19-sqlite-payload-finalize
  cancel-in-progress: false

jobs:
  apply-validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRODUCT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Assemble, verify and apply reviewed SQLite payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "fcf9a221f4d0f6798265a9f9799a454221958be6"
          cat .phase19/sqlite-payload.part00 .phase19/sqlite-payload.part01 \
            | base64 --decode > /tmp/phase19-sqlite-payload.tar.gz
          echo "d6e6b8d007cbcc301c3ee822c973afc98280939c1b33bed295a63a20c962b198  /tmp/phase19-sqlite-payload.tar.gz" \
            | sha256sum -c -
          mkdir -p /tmp/phase19-sqlite-overlay
          tar -xzf /tmp/phase19-sqlite-payload.tar.gz -C /tmp/phase19-sqlite-overlay
          test "$(sha256sum /tmp/phase19-sqlite-overlay/services/core/src/simorgh_core/agents/live_provider_staging_store.py | cut -d' ' -f1)" = "7819300fe5a562a0efa8f5038a3b89d50123819cc9f74b74932b5ebd8b1774f6"
          test "$(sha256sum /tmp/phase19-sqlite-overlay/services/core/src/simorgh_core/agents/live_provider_staging_sqlite_store.py | cut -d' ' -f1)" = "2870a99cd66d3556cb929c2530401b70d381291d77a6bdefe63240379bdb5e89"
          test "$(sha256sum /tmp/phase19-sqlite-overlay/services/core/tests/test_live_provider_staging_store.py | cut -d' ' -f1)" = "6b8cc5a94c072ec13257c03912e8648c5c471994980947b194c21c8969953269"
          test "$(sha256sum /tmp/phase19-sqlite-overlay/docs/validation/phase-1-9-user-api-contract-candidate.md | cut -d' ' -f1)" = "943f0f5b0410d4e55cd373efffdc9cb81d7b65ed809e085ac76d5352b11bd248"
          cp -a /tmp/phase19-sqlite-overlay/. .
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "services/core/tests/test_live_provider_staging_store.py"
          )
          text = path.read_text(encoding="utf-8")
          old = '''from simorgh_core.agents.live_provider_staging_sqlite_store import (\n    SQLiteLiveProviderStagingResultStore,\n    LiveProviderStagingStoreCorruptionError,\n    LiveProviderStagingStoreInUseError,\n    LiveProviderStagingStoreSchemaError,\n)\n'''
          new = '''from simorgh_core.agents.live_provider_staging_sqlite_store import (\n    LiveProviderStagingStoreCorruptionError,\n    LiveProviderStagingStoreInUseError,\n    LiveProviderStagingStoreSchemaError,\n    SQLiteLiveProviderStagingResultStore,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit("SQLite test import anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          test "$(sha256sum services/core/tests/test_live_provider_staging_store.py | cut -d' ' -f1)" = "763533c9e1a6a5bdfc880713a78397477b1129e8815b585c2bdf4c8ecb404fc4"

      - name: Remove every temporary transfer and diagnostic file
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase19-sqlite-staging-store.yml
          rm .github/workflows/phase19-sqlite-trigger.yml
          rm .github/workflows/phase19-sqlite-diagnostics.yml
          rm .github/workflows/phase19-sqlite-finalize.yml
          rm .phase19/sqlite-payload.part00
          rm .phase19/sqlite-payload.part01
          rmdir .phase19
          git diff --check

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest
          git diff --check

      - name: Commit validated SQLite authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/phase19-sqlite-diagnostics.yml \
            .github/workflows/phase19-sqlite-finalize.yml \
            .github/workflows/phase19-sqlite-staging-store.yml \
            .github/workflows/phase19-sqlite-trigger.yml \
            .phase19/sqlite-payload.part00 \
            .phase19/sqlite-payload.part01 \
            docs/validation/phase-1-9-user-api-contract-candidate.md \
            services/core/src/simorgh_core/agents/live_provider_staging_sqlite_store.py \
            services/core/src/simorgh_core/agents/live_provider_staging_store.py \
            services/core/tests/test_live_provider_staging_store.py | sort)
          test "$changed" = "$expected"
          git commit -m 'core: persist sanitized staging results in SQLite'

      - name: Protected fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH"
          remote_head=$(git rev-parse "origin/$PRODUCT_BRANCH")
          if [[ "$remote_head" != "$PRODUCT_HEAD_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $PRODUCT_HEAD_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
