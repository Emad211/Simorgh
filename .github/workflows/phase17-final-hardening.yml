name: Phase 1.7 Final Authority Hardening

on:
  push:
    branches:
      - core/context-compiler
    paths:
      - .github/workflows/phase17-final-hardening.yml

permissions:
  contents: write

concurrency:
  group: phase17-final-authority-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply final authority corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str, *, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: anchor count={count}, expected=1")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          projections = "services/core/src/simorgh_core/agents/context_projections.py"
          replace_once(
              projections,
              '    """Backward-compatible entry point for exact context output projection."""\n\n'
              '    return build_context_output_schema(\n'
              '        registry=registry,\n'
              '        output_contract=output_contract,\n'
              '    )\n',
              '    """Backward-compatible typed-plan-only projection entry point."""\n\n'
              '    if output_contract != SPECIALIST_PLAN_OUTPUT_CONTRACT:\n'
              '        raise ContextProjectionError(\n'
              '            "typed-plan context projection requires the typed-plan output contract"\n'
              '        )\n'
              '    return build_context_output_schema(\n'
              '        registry=registry,\n'
              '        output_contract=output_contract,\n'
              '    )\n',
              label="typed-plan wrapper boundary",
          )

          compiler = "services/core/src/simorgh_core/agents/context_compiler.py"
          replace_once(
              compiler,
              'from simorgh_core.agents.context_projections import (\n'
              '    build_specialist_plan_context_output_schema,\n'
              ')\n',
              'from simorgh_core.agents.context_projections import build_context_output_schema\n',
              label="generic output projection import",
          )
          replace_once(
              compiler,
              '        expected_output = build_specialist_plan_context_output_schema(\n',
              '        expected_output = build_context_output_schema(\n',
              label="generic output projection call",
          )
          replace_once(
              compiler,
              '        evidence_count = 0\n'
              '        ordered = sorted(materials, key=_material_sort_key)\n',
              '        evidence_count = 0\n'
              '        project_count = 0\n'
              '        decision_count = 0\n'
              '        ordered = sorted(materials, key=_material_sort_key)\n',
              label="per-kind context counters",
          )
          replace_once(
              compiler,
              '            if material.source_kind == ContextSourceKind.EVIDENCE:\n'
              '                if evidence_count >= self._policy.limits.max_evidence_items:\n',
              '            if material.source_kind == ContextSourceKind.PROJECT_GOAL:\n'
              '                if project_count >= self._policy.limits.max_project_items:\n'
              '                    if material.required:\n'
              '                        raise ContextCompilerLimitError(\n'
              '                            "required project context exceeds project item limit"\n'
              '                        )\n'
              '                    _append_report_once(\n'
              '                        omissions,\n'
              '                        _omission(material, ContextOmissionReason.PROJECT_LIMIT),\n'
              '                    )\n'
              '                    continue\n'
              '                project_count += 1\n'
              '            elif material.source_kind == ContextSourceKind.DECISION:\n'
              '                if decision_count >= self._policy.limits.max_decision_items:\n'
              '                    if material.required:\n'
              '                        raise ContextCompilerLimitError(\n'
              '                            "required decision context exceeds decision item limit"\n'
              '                        )\n'
              '                    _append_report_once(\n'
              '                        omissions,\n'
              '                        _omission(material, ContextOmissionReason.DECISION_LIMIT),\n'
              '                    )\n'
              '                    continue\n'
              '                decision_count += 1\n'
              '            elif material.source_kind == ContextSourceKind.EVIDENCE:\n'
              '                if evidence_count >= self._policy.limits.max_evidence_items:\n',
              label="per-kind context admission",
          )
          replace_once(
              compiler,
              '    source_manifest = context_source_manifest_sha256(sections, omissions)\n'
              '    payload: dict[str, object] = {\n',
              '    source_manifest = context_source_manifest_sha256(sections, omissions)\n'
              '    canonical_tool_schemas = tuple(\n'
              '        sorted(\n'
              '            request.tool_schemas,\n'
              '            key=lambda item: (item.tool_id, item.connector_id or ""),\n'
              '        )\n'
              '    )\n'
              '    payload: dict[str, object] = {\n',
              label="canonical tool-schema tuple",
          )
          replace_once(
              compiler,
              '        "tool_schemas": [item.model_dump(mode="json") for item in request.tool_schemas],\n',
              '        "tool_schemas": [\n'
              '            item.model_dump(mode="json") for item in canonical_tool_schemas\n'
              '        ],\n',
              label="canonical hashed tool schemas",
          )
          replace_once(
              compiler,
              '        tool_schemas=tuple(sorted(request.tool_schemas, key=lambda item: item.tool_id)),\n',
              '        tool_schemas=canonical_tool_schemas,\n',
              label="canonical stored tool schemas",
          )
          replace_once(
              compiler,
              '        tool_count=len(request.tool_schemas),\n',
              '        tool_count=len(canonical_tool_schemas),\n',
              label="canonical tool count",
          )

          contracts_test = "services/core/tests/test_context_contracts.py"
          contracts_path = Path(contracts_test)
          contracts_text = contracts_path.read_text(encoding="utf-8")
          secret_test = dedent('''

          def test_context_material_rejects_concrete_secret_without_echo() -> None:
              marker = "ghp_" + "A" * 36

              with pytest.raises(ValidationError) as captured:
                  _evidence_material(content=f"Authorization: Bearer {marker}")

              assert "secret-like" in str(captured.value)
              assert marker not in str(captured.value)
          ''')
          if "test_context_material_rejects_concrete_secret_without_echo" not in contracts_text:
              contracts_path.write_text(
                  contracts_text.rstrip() + secret_test + "\n",
                  encoding="utf-8",
              )

          hardening_test = Path(
              "services/core/tests/test_context_compiler_final_hardening.py"
          )
          hardening_test.write_text(dedent('''
          from __future__ import annotations

          from uuid import NAMESPACE_URL, UUID, uuid4, uuid5

          import pytest

          from simorgh_core.agents.budget import BudgetSnapshot
          from simorgh_core.agents.context_compiler import (
              ContextCompilerLimitError,
              ContextCompilerService,
          )
          from simorgh_core.agents.context_contracts import (
              ContextCompilationRequest,
              ContextCompilerLimits,
              ContextCompilerPolicy,
              ContextMaterial,
              ContextOmissionReason,
              ContextSourceKind,
              ContextTrustClass,
              context_material_id_for,
              context_text_sha256,
          )
          from simorgh_core.agents.context_projections import (
              build_github_context_tool_schemas,
              build_specialist_plan_context_output_schema,
          )
          from simorgh_core.agents.context_sources import ContextMaterialRegistry
          from simorgh_core.agents.context_store import InMemoryContextStore
          from simorgh_core.agents.contracts import (
              ExecutionMode,
              RoutingDecision,
              RoutingMethod,
              RoutingState,
              TaskBudget,
              TaskEnvelope,
              TaskKind,
              UsageVector,
          )
          from simorgh_core.agents.defaults import default_specialist_registry
          from simorgh_core.agents.github_read_adapter import default_github_read_manifest
          from simorgh_core.agents.invocations import (
              InMemoryInvocationStore,
              canonical_fingerprint,
          )
          from simorgh_core.agents.result_authority import (
              EvidenceCacheDisposition,
              PrivacyClassification,
              RetentionDisposition,
              default_result_schema_registry,
          )
          from simorgh_core.agents.specialist_execution import SpecialistCapabilitySet
          from simorgh_core.agents.task_state import AgentTaskPhase, AgentTaskRecord
          from simorgh_core.agents.task_store import (
              InMemoryAgentTaskStore,
              new_task_store_entry,
          )

          _NOW_MS = 2_500


          def _task() -> TaskEnvelope:
              return TaskEnvelope(
                  received_at_ms=1_000,
                  deadline_at_ms=50_000,
                  locale="fa-IR",
                  input_text="ریپازیتوری را بررسی کن",
                  requested_outcome="برنامه تایپ‌شده",
                  explicit_task_kind=TaskKind.DEVELOPMENT_PLANNING,
                  execution_mode=ExecutionMode.PLAN,
                  allowed_data_sources=frozenset({"github"}),
                  budget=TaskBudget(
                      max_model_calls=1,
                      max_tool_calls=3,
                      max_input_tokens=20_000,
                      max_output_tokens=4_000,
                      max_estimated_cost_microusd=50_000,
                      max_elapsed_ms=30_000,
                      max_retries=0,
                      max_parallel_branches=1,
                  ),
              )


          def _decision(task: TaskEnvelope) -> RoutingDecision:
              return RoutingDecision(
                  decision_id=uuid5(NAMESPACE_URL, f"phase17-hardening:{task.request_id}"),
                  request_id=task.request_id,
                  state=RoutingState.ROUTED,
                  selected_agent_id="development.planner",
                  selected_agent_version="1.0.0",
                  method=RoutingMethod.EXPLICIT_TASK_KIND,
                  confidence_bps=10_000,
                  candidate_agent_ids=("development.planner",),
                  reason="explicit development task",
              )


          def _record(task: TaskEnvelope) -> AgentTaskRecord:
              return AgentTaskRecord(
                  request_id=task.request_id,
                  phase=AgentTaskPhase.ROUTED,
                  created_at_ms=task.received_at_ms,
                  updated_at_ms=1_200,
                  task=task,
                  routing_decision=_decision(task),
                  budget=BudgetSnapshot(
                      request_id=task.request_id,
                      limits=task.budget,
                      committed=UsageVector(),
                      reserved=UsageVector(),
                      elapsed_ms=1_000,
                      cancelled=False,
                  ),
                  detail="phase17 hardening fixture",
              )


          def _material(
              *,
              task: TaskEnvelope,
              kind: ContextSourceKind,
              source_id: str,
              priority: int,
              required: bool = False,
          ) -> ContextMaterial:
              source_sha = canonical_fingerprint({"kind": kind.value, "id": source_id})
              content = f"bounded {source_id}"
              return ContextMaterial(
                  material_id=context_material_id_for(
                      request_id=task.request_id,
                      source_kind=kind,
                      source_id=source_id,
                      source_sha256=source_sha,
                  ),
                  request_id=task.request_id,
                  source_kind=kind,
                  trust=ContextTrustClass.TRUSTED_PROJECT_FACT,
                  source_id=source_id,
                  source_sha256=source_sha,
                  content_sha256=context_text_sha256(content),
                  content=content,
                  required=required,
                  priority=priority,
                  observed_at_ms=1_500,
                  fresh_until_ms=None,
                  cache_disposition=EvidenceCacheDisposition.LIVE,
                  content_addressed=True,
                  tainted=False,
                  privacy=PrivacyClassification.INTERNAL,
                  retention=RetentionDisposition.SESSION,
                  citation_reference=f"fixture:{source_id}",
              )


          def _service(
              *,
              task: TaskEnvelope,
              materials: tuple[ContextMaterial, ...],
              tool_ids: tuple[str, ...],
              policy: ContextCompilerPolicy | None = None,
          ) -> tuple[ContextCompilerService, tuple]:
              task_store = InMemoryAgentTaskStore()
              task_store.upsert(new_task_store_entry(_record(task)))
              tool_schemas = build_github_context_tool_schemas(
                  manifest=default_github_read_manifest(),
                  tool_ids=tool_ids,
              )
              service = ContextCompilerService(
                  task_store=task_store,
                  invocation_store=InMemoryInvocationStore(
                      wall_clock_millis=lambda: _NOW_MS
                  ),
                  specialist_registry=default_specialist_registry(),
                  result_schema_registry=default_result_schema_registry(),
                  context_store=InMemoryContextStore(),
                  material_registry=ContextMaterialRegistry(materials),
                  reviewed_tool_schemas={item.tool_id: item for item in tool_schemas},
                  policy=policy,
                  wall_clock_millis=lambda: _NOW_MS,
              )
              return service, tool_schemas


          def _request(
              *,
              task: TaskEnvelope,
              invocation_id: UUID,
              materials: tuple[ContextMaterial, ...],
              tool_schemas: tuple,
          ) -> ContextCompilationRequest:
              tool_ids = frozenset(item.tool_id for item in tool_schemas)
              return ContextCompilationRequest(
                  request_id=task.request_id,
                  specialist_invocation_id=invocation_id,
                  agent_id="development.planner",
                  agent_version="1.0.0",
                  capabilities=SpecialistCapabilitySet(
                      tool_ids=tool_ids,
                      connector_ids=frozenset({"github"}),
                      proposal_allowed=True,
                  ),
                  materials=materials,
                  tool_schemas=tool_schemas,
                  output_schema=build_specialist_plan_context_output_schema(
                      registry=default_result_schema_registry(),
                      output_contract="simorgh.typed-plan.v1",
                  ),
              )


          def test_project_and_decision_limits_are_enforced_deterministically() -> None:
              task = _task()
              project_high = _material(
                  task=task,
                  kind=ContextSourceKind.PROJECT_GOAL,
                  source_id="project.high",
                  priority=900,
              )
              project_low = _material(
                  task=task,
                  kind=ContextSourceKind.PROJECT_GOAL,
                  source_id="project.low",
                  priority=100,
              )
              decision_high = _material(
                  task=task,
                  kind=ContextSourceKind.DECISION,
                  source_id="decision.high",
                  priority=800,
              )
              decision_low = _material(
                  task=task,
                  kind=ContextSourceKind.DECISION,
                  source_id="decision.low",
                  priority=50,
              )
              materials = (project_high, project_low, decision_high, decision_low)
              service, tool_schemas = _service(
                  task=task,
                  materials=materials,
                  tool_ids=("github.search",),
                  policy=ContextCompilerPolicy(
                      limits=ContextCompilerLimits(
                          max_project_items=1,
                          max_decision_items=1,
                      )
                  ),
              )
              result = service.compile(
                  _request(
                      task=task,
                      invocation_id=uuid4(),
                      materials=tuple(reversed(materials)),
                      tool_schemas=tool_schemas,
                  )
              )

              admitted = {item.source_id for item in result.bundle.sections}
              assert {"project.high", "decision.high"}.issubset(admitted)
              assert "project.low" not in admitted
              assert "decision.low" not in admitted
              omitted = {item.source_id: item.reason for item in result.bundle.omissions}
              assert omitted["project.low"] == ContextOmissionReason.PROJECT_LIMIT
              assert omitted["decision.low"] == ContextOmissionReason.DECISION_LIMIT


          def test_required_project_limit_overflow_fails_closed() -> None:
              task = _task()
              first = _material(
                  task=task,
                  kind=ContextSourceKind.PROJECT_GOAL,
                  source_id="project.first",
                  priority=900,
              )
              required = _material(
                  task=task,
                  kind=ContextSourceKind.PROJECT_GOAL,
                  source_id="project.required",
                  priority=100,
                  required=True,
              )
              service, tool_schemas = _service(
                  task=task,
                  materials=(first, required),
                  tool_ids=("github.search",),
                  policy=ContextCompilerPolicy(
                      limits=ContextCompilerLimits(max_project_items=1)
                  ),
              )

              with pytest.raises(ContextCompilerLimitError, match="required project"):
                  service.compile(
                      _request(
                          task=task,
                          invocation_id=uuid4(),
                          materials=(first, required),
                          tool_schemas=tool_schemas,
                      )
                  )


          def test_tool_schema_permutation_preserves_bundle_hash_and_identity() -> None:
              task = _task()
              invocation_id = uuid4()
              tool_ids = ("github.search", "github.fetch-file")
              first_service, canonical_schemas = _service(
                  task=task,
                  materials=(),
                  tool_ids=tool_ids,
              )
              second_service, _ = _service(
                  task=task,
                  materials=(),
                  tool_ids=tool_ids,
              )
              first = first_service.compile(
                  _request(
                      task=task,
                      invocation_id=invocation_id,
                      materials=(),
                      tool_schemas=canonical_schemas,
                  )
              )
              second = second_service.compile(
                  _request(
                      task=task,
                      invocation_id=invocation_id,
                      materials=(),
                      tool_schemas=tuple(reversed(canonical_schemas)),
                  )
              )

              assert first.bundle.tool_schemas == second.bundle.tool_schemas
              assert first.bundle.canonical_sha256 == second.bundle.canonical_sha256
              assert first.bundle.context_bundle_id == second.bundle.context_bundle_id
          '''), encoding="utf-8")

          Path(".github/workflows/phase17-final-hardening.yml").unlink()
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix services/core/src/simorgh_core/agents/context_projections.py services/core/src/simorgh_core/agents/context_compiler.py services/core/tests/test_context_contracts.py services/core/tests/test_context_compiler_final_hardening.py
          ruff check .
          mypy services/core/src
          pytest
          git diff --check

      - name: Commit validated product correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: close final context authority gaps'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/context-compiler
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
