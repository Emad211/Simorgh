name: PR47 Single Result Linkage Finalizer

on:
  push:
    branches:
      - core/typed-results-artifacts
    paths:
      - .github/workflows/pr47-linkage-single-final.yml

permissions:
  contents: write

concurrency:
  group: pr47-single-result-linkage-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Execute audited reconciliation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path('.github/workflows/pr47-linkage-reconciliation.yml')
          source = source_path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1:
              raise SystemExit('reconciliation Python start marker is not unique')
          remainder = source.split(start_marker, 1)[1]
          if remainder.count(end_marker) != 1:
              raise SystemExit('reconciliation Python end marker is not unique')
          embedded = dedent(remainder.split(end_marker, 1)[0])
          exec(
              compile(embedded, 'pr47-linkage-reconciliation-embedded.py', 'exec'),
              {'__name__': '__main__'},
          )
          PY
          rm -f .github/workflows/pr47-linkage-reconciliation.yml
          rm -f .github/workflows/pr47-linkage-single-final.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run complete reconciled result authority gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest

      - name: Commit validated single authority state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: bind result control plane to invocation hash authority'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/typed-results-artifacts
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
