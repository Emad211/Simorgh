name: Phase 1.6 Cancellation Foundation Gate

on:
  push:
    branches:
      - core/cancellation-propagation
    paths:
      - .github/workflows/phase16-cancellation-foundation.yml

permissions:
  contents: write

concurrency:
  group: phase16-cancellation-foundation
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply invocation cancellation authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_count(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: anchor count {count}, expected {expected}: {old[:80]!r}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          inv = "services/core/src/simorgh_core/agents/invocations.py"
          replace_count(
              inv,
              "from simorgh_core.agents.contracts import InvocationState, UsageVector\n",
              "from simorgh_core.agents.cancellation_contracts import (\n"
              "    InvocationCancellationFence,\n"
              "    InvocationOwnershipReference,\n"
              "    TaskCancellationRequest,\n"
              "    ownership_snapshot_sha256,\n"
              ")\n"
              "from simorgh_core.agents.contracts import InvocationState, UsageVector\n",
          )
          replace_count(
              inv,
              "class InvocationConflictError(InvocationStoreError):\n    pass\n\n\n",
              "class InvocationConflictError(InvocationStoreError):\n    pass\n\n\n"
              "class InvocationCancellationConflictError(InvocationConflictError):\n"
              "    pass\n\n\n"
              "class InvocationCancellationFencedError(InvocationStoreError):\n"
              "    pass\n\n\n",
          )
          replace_count(
              inv,
              "    parent_invocation_id: UUID | None = None\n    state: InvocationPhase\n",
              "    parent_invocation_id: UUID | None = None\n"
              "    cancellation_owner_id: UUID | None = None\n"
              "    state: InvocationPhase\n",
          )
          replace_count(
              inv,
              "        parent_invocation_id: UUID | None = None,\n"
              "        attempt: int = 1,\n",
              "        parent_invocation_id: UUID | None = None,\n"
              "        cancellation_owner_id: UUID | None = None,\n"
              "        attempt: int = 1,\n",
              expected=2,
          )
          replace_count(
              inv,
              "    def load(self) -> list[InvocationRecord]: ...\n\n"
              "    def clear(self) -> None: ...\n",
              "    def load(self) -> list[InvocationRecord]: ...\n\n"
              "    def list_owned(\n"
              "        self,\n"
              "        *,\n"
              "        request_id: UUID,\n"
              "        terminal: bool | None = None,\n"
              "    ) -> tuple[InvocationRecord, ...]: ...\n\n"
              "    def accept_cancellation(\n"
              "        self, request: TaskCancellationRequest\n"
              "    ) -> InvocationCancellationFence: ...\n\n"
              "    def get_cancellation_fence(\n"
              "        self, request_id: UUID\n"
              "    ) -> InvocationCancellationFence | None: ...\n\n"
              "    def settle_cancellation(\n"
              "        self, request_id: UUID\n"
              "    ) -> tuple[InvocationRecord, ...]: ...\n\n"
              "    def clear(self) -> None: ...\n",
          )
          replace_count(
              inv,
              "        self._records: dict[UUID, InvocationRecord] = {}\n"
              "        self._closed = False\n",
              "        self._records: dict[UUID, InvocationRecord] = {}\n"
              "        self._cancellation_fences: dict[UUID, InvocationCancellationFence] = {}\n"
              "        self._closed = False\n",
          )
          replace_count(
              inv,
              "                    parent_invocation_id=parent_invocation_id,\n"
              "                    attempt=attempt,\n",
              "                    parent_invocation_id=parent_invocation_id,\n"
              "                    cancellation_owner_id=cancellation_owner_id,\n"
              "                    attempt=attempt,\n",
              expected=1,
          )
          replace_count(
              inv,
              "            now = self._now_ms()\n"
              "            record = InvocationRecord(\n",
              "            if request_id in self._cancellation_fences:\n"
              "                raise InvocationCancellationFencedError(\n"
              "                    \"task cancellation fence blocks new invocation admission\"\n"
              "                )\n"
              "            now = self._now_ms()\n"
              "            record = InvocationRecord(\n",
          )
          replace_count(
              inv,
              "                parent_invocation_id=parent_invocation_id,\n"
              "                state=InvocationPhase.PENDING,\n",
              "                parent_invocation_id=parent_invocation_id,\n"
              "                cancellation_owner_id=cancellation_owner_id,\n"
              "                state=InvocationPhase.PENDING,\n",
              expected=1,
          )
          replace_count(
              inv,
              "            existing = self._require_record_locked(invocation_id)\n"
              "            if existing.state == InvocationPhase.RESERVED:\n",
              "            existing = self._require_record_locked(invocation_id)\n"
              "            if existing.request_id in self._cancellation_fences:\n"
              "                raise InvocationCancellationFencedError(\n"
              "                    \"task cancellation fence blocks invocation reservation\"\n"
              "                )\n"
              "            if existing.state == InvocationPhase.RESERVED:\n",
              expected=1,
          )
          replace_count(
              inv,
              "    def cancel(self, invocation_id: UUID) -> InvocationRecord:\n"
              "        with self._lock:\n"
              "            existing = self._require_record_locked(invocation_id)\n"
              "            if existing.terminal:\n"
              "                return existing\n"
              "            if existing.state == InvocationPhase.PENDING:\n"
              "                candidate = validated_record_copy(\n"
              "                    existing,\n"
              "                    state=InvocationPhase.CANCELLED,\n"
              "                    failure_code=\"cancelled\",\n"
              "                    failure_detail=\"invocation cancelled before external reservation\",\n"
              "                    updated_at_ms=self._next_time(existing.updated_at_ms),\n"
              "                )\n"
              "            elif existing.state == InvocationPhase.RESERVED:\n"
              "                candidate = unknown_record(\n"
              "                    existing,\n"
              "                    failure_code=\"cancelled_after_reservation\",\n"
              "                    failure_detail=(\n"
              "                        \"invocation cancelled after external-call budget reservation; \"\n"
              "                        \"completion is uncertain\"\n"
              "                    ),\n"
              "                    updated_at_ms=self._next_time(existing.updated_at_ms),\n"
              "                )\n"
              "            else:\n"
              "                raise InvocationStateError(\n"
              "                    f\"cannot cancel invocation in state {existing.state.value}\"\n"
              "                )\n"
              "            self._records[invocation_id] = candidate\n"
              "            return candidate\n",
              "    def cancel(self, invocation_id: UUID) -> InvocationRecord:\n"
              "        with self._lock:\n"
              "            existing = self._require_record_locked(invocation_id)\n"
              "            candidate = cancelled_invocation_record(\n"
              "                existing,\n"
              "                updated_at_ms=self._next_time(existing.updated_at_ms),\n"
              "            )\n"
              "            self._records[invocation_id] = candidate\n"
              "            return candidate\n",
          )
          replace_count(
              inv,
              "    def load(self) -> list[InvocationRecord]:\n"
              "        with self._lock:\n"
              "            self._require_open_locked()\n"
              "            return sorted(\n"
              "                self._records.values(),\n"
              "                key=lambda record: (record.created_at_ms, str(record.invocation_id)),\n"
              "            )\n\n"
              "    def clear(self) -> None:\n",
              "    def load(self) -> list[InvocationRecord]:\n"
              "        with self._lock:\n"
              "            self._require_open_locked()\n"
              "            return sorted(\n"
              "                self._records.values(),\n"
              "                key=lambda record: (record.created_at_ms, str(record.invocation_id)),\n"
              "            )\n\n"
              "    def list_owned(\n"
              "        self,\n"
              "        *,\n"
              "        request_id: UUID,\n"
              "        terminal: bool | None = None,\n"
              "    ) -> tuple[InvocationRecord, ...]:\n"
              "        with self._lock:\n"
              "            self._require_open_locked()\n"
              "            values = (\n"
              "                record\n"
              "                for record in self._records.values()\n"
              "                if record.request_id == request_id\n"
              "                and (terminal is None or record.terminal is terminal)\n"
              "            )\n"
              "            return tuple(\n"
              "                sorted(\n"
              "                    values,\n"
              "                    key=lambda record: (\n"
              "                        record.created_at_ms, str(record.invocation_id)\n"
              "                    ),\n"
              "                )\n"
              "            )\n\n"
              "    def accept_cancellation(\n"
              "        self, request: TaskCancellationRequest\n"
              "    ) -> InvocationCancellationFence:\n"
              "        with self._lock:\n"
              "            self._require_open_locked()\n"
              "            existing = self._cancellation_fences.get(request.request_id)\n"
              "            if existing is not None:\n"
              "                if existing.request != request:\n"
              "                    raise InvocationCancellationConflictError(\n"
              "                        \"task cancellation was replayed with different content\"\n"
              "                    )\n"
              "                return existing\n"
              "            if any(\n"
              "                fence.cancellation_id == request.cancellation_id\n"
              "                for fence in self._cancellation_fences.values()\n"
              "            ):\n"
              "                raise InvocationCancellationConflictError(\n"
              "                    \"cancellation_id already belongs to another task\"\n"
              "                )\n"
              "            owned = tuple(\n"
              "                ownership_reference(record)\n"
              "                for record in self.list_owned(request_id=request.request_id)\n"
              "            )\n"
              "            fence = InvocationCancellationFence(\n"
              "                request=request,\n"
              "                accepted_at_ms=max(request.requested_at_ms, self._now_ms()),\n"
              "                owned_invocations=owned,\n"
              "                ownership_snapshot_sha256=ownership_snapshot_sha256(owned),\n"
              "            )\n"
              "            self._cancellation_fences[request.request_id] = fence\n"
              "            return fence\n\n"
              "    def get_cancellation_fence(\n"
              "        self, request_id: UUID\n"
              "    ) -> InvocationCancellationFence | None:\n"
              "        with self._lock:\n"
              "            self._require_open_locked()\n"
              "            return self._cancellation_fences.get(request_id)\n\n"
              "    def settle_cancellation(\n"
              "        self, request_id: UUID\n"
              "    ) -> tuple[InvocationRecord, ...]:\n"
              "        with self._lock:\n"
              "            self._require_open_locked()\n"
              "            if request_id not in self._cancellation_fences:\n"
              "                raise InvocationStateError(\n"
              "                    \"cannot settle cancellation without a durable fence\"\n"
              "                )\n"
              "            for existing in self.list_owned(request_id=request_id, terminal=False):\n"
              "                self._records[existing.invocation_id] = cancelled_invocation_record(\n"
              "                    existing,\n"
              "                    updated_at_ms=self._next_time(existing.updated_at_ms),\n"
              "                )\n"
              "            return self.list_owned(request_id=request_id)\n\n"
              "    def clear(self) -> None:\n",
          )
          replace_count(
              inv,
              "            self._records.clear()\n",
              "            self._records.clear()\n"
              "            self._cancellation_fences.clear()\n",
              expected=1,
          )
          replace_count(
              inv,
              "    parent_invocation_id: UUID | None,\n"
              "    attempt: int,\n",
              "    parent_invocation_id: UUID | None,\n"
              "    cancellation_owner_id: UUID | None,\n"
              "    attempt: int,\n",
          )
          replace_count(
              inv,
              "        existing.parent_invocation_id,\n"
              "        existing.attempt,\n",
              "        existing.parent_invocation_id,\n"
              "        existing.cancellation_owner_id,\n"
              "        existing.attempt,\n",
          )
          replace_count(
              inv,
              "        parent_invocation_id,\n"
              "        attempt,\n",
              "        parent_invocation_id,\n"
              "        cancellation_owner_id,\n"
              "        attempt,\n",
          )
          replace_count(
              inv,
              "def start_kind_for_record(record: InvocationRecord) -> InvocationStartKind:\n",
              "def ownership_reference(record: InvocationRecord) -> InvocationOwnershipReference:\n"
              "    return InvocationOwnershipReference(\n"
              "        request_id=record.request_id,\n"
              "        invocation_id=record.invocation_id,\n"
              "        kind=record.kind.value,\n"
              "        effect=record.effect.value,\n"
              "        state=record.state.value,\n"
              "        parent_invocation_id=record.parent_invocation_id,\n"
              "        cancellation_owner_id=record.cancellation_owner_id,\n"
              "        created_at_ms=record.created_at_ms,\n"
              "        terminal=record.terminal,\n"
              "    )\n\n\n"
              "def cancelled_invocation_record(\n"
              "    record: InvocationRecord, *, updated_at_ms: int\n"
              ") -> InvocationRecord:\n"
              "    if record.terminal:\n"
              "        return record\n"
              "    if record.state == InvocationPhase.PENDING:\n"
              "        return validated_record_copy(\n"
              "            record,\n"
              "            state=InvocationPhase.CANCELLED,\n"
              "            failure_code=\"cancelled\",\n"
              "            failure_detail=\"invocation cancelled before external reservation\",\n"
              "            updated_at_ms=updated_at_ms,\n"
              "        )\n"
              "    if record.state == InvocationPhase.RESERVED:\n"
              "        return unknown_record(\n"
              "            record,\n"
              "            failure_code=\"cancelled_after_reservation\",\n"
              "            failure_detail=(\n"
              "                \"invocation cancelled after external-call budget reservation; \"\n"
              "                \"completion is uncertain\"\n"
              "            ),\n"
              "            updated_at_ms=updated_at_ms,\n"
              "        )\n"
              "    raise InvocationStateError(\n"
              "        f\"cannot cancel invocation in state {record.state.value}\"\n"
              "    )\n\n\n"
              "def start_kind_for_record(record: InvocationRecord) -> InvocationStartKind:\n",
          )

          store = "services/core/src/simorgh_core/agents/invocation_store.py"
          replace_count(
              store,
              "from simorgh_core.agents.contracts import UsageVector\n",
              "from simorgh_core.agents.cancellation_contracts import (\n"
              "    InvocationCancellationFence,\n"
              "    TaskCancellationRequest,\n"
              "    canonical_cancellation_hash,\n"
              "    ownership_snapshot_sha256,\n"
              ")\n"
              "from simorgh_core.agents.contracts import UsageVector\n",
          )
          replace_count(
              store,
              "    InMemoryInvocationStore,\n"
              "    InvocationConflictError,\n",
              "    InMemoryInvocationStore,\n"
              "    InvocationCancellationConflictError,\n"
              "    InvocationCancellationFencedError,\n"
              "    InvocationConflictError,\n",
          )
          replace_count(
              store,
              "    start_kind_for_record,\n"
              "    unknown_record,\n",
              "    start_kind_for_record,\n"
              "    cancelled_invocation_record,\n"
              "    ownership_reference,\n"
              "    unknown_record,\n",
          )
          replace_count(
              store,
              "        parent_invocation_id: UUID | None = None,\n"
              "        attempt: int = 1,\n",
              "        parent_invocation_id: UUID | None = None,\n"
              "        cancellation_owner_id: UUID | None = None,\n"
              "        attempt: int = 1,\n",
              expected=1,
          )
          replace_count(
              store,
              "                    parent_invocation_id=parent_invocation_id,\n"
              "                    attempt=attempt,\n",
              "                    parent_invocation_id=parent_invocation_id,\n"
              "                    cancellation_owner_id=cancellation_owner_id,\n"
              "                    attempt=attempt,\n",
              expected=1,
          )
          replace_count(
              store,
              "            now = self._now_ms()\n"
              "            record = InvocationRecord(\n",
              "            if self._get_cancellation_fence_locked(request_id) is not None:\n"
              "                raise InvocationCancellationFencedError(\n"
              "                    \"task cancellation fence blocks new invocation admission\"\n"
              "                )\n"
              "            now = self._now_ms()\n"
              "            record = InvocationRecord(\n",
          )
          replace_count(
              store,
              "                parent_invocation_id=parent_invocation_id,\n"
              "                state=InvocationPhase.PENDING,\n",
              "                parent_invocation_id=parent_invocation_id,\n"
              "                cancellation_owner_id=cancellation_owner_id,\n"
              "                state=InvocationPhase.PENDING,\n",
              expected=1,
          )
          replace_count(
              store,
              "            existing = self._require_record_locked(invocation_id)\n"
              "            if existing.state == InvocationPhase.RESERVED:\n",
              "            existing = self._require_record_locked(invocation_id)\n"
              "            if self._get_cancellation_fence_locked(existing.request_id) is not None:\n"
              "                raise InvocationCancellationFencedError(\n"
              "                    \"task cancellation fence blocks invocation reservation\"\n"
              "                )\n"
              "            if existing.state == InvocationPhase.RESERVED:\n",
              expected=1,
          )
          replace_count(
              store,
              "    def cancel(self, invocation_id: UUID) -> InvocationRecord:\n"
              "        with self._lock:\n"
              "            existing = self._require_record_locked(invocation_id)\n"
              "            if existing.terminal:\n"
              "                return existing\n"
              "            if existing.state == InvocationPhase.PENDING:\n"
              "                candidate = validated_record_copy(\n"
              "                    existing,\n"
              "                    state=InvocationPhase.CANCELLED,\n"
              "                    failure_code=\"cancelled\",\n"
              "                    failure_detail=\"invocation cancelled before external reservation\",\n"
              "                    updated_at_ms=self._next_time(existing.updated_at_ms),\n"
              "                )\n"
              "            elif existing.state == InvocationPhase.RESERVED:\n"
              "                candidate = unknown_record(\n"
              "                    existing,\n"
              "                    failure_code=\"cancelled_after_reservation\",\n"
              "                    failure_detail=(\n"
              "                        \"invocation cancelled after external-call budget reservation; \"\n"
              "                        \"completion is uncertain\"\n"
              "                    ),\n"
              "                    updated_at_ms=self._next_time(existing.updated_at_ms),\n"
              "                )\n"
              "            else:\n"
              "                raise InvocationStateError(\n"
              "                    f\"cannot cancel invocation in state {existing.state.value}\"\n"
              "                )\n"
              "            self._update_locked(existing, candidate)\n"
              "            return candidate\n",
              "    def cancel(self, invocation_id: UUID) -> InvocationRecord:\n"
              "        with self._lock:\n"
              "            existing = self._require_record_locked(invocation_id)\n"
              "            candidate = cancelled_invocation_record(\n"
              "                existing,\n"
              "                updated_at_ms=self._next_time(existing.updated_at_ms),\n"
              "            )\n"
              "            self._update_locked(existing, candidate)\n"
              "            return candidate\n",
          )
          replace_count(
              store,
              "    def load(self) -> list[InvocationRecord]:\n"
              "        with self._lock:\n"
              "            self._require_healthy_locked()\n"
              "            self._verify_database_integrity()\n"
              "            try:\n"
              "                rows = self._connection.execute(self._select_sql()).fetchall()\n"
              "            except sqlite3.DatabaseError as exc:\n"
              "                self._raise_database_failure_locked(\n"
              "                    \"could not read invocation records\",\n"
              "                    exc,\n"
              "                )\n"
              "            return [self._decode_row(row) for row in rows]\n\n"
              "    def clear(self) -> None:\n",
              "    def load(self) -> list[InvocationRecord]:\n"
              "        with self._lock:\n"
              "            self._require_healthy_locked()\n"
              "            self._verify_database_integrity()\n"
              "            try:\n"
              "                rows = self._connection.execute(self._select_sql()).fetchall()\n"
              "            except sqlite3.DatabaseError as exc:\n"
              "                self._raise_database_failure_locked(\n"
              "                    \"could not read invocation records\",\n"
              "                    exc,\n"
              "                )\n"
              "            return [self._decode_row(row) for row in rows]\n\n"
              "    def list_owned(\n"
              "        self,\n"
              "        *,\n"
              "        request_id: UUID,\n"
              "        terminal: bool | None = None,\n"
              "    ) -> tuple[InvocationRecord, ...]:\n"
              "        with self._lock:\n"
              "            self._require_healthy_locked()\n"
              "            where = \"WHERE request_id = ?\"\n"
              "            values: list[object] = [str(request_id)]\n"
              "            if terminal is not None:\n"
              "                where += \" AND terminal = ?\"\n"
              "                values.append(int(terminal))\n"
              "            rows = self._connection.execute(\n"
              "                self._select_sql(where_clause=where), tuple(values)\n"
              "            ).fetchall()\n"
              "            return tuple(self._decode_row(row) for row in rows)\n\n"
              "    def accept_cancellation(\n"
              "        self, request: TaskCancellationRequest\n"
              "    ) -> InvocationCancellationFence:\n"
              "        with self._lock:\n"
              "            self._require_healthy_locked()\n"
              "            existing = self._get_cancellation_fence_locked(request.request_id)\n"
              "            if existing is not None:\n"
              "                if existing.request != request:\n"
              "                    raise InvocationCancellationConflictError(\n"
              "                        \"task cancellation was replayed with different content\"\n"
              "                    )\n"
              "                return existing\n"
              "            owned_records = self.list_owned(request_id=request.request_id)\n"
              "            owned = tuple(ownership_reference(record) for record in owned_records)\n"
              "            fence = InvocationCancellationFence(\n"
              "                request=request,\n"
              "                accepted_at_ms=max(request.requested_at_ms, self._now_ms()),\n"
              "                owned_invocations=owned,\n"
              "                ownership_snapshot_sha256=ownership_snapshot_sha256(owned),\n"
              "            )\n"
              "            payload_json = canonical_json(fence)\n"
              "            payload_sha256 = hashlib.sha256(payload_json.encode()).hexdigest()\n"
              "            try:\n"
              "                with self._transaction():\n"
              "                    self._connection.execute(\n"
              "                        \"\"\"\n"
              "                        INSERT INTO invocation_cancellation_fences (\n"
              "                            request_id, cancellation_id, request_sha256,\n"
              "                            accepted_at_ms, payload_json, payload_sha256\n"
              "                        ) VALUES (?, ?, ?, ?, ?, ?)\n"
              "                        \"\"\",\n"
              "                        (\n"
              "                            str(request.request_id),\n"
              "                            str(request.cancellation_id),\n"
              "                            request.canonical_sha256,\n"
              "                            fence.accepted_at_ms,\n"
              "                            payload_json,\n"
              "                            payload_sha256,\n"
              "                        ),\n"
              "                    )\n"
              "            except sqlite3.IntegrityError as exc:\n"
              "                raise InvocationCancellationConflictError(\n"
              "                    \"cancellation identity conflicts with durable authority\"\n"
              "                ) from exc\n"
              "            except sqlite3.DatabaseError as exc:\n"
              "                self._raise_database_failure_locked(\n"
              "                    \"could not persist cancellation fence\", exc\n"
              "                )\n"
              "            return fence\n\n"
              "    def get_cancellation_fence(\n"
              "        self, request_id: UUID\n"
              "    ) -> InvocationCancellationFence | None:\n"
              "        with self._lock:\n"
              "            self._require_healthy_locked()\n"
              "            return self._get_cancellation_fence_locked(request_id)\n\n"
              "    def settle_cancellation(\n"
              "        self, request_id: UUID\n"
              "    ) -> tuple[InvocationRecord, ...]:\n"
              "        with self._lock:\n"
              "            self._require_healthy_locked()\n"
              "            if self._get_cancellation_fence_locked(request_id) is None:\n"
              "                raise InvocationStateError(\n"
              "                    \"cannot settle cancellation without a durable fence\"\n"
              "                )\n"
              "            try:\n"
              "                with self._transaction():\n"
              "                    rows = self._connection.execute(\n"
              "                        self._select_sql(\n"
              "                            where_clause=(\n"
              "                                \"WHERE request_id = ? AND terminal = 0\"\n"
              "                            )\n"
              "                        ),\n"
              "                        (str(request_id),),\n"
              "                    ).fetchall()\n"
              "                    for row in rows:\n"
              "                        existing = self._decode_row(row)\n"
              "                        candidate = cancelled_invocation_record(\n"
              "                            existing,\n"
              "                            updated_at_ms=self._next_time(existing.updated_at_ms),\n"
              "                        )\n"
              "                        validate_invocation_transition(existing, candidate)\n"
              "                        self._update_row_locked(candidate)\n"
              "            except sqlite3.DatabaseError as exc:\n"
              "                self._raise_database_failure_locked(\n"
              "                    \"could not settle owned invocation cancellation\", exc\n"
              "                )\n"
              "            return self.list_owned(request_id=request_id)\n\n"
              "    def clear(self) -> None:\n",
          )
          replace_count(
              store,
              "                with self._transaction():\n"
              "                    self._connection.execute(\"DELETE FROM invocation_records\")\n",
              "                with self._transaction():\n"
              "                    self._connection.execute(\n"
              "                        \"DELETE FROM invocation_cancellation_fences\"\n"
              "                    )\n"
              "                    self._connection.execute(\"DELETE FROM invocation_records\")\n",
          )
          replace_count(
              store,
              "                    candidate = unknown_record(\n"
              "                        existing,\n"
              "                        failure_code=\"process_interrupted\",\n"
              "                        failure_detail=(\n"
              "                            \"Core restarted before invocation completion; automatic \"\n"
              "                            \"retry is blocked\"\n"
              "                        ),\n"
              "                        updated_at_ms=max(existing.updated_at_ms, now),\n"
              "                    )\n",
              "                    if self._get_cancellation_fence_locked(\n"
              "                        existing.request_id\n"
              "                    ) is not None:\n"
              "                        candidate = cancelled_invocation_record(\n"
              "                            existing,\n"
              "                            updated_at_ms=max(existing.updated_at_ms, now),\n"
              "                        )\n"
              "                    else:\n"
              "                        candidate = unknown_record(\n"
              "                            existing,\n"
              "                            failure_code=\"process_interrupted\",\n"
              "                            failure_detail=(\n"
              "                                \"Core restarted before invocation completion; \"\n"
              "                                \"automatic retry is blocked\"\n"
              "                            ),\n"
              "                            updated_at_ms=max(existing.updated_at_ms, now),\n"
              "                        )\n",
          )
          replace_count(
              store,
              "            self._connection.execute(\n"
              "                \"\"\"\n"
              "                CREATE INDEX IF NOT EXISTS invocation_records_state_order\n"
              "                ON invocation_records(state, updated_at_ms, invocation_id)\n"
              "                \"\"\"\n"
              "            )\n",
              "            self._connection.execute(\n"
              "                \"\"\"\n"
              "                CREATE INDEX IF NOT EXISTS invocation_records_state_order\n"
              "                ON invocation_records(state, updated_at_ms, invocation_id)\n"
              "                \"\"\"\n"
              "            )\n"
              "            self._connection.execute(\n"
              "                \"\"\"\n"
              "                CREATE TABLE IF NOT EXISTS invocation_cancellation_fences (\n"
              "                    request_id TEXT PRIMARY KEY,\n"
              "                    cancellation_id TEXT NOT NULL UNIQUE,\n"
              "                    request_sha256 TEXT NOT NULL\n"
              "                        CHECK(length(request_sha256) = 64),\n"
              "                    accepted_at_ms INTEGER NOT NULL\n"
              "                        CHECK(accepted_at_ms >= 0),\n"
              "                    payload_json TEXT NOT NULL,\n"
              "                    payload_sha256 TEXT NOT NULL\n"
              "                        CHECK(length(payload_sha256) = 64)\n"
              "                ) WITHOUT ROWID\n"
              "                \"\"\"\n"
              "            )\n",
          )
          replace_count(
              store,
              "    def _require_record_locked(self, invocation_id: UUID) -> InvocationRecord:\n",
              "    def _get_cancellation_fence_locked(\n"
              "        self, request_id: UUID\n"
              "    ) -> InvocationCancellationFence | None:\n"
              "        row = self._connection.execute(\n"
              "            \"\"\"\n"
              "            SELECT request_id, cancellation_id, request_sha256,\n"
              "                   accepted_at_ms, payload_json, payload_sha256\n"
              "            FROM invocation_cancellation_fences\n"
              "            WHERE request_id = ?\n"
              "            \"\"\",\n"
              "            (str(request_id),),\n"
              "        ).fetchone()\n"
              "        if row is None:\n"
              "            return None\n"
              "        payload_json = row[\"payload_json\"]\n"
              "        actual_hash = hashlib.sha256(payload_json.encode()).hexdigest()\n"
              "        if actual_hash != row[\"payload_sha256\"]:\n"
              "            self._latch_corruption_locked(\n"
              "                \"cancellation fence payload hash mismatch\"\n"
              "            )\n"
              "        try:\n"
              "            fence = InvocationCancellationFence.model_validate(\n"
              "                json.loads(payload_json)\n"
              "            )\n"
              "        except (json.JSONDecodeError, TypeError, ValueError):\n"
              "            self._latch_corruption_locked(\n"
              "                \"cancellation fence payload contract is invalid\"\n"
              "            )\n"
              "        identity = (\n"
              "            str(fence.request_id),\n"
              "            str(fence.cancellation_id),\n"
              "            fence.request.canonical_sha256,\n"
              "            fence.accepted_at_ms,\n"
              "        )\n"
              "        row_identity = (\n"
              "            row[\"request_id\"],\n"
              "            row[\"cancellation_id\"],\n"
              "            row[\"request_sha256\"],\n"
              "            row[\"accepted_at_ms\"],\n"
              "        )\n"
              "        if identity != row_identity:\n"
              "            self._latch_corruption_locked(\n"
              "                \"cancellation fence indexed columns do not match payload\"\n"
              "            )\n"
              "        return fence\n\n"
              "    def _require_record_locked(self, invocation_id: UUID) -> InvocationRecord:\n",
          )
          replace_count(
              store,
              "        existing.parent_invocation_id,\n"
              "        existing.attempt,\n",
              "        existing.parent_invocation_id,\n"
              "        existing.cancellation_owner_id,\n"
              "        existing.attempt,\n",
          )
          replace_count(
              store,
              "        candidate.parent_invocation_id,\n"
              "        candidate.attempt,\n",
              "        candidate.parent_invocation_id,\n"
              "        candidate.cancellation_owner_id,\n"
              "        candidate.attempt,\n",
          )

          tests = Path("services/core/tests/test_cancellation_invocation_authority.py")
          tests.write_text(
              '''from __future__ import annotations

from pathlib import Path
from uuid import UUID, uuid4

import pytest

from simorgh_core.agents.cancellation_contracts import (
    CancellationRequesterAuthority,
    TaskCancellationRequest,
)
from simorgh_core.agents.contracts import InvocationState, UsageVector
from simorgh_core.agents.invocation_store import SQLiteInvocationStore
from simorgh_core.agents.invocations import (
    InMemoryInvocationStore,
    InvocationCancellationConflictError,
    InvocationCancellationFencedError,
    InvocationEffect,
    InvocationKind,
    InvocationStore,
)


def _cancellation(
    request_id: UUID,
    *,
    cancellation_id: UUID | None = None,
    reason: str = "operator requested cancellation",
) -> TaskCancellationRequest:
    return TaskCancellationRequest(
        request_id=request_id,
        cancellation_id=cancellation_id or uuid4(),
        requested_at_ms=10,
        reason_code="operator_requested",
        operator_reason=reason,
        requester_authority=CancellationRequesterAuthority.OPERATOR,
        observed_task_phase="routed",
        observed_task_version=1,
    )


def _begin_tool(
    store: InvocationStore,
    *,
    request_id: UUID,
    invocation_id: UUID | None = None,
    effect: InvocationEffect = InvocationEffect.READ_ONLY,
    owner_id: UUID | None = None,
):
    return store.begin(
        invocation_id=invocation_id or uuid4(),
        request_id=request_id,
        agent_id="github.read",
        agent_version="1.0.0",
        operation="tool:github.fetch-file",
        input_fingerprint="a" * 64,
        kind=InvocationKind.TOOL,
        effect=effect,
        tool_id="github.fetch-file",
        connector_id="github",
        cancellation_owner_id=owner_id,
    ).record


def test_fence_captures_deterministic_owned_invocations_and_owner_identity() -> None:
    store = InMemoryInvocationStore(wall_clock_millis=lambda: 20)
    request_id = uuid4()
    owner_id = uuid4()
    first = _begin_tool(store, request_id=request_id, owner_id=owner_id)
    second = _begin_tool(store, request_id=request_id)

    fence = store.accept_cancellation(_cancellation(request_id))

    assert [item.invocation_id for item in fence.owned_invocations] == [
        first.invocation_id,
        second.invocation_id,
    ]
    assert fence.owned_invocations[0].cancellation_owner_id == owner_id
    assert store.list_owned(request_id=request_id) == (first, second)


def test_fence_blocks_new_begin_and_existing_reservation() -> None:
    store = InMemoryInvocationStore(wall_clock_millis=lambda: 20)
    request_id = uuid4()
    pending = _begin_tool(store, request_id=request_id)
    store.accept_cancellation(_cancellation(request_id))

    with pytest.raises(InvocationCancellationFencedError, match="admission"):
        _begin_tool(store, request_id=request_id)
    with pytest.raises(InvocationCancellationFencedError, match="reservation"):
        store.reserve(invocation_id=pending.invocation_id, usage=UsageVector(tool_calls=1))

    settled = store.settle_cancellation(request_id)
    assert settled[0].state == InvocationState.CANCELLED
    assert settled[0].committed_usage == UsageVector()


def test_reserved_read_and_mutation_settle_with_conserved_uncertainty() -> None:
    store = InMemoryInvocationStore(wall_clock_millis=lambda: 20)
    request_id = uuid4()
    read = _begin_tool(store, request_id=request_id)
    mutation = _begin_tool(
        store,
        request_id=request_id,
        effect=InvocationEffect.MUTATION,
    )
    store.reserve(invocation_id=read.invocation_id, usage=UsageVector(tool_calls=1))
    store.reserve(invocation_id=mutation.invocation_id, usage=UsageVector(tool_calls=1))
    store.accept_cancellation(_cancellation(request_id))

    by_id = {
        record.invocation_id: record
        for record in store.settle_cancellation(request_id)
    }

    assert by_id[read.invocation_id].state == InvocationState.UNKNOWN
    assert by_id[mutation.invocation_id].state == InvocationState.UNKNOWN_SIDE_EFFECT
    assert by_id[read.invocation_id].committed_usage == UsageVector(tool_calls=1)
    assert by_id[mutation.invocation_id].committed_usage == UsageVector(tool_calls=1)


def test_completed_invocation_is_immutable_during_task_cancellation() -> None:
    store = InMemoryInvocationStore(wall_clock_millis=lambda: 20)
    request_id = uuid4()
    record = _begin_tool(store, request_id=request_id)
    store.reserve(invocation_id=record.invocation_id, usage=UsageVector(tool_calls=1))
    completed = store.complete(
        invocation_id=record.invocation_id,
        result_payload={"ok": True},
        committed_usage=UsageVector(tool_calls=1),
    )
    store.accept_cancellation(_cancellation(request_id))

    settled = store.settle_cancellation(request_id)

    assert settled == (completed,)
    assert settled[0].state == InvocationState.COMPLETED
    assert settled[0].committed_usage == UsageVector(tool_calls=1)


def test_exact_cancellation_replays_and_changed_content_conflicts() -> None:
    store = InMemoryInvocationStore(wall_clock_millis=lambda: 20)
    request_id = uuid4()
    cancellation_id = uuid4()
    request = _cancellation(request_id, cancellation_id=cancellation_id)

    first = store.accept_cancellation(request)
    replay = store.accept_cancellation(request)

    assert replay == first
    with pytest.raises(InvocationCancellationConflictError, match="different content"):
        store.accept_cancellation(
            _cancellation(
                request_id,
                cancellation_id=cancellation_id,
                reason="changed request content",
            )
        )


def test_cancellation_does_not_cross_task_boundary() -> None:
    store = InMemoryInvocationStore(wall_clock_millis=lambda: 20)
    cancelled_request = uuid4()
    other_request = uuid4()
    cancelled = _begin_tool(store, request_id=cancelled_request)
    other = _begin_tool(store, request_id=other_request)
    store.accept_cancellation(_cancellation(cancelled_request))

    store.settle_cancellation(cancelled_request)
    reserved_other = store.reserve(
        invocation_id=other.invocation_id,
        usage=UsageVector(tool_calls=1),
    )

    assert store.get(cancelled.invocation_id).state == InvocationState.CANCELLED
    assert reserved_other.state == InvocationState.RESERVED


def test_sqlite_reopen_preserves_fence_and_blocks_future_work(tmp_path: Path) -> None:
    path = tmp_path / "invocations.sqlite3"
    request_id = uuid4()
    first = SQLiteInvocationStore(path, wall_clock_millis=lambda: 20)
    pending = _begin_tool(first, request_id=request_id, owner_id=uuid4())
    fence = first.accept_cancellation(_cancellation(request_id))
    first.close()

    reopened = SQLiteInvocationStore(path, wall_clock_millis=lambda: 30)

    assert reopened.get_cancellation_fence(request_id) == fence
    assert reopened.get(pending.invocation_id).state == InvocationState.CANCELLED
    with pytest.raises(InvocationCancellationFencedError):
        _begin_tool(reopened, request_id=request_id)
    reopened.close()


def test_sqlite_fence_exact_replay_survives_reopen(tmp_path: Path) -> None:
    path = tmp_path / "invocations.sqlite3"
    request_id = uuid4()
    cancellation_id = uuid4()
    request = _cancellation(request_id, cancellation_id=cancellation_id)
    first = SQLiteInvocationStore(path, wall_clock_millis=lambda: 20)
    created = first.accept_cancellation(request)
    first.close()

    reopened = SQLiteInvocationStore(path, wall_clock_millis=lambda: 30)
    replayed = reopened.accept_cancellation(request)

    assert replayed == created
    assert replayed.ownership_snapshot_sha256 == created.ownership_snapshot_sha256
    reopened.close()
