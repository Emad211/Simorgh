name: PR39 RC3 Ruff Diagnostic

on:
  push:
    branches:
      - core/durable-agent-invocation-store

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr39-rc3-ruff-diagnostic
  cancel-in-progress: true

env:
  STATUS_COMMENT_ID: '5083518493'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify and extract RC3
        shell: bash
        run: |
          set -euo pipefail
          cat .simorgh-patches/pr39-rc3/part-*.b64 | base64 --decode > "$RUNNER_TEMP/pr39-rc3.zip"
          echo 'dde9c1eed40d319b1fde9e913b3510aa0fd4fa0e36b31436d58c8d231fa2f2a4  '"$RUNNER_TEMP/pr39-rc3.zip" | sha256sum --check
          mkdir "$RUNNER_TEMP/pr39-rc3-bundle"
          unzip -q "$RUNNER_TEMP/pr39-rc3.zip" -d "$RUNNER_TEMP/pr39-rc3-bundle"
          test "$(cat "$RUNNER_TEMP/pr39-rc3-bundle/VERSION")" = '2026.07.26-pr39-step1.2-hardening-rc3'
          chmod 0755 \
            "$RUNNER_TEMP/pr39-rc3-bundle/apply_pr39_complete_hardening.sh" \
            "$RUNNER_TEMP/pr39-rc3-bundle/scripts/apply_pr39_complete_hardening.sh"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Self-test and patch Publisher compatibility
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          python "$BUNDLE/scripts/selftest_pr39_hardening_bundle.py"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'pr39-rc3-bundle/scripts/apply_pr39_hardening.py'
          text = path.read_text(encoding='utf-8')
          pairs = [
              (
                  'from typing import Any, Protocol, Self\\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\\n\nfrom simorgh_core.agents.contracts import UsageVector\\n',
                  'from typing import Any, Protocol, Self\\nfrom uuid import NAMESPACE_URL, UUID, uuid5\\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\\n\nfrom simorgh_core.agents.contracts import UsageVector\\n',
              ),
              (
                  'from typing import Any, Literal, Protocol, Self, TypeAlias\\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\\n\nfrom simorgh_core.agents.contracts import InvocationState, UsageVector\\n',
                  'from typing import Any, Literal, Protocol, Self, TypeAlias\\nfrom uuid import NAMESPACE_URL, UUID, uuid5\\n\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\\n\nfrom simorgh_core.agents.contracts import InvocationState, UsageVector\\n',
              ),
          ]
          for old, new in pairs:
              if text.count(old) != 1 or text.count(new) != 0:
                  raise SystemExit('publisher compatibility anchor mismatch')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply RC3 and normalize alias
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/pr39-rc3-bundle"
          bash "$BUNDLE/apply_pr39_complete_hardening.sh" "$GITHUB_WORKSPACE" \
            --backup-dir "$RUNNER_TEMP/pr39-backups" \
            --run-targeted-tests
          python - <<'PY'
          from pathlib import Path
          path = Path('services/core/src/simorgh_core/agents/invocations.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from typing import Any, Literal, Protocol, Self, TypeAlias\n'
          old_alias = 'InvocationPhase: TypeAlias = InvocationState\n'
          if text.count(old_import) != 1 or text.count(old_alias) != 1:
              raise SystemExit('unexpected post-RC3 alias state')
          text = text.replace(old_import, 'from typing import Any, Literal, Protocol, Self\n', 1)
          text = text.replace(old_alias, 'type InvocationPhase = InvocationState\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -rf .simorgh-patches/pr39-rc3
          rmdir .simorgh-patches 2>/dev/null || true
          rm -f \
            .github/workflows/pr39-rc3-finalize.yml \
            .github/workflows/pr39-rc3-finalize-permission-safe.yml \
            .github/workflows/pr39-rc3-ruff-diagnostic.yml

      - name: Run Ruff diagnostic
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format concise 2>&1 | tee "$RUNNER_TEMP/ruff.log"

      - name: Publish Ruff result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          log = (temp / 'ruff.log').read_text(encoding='utf-8', errors='replace')[-12000:]
          body = '\n'.join([
              '<!-- pr39-rc3-status -->',
              'PR39 RC3 Ruff diagnostic:',
              '',
              f"- Head: `{os.environ['GITHUB_SHA']}`",
              f"- RC3 apply and targeted regressions: **passed**",
              f"- Ruff: **{os.environ.get('RUFF_OUTCOME', 'not-run')}**",
              f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              '', '```text', log, '```',
          ])
          (temp / 'comment.json').write_text(json.dumps({'body': body}), encoding='utf-8')
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${STATUS_COMMENT_ID}" \
            --input "$RUNNER_TEMP/comment.json"
