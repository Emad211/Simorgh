name: Audit concurrent Phase 1.3 reconciliation script

on:
  pull_request:
    branches:
      - core/specialist-execution-interface
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify and extract script without executing it
        shell: bash
        run: |
          set -euo pipefail
          source=scripts/phase13_reconcile.py.gz.b64
          test -f "$source"
          echo "34531d58090371fa05a0a4f4a3c43f1c7595596ba5f0e23fe969fc03ca023b5c  $source" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/audit"
          base64 --decode "$source" | gunzip > "$RUNNER_TEMP/audit/phase13_reconcile.py"
          echo "e93d4c22ea804cc408da10dadbe9dd8b4c3888b9619c4b3b07f5f8f5bdea87e2  $RUNNER_TEMP/audit/phase13_reconcile.py" \
            | sha256sum --check --strict
          python -m py_compile "$RUNNER_TEMP/audit/phase13_reconcile.py"
          sha256sum "$RUNNER_TEMP/audit/phase13_reconcile.py" > "$RUNNER_TEMP/audit/SHA256SUMS.txt"

      - name: Upload plain script for human audit
        uses: actions/upload-artifact@v4
        with:
          name: phase13-reconciliation-script-audit
          path: ${{ runner.temp }}/audit
          if-no-files-found: error
          retention-days: 7
