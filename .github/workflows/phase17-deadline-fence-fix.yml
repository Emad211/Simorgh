name: Phase 1.7 Deadline Fence Fix

on:
  push:
    branches:
      - core/context-compiler
    paths:
      - .github/workflows/phase17-deadline-fence-fix.yml

permissions:
  contents: write

concurrency:
  group: phase17-deadline-fence-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Patch deadline race and add regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          compiler = Path(
              "services/core/src/simorgh_core/agents/context_compiler.py"
          )
          text = compiler.read_text(encoding="utf-8")
          old = (
              "        self._require_still_active(request.request_id, now_ms=now_ms)\n"
              "        claim = self._contexts.claim(bundle)\n"
          )
          new = (
              "        self._require_still_active(\n"
              "            request.request_id,\n"
              "            now_ms=self._now_ms(),\n"
              "        )\n"
              "        claim = self._contexts.claim(bundle)\n"
          )
          if text.count(old) != 1:
              raise SystemExit(
                  f"deadline fence anchor count={text.count(old)}, expected=1"
              )
          compiler.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("services/core/tests/test_context_compiler.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "test_deadline_expiry_after_assembly_never_claims_context"
          if marker in test_text:
              raise SystemExit("deadline race regression test already exists")
          addition = dedent('''

          def test_deadline_expiry_after_assembly_never_claims_context(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              task = _task().model_copy(update={"deadline_at_ms": 3_000})
              service, _, _, _, contexts = _runtime(task=task)
              current_ms = _NOW_MS
              original_build = service._compact_and_build

              def build_then_expire(*args, **kwargs):
                  nonlocal current_ms
                  bundle = original_build(*args, **kwargs)
                  current_ms = 3_000
                  return bundle

              monkeypatch.setattr(
                  service,
                  "_wall_clock_millis",
                  lambda: current_ms,
              )
              monkeypatch.setattr(
                  service,
                  "_compact_and_build",
                  build_then_expire,
              )

              with pytest.raises(
                  ContextCompilerCancelledError,
                  match="deadline expired before context handoff",
              ):
                  service.compile(_request(task=task, invocation_id=uuid4()))

              assert contexts.load() == []
          ''')
          tests.write_text(test_text.rstrip() + addition, encoding="utf-8")

          validation = Path(
              "docs/validation/phase-1-7-context-compiler.md"
          )
          validation_text = validation.read_text(encoding="utf-8")
          note = (
              "\n- A focused deadline-race regression proves expiry after canonical "
              "assembly is re-evaluated with the current clock before durable claim; "
              "no context row is committed when the deadline wins.\n"
          )
          if "focused deadline-race regression" not in validation_text:
              validation.write_text(
                  validation_text.rstrip() + "\n" + note,
                  encoding="utf-8",
              )

          Path(
              ".github/workflows/phase17-deadline-fence-fix.yml"
          ).unlink()
          PY
          git diff --check

      - name: Run complete Core gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy services/core/src
          pytest
          git diff --check
          test ! -e .github/workflows/phase17-deadline-fence-fix.yml

      - name: Commit validated deadline fence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'core: refresh deadline authority before context claim'

      - name: Protected fast-forward push
        shell: bash
        env:
          BRANCH: core/context-compiler
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_head=$(git rev-parse "origin/$BRANCH")
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "branch moved during validation: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
